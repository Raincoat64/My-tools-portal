<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高圧ガス手続きナビ | 奈良県向け</title>
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
}

a {
  color: var(--accent);
}

.app-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-bg);
}

.app-header h1 {
  margin: 0 0 6px;
  font-size: 1.4rem;
}

.app-layout {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 16px;
  max-width: 1280px;
  margin: 16px auto;
  padding: 0 16px;
  align-items: start;
}

.main-panel {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  min-height: 60vh;
  overflow: hidden;
}

.mode-tabs {
  display: flex;
  gap: 2px;
  padding: 10px 10px 0;
  border-bottom: 1px solid var(--border);
}

.mode-tab {
  border: none;
  background: none;
  font: inherit;
  font-size: 0.92rem;
  color: var(--text-muted);
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 8px 8px 0 0;
}

.mode-tab:hover {
  background: var(--chip-bg);
}

.mode-tab.active {
  color: var(--accent);
  font-weight: 700;
  background: var(--chip-bg);
}

.diag-help {
  color: var(--text-muted);
  font-size: 0.82rem;
  margin: -6px 0 12px;
}

.diag-number-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 14px;
}

.diag-number-row input[type="number"] {
  font: inherit;
  font-size: 1rem;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-bg);
  color: var(--text);
  width: 160px;
}

.diag-number-row .unit {
  color: var(--text-muted);
}

.diag-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.btn-primary {
  font: inherit;
  padding: 8px 18px;
  border: none;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-contrast);
  cursor: pointer;
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.verdict-banner {
  padding: 14px 16px;
  border-radius: 10px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
}

.verdict-title {
  font-weight: 700;
  font-size: 1.05rem;
  margin-bottom: 4px;
}

.verdict-summary {
  color: var(--text-muted);
}

.citation-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
}

.citation-toggle {
  width: 100%;
  text-align: left;
  background: var(--panel-bg);
  border: none;
  font: inherit;
  padding: 10px 12px;
  cursor: pointer;
  color: var(--text);
}

.citation-toggle:hover {
  background: var(--chip-bg);
}

.citation-body {
  padding: 4px 12px 12px;
  border-top: 1px solid var(--border);
}

.note-box {
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--chip-bg);
  color: var(--text-muted);
  font-size: 0.85rem;
  margin: 10px 0;
}

.breadcrumb {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}

.breadcrumb button {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font: inherit;
  padding: 4px 6px;
  border-radius: 6px;
}

.breadcrumb button:hover {
  background: var(--chip-bg);
}

.breadcrumb .crumb-current {
  color: var(--text-muted);
  padding: 4px 6px;
}

.breadcrumb .crumb-sep {
  color: var(--text-muted);
}

.stage {
  padding: 16px;
}

.stage h2 {
  margin: 0 0 12px;
  font-size: 1rem;
  color: var(--text-muted);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}

.pick-card {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--panel-bg);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
  font: inherit;
  color: var(--text);
  transition: border-color 0.15s, background 0.15s;
}

.pick-card:hover {
  border-color: var(--accent);
  background: var(--chip-bg);
}

.pick-card .pick-title {
  font-weight: 600;
  display: block;
}

.pick-card .pick-sub {
  display: block;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.pick-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.pick-list .pick-card {
  padding: 10px 14px;
}

.loading,
.error-box {
  padding: 24px 8px;
  color: var(--text-muted);
  text-align: center;
}

.error-box {
  color: var(--danger);
}

.toolbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 8px;
}

.btn-link {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font: inherit;
  font-size: 0.82rem;
  padding: 4px 6px;
}

.btn-link:hover {
  text-decoration: underline;
}

/* --- 条文表示 --- */

.article {
  padding: 4px 4px 20px;
}

.article-head {
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
}

.article-caption {
  display: block;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.article-title {
  display: block;
  font-size: 1.15rem;
  font-weight: 700;
}

.paragraph {
  margin: 10px 0;
}

.paragraph-caption {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.paragraph-line {
  display: flex;
  gap: 6px;
  align-items: baseline;
}

.para-num {
  min-width: 1.6em;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.para-text,
.item-text,
.list-line {
  white-space: pre-wrap;
}

.item-list,
.subitem-list {
  margin: 4px 0 4px 1.8em;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.subitem-list.level-2 {
  margin-left: 1.6em;
}

.subitem-list.level-3 {
  margin-left: 1.6em;
}

.item-line {
  display: flex;
  gap: 6px;
  align-items: baseline;
}

.item-title {
  color: var(--text-muted);
  white-space: nowrap;
}

.list-block {
  margin: 6px 0 6px 1.8em;
  color: var(--text);
}

.remarks {
  margin: 10px 0 10px 1.2em;
  padding: 8px 12px;
  border-left: 3px solid var(--border);
  background: var(--chip-bg);
  border-radius: 0 6px 6px 0;
}

.remarks-label {
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.generic-block {
  margin: 6px 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.law-table {
  border-collapse: collapse;
  margin: 10px 0 10px 1.2em;
  font-size: 0.88rem;
}

.law-table td {
  border: 1px solid var(--border);
  padding: 4px 8px;
  vertical-align: top;
}

/* --- 履歴パネル --- */

.history-panel {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 14px;
  max-height: 80vh;
  overflow-y: auto;
  position: sticky;
  top: 16px;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.history-header h2 {
  margin: 0;
  font-size: 0.95rem;
}

.history-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.history-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
  font-size: 0.82rem;
  position: relative;
}

.history-item:hover {
  border-color: var(--accent);
  background: var(--chip-bg);
}

.history-item .h-law {
  display: inline-block;
  font-size: 0.72rem;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--chip-bg);
  color: var(--accent);
  margin-bottom: 4px;
}

.history-item .h-title {
  display: block;
  font-weight: 600;
}

.history-item .h-time {
  display: block;
  color: var(--text-muted);
  font-size: 0.72rem;
  margin-top: 2px;
}

.history-item .h-delete {
  position: absolute;
  top: 6px;
  right: 6px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.75rem;
  padding: 2px 4px;
}

.history-item .h-delete:hover {
  color: var(--danger);
}

.history-empty {
  color: var(--text-muted);
  font-size: 0.85rem;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 0.85rem;
  box-shadow: var(--shadow);
}

/* 手続きナビ：申請準備を主役にする、明るい業務画面。 */
:root {
  color-scheme: light;
  --bg: #f3f5f4;
  --panel-bg: #fff;
  --border: #cbd5ce;
  --text: #182d25;
  --text-muted: #52645a;
  --accent: #216047;
  --accent-contrast: #fff;
  --chip-bg: #edf4ef;
  --danger: #a12e26;
  --shadow: none;
}
body { font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; font-size: 16px; line-height: 1.8; }
button, input, select { font: inherit; }
button, select, input:not([type="checkbox"]), summary { min-height: 44px; }
button, a, summary, input, select { -webkit-tap-highlight-color: transparent; }
button { color: var(--text); }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #be7510; outline-offset: 3px; }
a { text-underline-offset: .2em; overflow-wrap: anywhere; }
p { margin: .6em 0; }
h2, h3, h4 { line-height: 1.55; }
[hidden] { display: none !important; }
.skip-link { position: absolute; left: 16px; top: -100px; z-index: 10; background: white; padding: 8px 16px; }
.skip-link:focus { top: 8px; }
.app-header { padding: 22px 24px; border-top: 5px solid var(--accent); }
.header-inner { max-width: 1080px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.app-region { margin: 0 0 2px; font-size: 14px; color: var(--text-muted); }
.app-header h1 { font-size: 25px; margin: 0; letter-spacing: .02em; }
.header-inner > a { font-size: 15px; }
.app-layout { display: block; max-width: 1136px; margin: 24px auto; padding: 0 24px; }
.main-panel { border-radius: 8px; min-height: 0; overflow: visible; }
.mode-tabs { padding: 0 24px; gap: 20px; flex-wrap: wrap; }
.mode-tab { font-size: 16px; padding: 16px 4px 13px; border-radius: 0; border-bottom: 3px solid transparent; }
.mode-tab.active { border-bottom-color: var(--accent); background: transparent; }
.mode-tab:hover { background: transparent; color: var(--accent); }
.breadcrumb { padding: 8px 28px; border-bottom: 0; font-size: 15px; gap: 4px; }
.breadcrumb button { min-height: 44px; padding: 6px 4px; }
.stage { padding: 12px 36px 36px; min-width: 0; }
.stage .stage { padding: 0; }
.stage h2 { margin: 0 0 20px; color: var(--text); font-size: 26px; font-weight: 700; }
.stage h2:focus { outline: none; }
.stage :is(h3, h4) { color: var(--text); font-size: 20px; margin: 0 0 12px; }
.home-intro { margin: 6px 0 30px; }
.home-intro h2 { font-size: 36px; white-space: pre-line; letter-spacing: .01em; line-height: 1.5; margin-bottom: 12px; }
.home-lead { color: var(--text-muted); font-size: 18px; }
.home-entry { margin-bottom: 32px; }
.home-entry > h3 { margin-bottom: 0; }
.purpose-grid { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.purpose-option { position: relative; background: transparent; border: 0; border-bottom: 1px solid var(--border); text-align: left; padding: 20px 32px 20px 0; cursor: pointer; line-height: 1.7; }
.purpose-option:hover { background: var(--chip-bg); }
.purpose-option .pick-title { display: block; font-weight: 700; font-size: 18px; }
.purpose-option .pick-sub { display: block; color: var(--text-muted); font-size: 15px; margin-top: 5px; }
.purpose-arrow { position: absolute; right: 4px; top: 20px; font-size: 22px; color: var(--accent); }
.primary-purpose { color: var(--accent); }
.home-search { background: var(--chip-bg); padding: 24px; border-radius: 6px; margin: 32px 0; }
.home-search h3 { margin-bottom: 4px; }
.search-form { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; margin-top: 18px; }
.search-form label { grid-column: 1 / -1; font-weight: 600; }
.search-form input { min-width: 0; width: 100%; padding: 10px 12px; border: 1px solid #91a297; border-radius: 5px; background: #fff; color: var(--text); }
.btn-primary, .btn-secondary { min-height: 44px; padding: 10px 20px; border-radius: 5px; line-height: 1.5; font-size: 16px; }
.btn-primary { border: 1px solid var(--accent); }
.btn-primary:hover { background: #174d38; }
.btn-secondary { border: 1px solid #91a297; background: white; color: var(--accent); cursor: pointer; }
.btn-secondary:hover { background: var(--chip-bg); }
.btn-link { font-size: 16px; min-height: 44px; padding: 8px; }
.pick-list { gap: 12px; margin: 20px 0; max-width: 850px; }
.pick-card, .pick-list .pick-card { padding: 18px 20px; border-radius: 5px; line-height: 1.7; }
.pick-card .pick-title { font-size: 18px; }
.pick-card .pick-sub { font-size: 16px; margin-top: 6px; }
.card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.diag-help { font-size: 16px; margin: 0 0 20px; max-width: 850px; line-height: 1.9; }
.diag-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 26px 0 14px; }
.diag-number-row { flex-wrap: wrap; }
.diag-number-row input[type="number"] { width: 220px; max-width: 100%; font-size: 20px; }
.flow-progress { list-style: none; padding: 0; display: flex; margin: 0 0 28px; gap: 24px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 15px; }
.flow-progress li { padding: 0 0 12px; }
.flow-progress [aria-current] { border-bottom: 3px solid var(--accent); color: var(--accent); font-weight: 700; }
.progress-label { font-size: 16px; font-weight: 600; color: var(--accent); margin: 0 0 14px; }
.support-details { border-top: 1px solid var(--border); margin: 24px 0 0; padding: 12px 0; }
.support-details summary, .history-panel summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
.support-details > p { max-width: 850px; }
.support-text, .guide-applicability, .procedure-meta { color: var(--text-muted); font-size: 16px; }
.resume-strip { padding: 14px 18px; border-left: 4px solid var(--accent); background: var(--chip-bg); display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 28px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin: 22px 0; }
.filter-row label { display: flex; flex-direction: column; gap: 5px; min-width: 150px; max-width: 100%; }
select { padding: 8px 10px; border: 1px solid #91a297; border-radius: 5px; background: white; color: var(--text); max-width: 100%; }
.procedure-list { border-top: 1px solid var(--border); }
.procedure-row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; padding: 20px 8px; cursor: pointer; line-height: 1.7; }
.procedure-row:hover { background: var(--chip-bg); }
.procedure-row span { display: block; }
.procedure-row .pick-title { font-size: 19px; font-weight: 700; color: var(--accent); margin: 4px 0; }
.procedure-row .pick-sub { color: var(--text-muted); }
.procedure-meta { margin: 0 0 6px; font-size: 14px; }
.verdict-banner { border-radius: 5px; padding: 20px 24px; margin-bottom: 24px; }
.verdict-banner.permit { background: #e7f2ed; color: #174a38; border-color: #628973; }
.verdict-banner.notification { background: #eaf2fc; color: #163d66; border-color: #6686ac; }
.verdict-banner.none { background: #f0f2f4; color: #36414b; border-color: #8c959d; }
.verdict-banner.needs_confirmation, .verdict-banner.invalid, .verdict-banner.other_law { background: #fff4d6; color: #674600; border-color: #b68127; }
.verdict-title { font-size: 21px; }
.stage .verdict-banner .verdict-title, .verdict-banner .verdict-summary { color: inherit; }
.note-box { font-size: 16px; border-radius: 4px; line-height: 1.85; padding: 16px 18px; margin: 16px 0; }
.procedure-guide { margin: 28px 0; }
.stage .procedure-guide .procedure-title { font-size: 25px; margin-bottom: 12px; }
.deadline-box { border-left: 4px solid var(--accent); background: var(--chip-bg); padding: 16px 20px; margin: 20px 0; }
.deadline-box > p { font-size: 20px; font-weight: 700; margin: 4px 0 0; }
.contact-step { padding: 18px 20px; background: #fff6e6; border-left: 4px solid #ad781d; margin: 20px 0; }
.contact-step :is(h3, h4) { font-size: 18px; margin-bottom: 6px; }
.guide-section { margin-top: 32px; }
.guide-jumps { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 16px 0; }
.guide-jumps a { min-height: 44px; display: inline-flex; align-items: center; }
.guide-section :is(h3, h4) { padding-bottom: 12px; border-bottom: 2px solid var(--accent); }
.check-progress { font-size: 16px; color: var(--accent); font-weight: 600; margin: 20px 0 8px; }
.document-list { list-style: none; padding: 0; margin: 0; }
.document-row { padding: 17px 0; border-bottom: 1px solid var(--border); }
.document-check { display: flex; gap: 14px; align-items: start; cursor: pointer; min-height: 44px; }
.document-check input { flex-shrink: 0; width: 22px; height: 22px; margin: 5px 0 0; accent-color: var(--accent); }
.document-check > span { display: block; }
.document-check strong { display: block; font-weight: 600; font-size: 17px; }
.requirement { display: block; font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.requirement.conditional, .requirement.unconfirmed { color: #865600; }
.document-help { margin: 6px 0 0 36px; font-size: 16px; color: var(--text-muted); }
.document-alternatives { margin: 8px 0 4px 36px; padding-left: 22px; font-size: 16px; }
.condition-field { margin: 12px 0 0 36px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.not-applicable { background: #f5f6f5; padding-left: 8px; }
.not-applicable .requirement { color: var(--text-muted); }
.download-list { display: flex; gap: 12px; flex-wrap: wrap; }
.download-link { display: block; padding: 12px 16px; border: 1px solid #91a297; border-radius: 5px; text-decoration: none; font-weight: 600; background: var(--chip-bg); }
.download-link:hover { background: #ddece2; }
.submission-list { display: grid; grid-template-columns: 120px minmax(0, 1fr); margin: 0; }
.submission-list dt, .submission-list dd { border-bottom: 1px solid var(--border); margin: 0; padding: 14px 8px; white-space: pre-line; }
.submission-list dt { color: var(--text-muted); font-weight: 600; }
.answer-row { border-bottom: 1px solid var(--border); padding: 10px 0; }
.answer-row p { margin: 0; color: var(--text-muted); }
.answer-row strong { margin-right: 16px; }
.citation-card { border-radius: 4px; }
.citation-toggle { font-size: 16px; }
.citation-body { overflow-x: auto; }
.article-caption, .paragraph-caption, .remarks-label, .generic-block, .law-table { font-size: 16px; }
.law-table { max-width: 100%; margin-left: 0; overflow-wrap: anywhere; }
.article { overflow-x: auto; }
.history-panel { position: static; margin-top: 24px; padding: 12px 24px; max-height: none; border-radius: 6px; }
.history-list { max-height: 420px; overflow: auto; }
.history-item { display: flex; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 0; }
.history-open { flex: 1; border: 0; background: transparent; text-align: left; padding: 14px 8px; min-width: 0; cursor: pointer; }
.history-item .h-delete { position: static; min-width: 44px; min-height: 44px; font-size: 24px; }
.history-item .h-title { font-size: 16px; }
.history-item .h-time, .history-item .h-law { font-size: 14px; }
.history-empty { font-size: 16px; }
.app-footer { max-width: 1136px; margin: 24px auto 40px; padding: 0 24px; color: var(--text-muted); font-size: 14px; }
.storage-status { margin: 8px 36px; padding: 14px; background: #fff6e6; color: #684305; }

  <footer class="app-footer"><p>奈良県の手続き案内を整理した参考ツールです。県の公式サイトではありません。</p><p>対象：一般則・液石則・冷凍則。条文閲覧では容器則にも対応。<a href="https://laws.e-gov.go.jp/" target="_blank" rel="noopener noreferrer">法令出典：e-Gov法令検索 ↗<span class="sr-only">(新しいタブで開きます)</span></a></p></footer>

  <noscript>このツールの利用にはJavaScriptを有効にしてください。上部の「奈良県の公式案内」からも手続き・様式を確認できます。</noscript>

  <script>
"use strict";

/* =========================================================
   constants.js
   ========================================================= */

// 対象4法令(高圧ガス保安法関係省令)の law_id は e-Gov 法令API v2 の
// GET /laws?law_title=... で事前に確認済みの値。
const TARGET_LAWS = [
  {
    lawId: "341M50000400053",
    shortName: "一般則",
    title: "一般高圧ガス保安規則",
  },
  {
    lawId: "341M50000400052",
    shortName: "液石則",
    title: "液化石油ガス保安規則",
  },
  {
    lawId: "341M50000400051",
    shortName: "冷凍則",
    title: "冷凍保安規則",
  },
  {
    lawId: "341M50000400050",
    shortName: "容器則",
    title: "容器保安規則",
  },
];

// 設問モードの判定根拠として条文を引用するために参照する法令(政令・法律本体)。
// 対象4法令(省令)とは別に、根拠条文の原文表示のためだけに使う。
const REFERENCE_LAWS = [
  {
    lawId: "342AC0000000149",
    shortName: "液化石油ガス法",
    title: "液化石油ガスの保安の確保及び取引の適正化に関する法律",
  },
  {
    lawId: "326AC0000000204",
    shortName: "法",
    title: "高圧ガス保安法",
  },
  {
    lawId: "409CO0000000020",
    shortName: "施行令",
    title: "高圧ガス保安法施行令",
  },
];

const ALL_LAWS = [...TARGET_LAWS, ...REFERENCE_LAWS];

function findLawMeta(lawId) {
  return ALL_LAWS.find((l) => l.lawId === lawId) || null;
}

const API_BASE = "https://laws.e-gov.go.jp/api/2";

/* =========================================================
   api.js
   ========================================================= */

// 法令本文全体を取得する。e-Gov 法令API v2 /law_data/{law_id_or_num}
// レスポンスは { law_info, revision_info, law_full_text, ... } の形。
async function fetchLawData(lawId) {
  const url = `${API_BASE}/law_data/${encodeURIComponent(lawId)}?response_format=json`;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error(`法令データの取得に失敗しました (HTTP ${res.status}): ${lawId}`);
    const data = await res.json();
    if (data?.law_full_text?.tag !== "Law" || !Array.isArray(data.law_full_text.children)) {
      throw new Error("法令本文を読み取れませんでした。保存済みデータは更新しません。");
    }
    return data;
  } finally {
    clearTimeout(timeout);
  }
}

/* =========================================================
   storage.js
   ========================================================= */

// ブラウザの IndexedDB を使った法令データキャッシュと照会履歴の永続化。
// サーバーは一切使わず、この端末・このブラウザ内にのみ保存される。

const DB_NAME = "kouatsu-gas-law-db";
const DB_VERSION = 2;
const STORE_LAW_CACHE = "lawCache";
const STORE_HISTORY = "history";
const STORE_DRAFT = "draft";

let dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  let failed = false;
  const attempt = new Promise((resolve, reject) => {
    const fail = error => { failed = true; reject(error); };
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_DRAFT)) db.createObjectStore(STORE_DRAFT);
      if (!db.objectStoreNames.contains(STORE_LAW_CACHE)) {
        db.createObjectStore(STORE_LAW_CACHE, { keyPath: "lawId" });
      }
      if (!db.objectStoreNames.contains(STORE_HISTORY)) {
        const store = db.createObjectStore(STORE_HISTORY, {
          keyPath: "id",
          autoIncrement: true,
        });
        store.createIndex("timestamp", "timestamp");
      }
    };
    req.onsuccess = () => {
      if (failed) { req.result.close(); return; }
      req.result.onversionchange = () => { req.result.close(); dbPromise = null; };
      resolve(req.result);
    };
    req.onerror = () => fail(req.error);
    req.onblocked = () => fail(new Error("別のタブを閉じて再読み込みしてください。"));
  });
  dbPromise = attempt.catch(error => { dbPromise = null; throw error; });
  return dbPromise;
}

function tx(storeName, mode) {
  return openDb().then(
    (db) => db.transaction(storeName, mode).objectStore(storeName)
  );
}

// --- 法令データキャッシュ ---

async function getCachedLaw(lawId) {
  const store = await tx(STORE_LAW_CACHE, "readonly");
  return new Promise((resolve, reject) => {
    const req = store.get(lawId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function putCachedLaw(lawId, data, updated) {
  const store = await tx(STORE_LAW_CACHE, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.put({
      lawId,
      data,
      updated: updated || null,
      fetchedAt: new Date().toISOString(),
    });
    store.transaction.oncomplete = () => resolve();
    store.transaction.onabort = () => reject(store.transaction.error || new Error("保存を完了できませんでした。"));
    req.onerror = () => reject(req.error);
  });
}

async function readDraft() {
  const store = await tx(STORE_DRAFT, "readonly");
  return new Promise((resolve, reject) => { const req = store.get("current"); req.onsuccess = () => resolve(req.result || null); req.onerror = () => reject(req.error); });
}

async function writeDraft(value) {
  const store = await tx(STORE_DRAFT, "readwrite");
  return new Promise((resolve, reject) => {
    const bounded = value.nav ? { ...value, nav: { ...value.nav, preparations: trimPreparations(value.nav.preparations) } } : value;
    store.put(bounded, "current");
    store.transaction.oncomplete = () => resolve();
    store.transaction.onabort = () => reject(store.transaction.error || new Error("下書きを保存できませんでした。"));
    store.transaction.onerror = () => reject(store.transaction.error);
  });
}

// 同じ案件の全手続き・全書類をまとめて保持する。法令キャッシュ・旧版領域は触らない。
function trimPreparations(preparations = {}, limit = 50) {
  const cases = new Map();
  for (const [index, [key, value]] of Object.entries(preparations).entries()) {
    const id = key.split(":")[0];
    const order = Number.isFinite(value.lastUsedAt) ? value.lastUsedAt : 0;
    const previous = cases.get(id);
    if (!previous || order >= previous.order) cases.set(id, { order, index });
  }
  const keep = new Set([...cases].sort((a, b) => b[1].order - a[1].order || b[1].index - a[1].index).slice(0, limit).map(([id]) => id));
  return Object.fromEntries(Object.entries(preparations).filter(([key]) => keep.has(key.split(":")[0])));
}

// --- 照会履歴 ---

const MAX_HISTORY = 200;

async function addHistoryEntry(entry) {
  const store = await tx(STORE_HISTORY, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.add({
      ...entry,
      timestamp: new Date().toISOString(),
    });
    let id;
    req.onsuccess = () => {
      id = req.result;
      let count = 0;
      const scan = store.index("timestamp").openCursor(null, "prev");
      scan.onsuccess = () => {
        const cursor = scan.result;
        if (!cursor) return;
        if (++count > MAX_HISTORY) cursor.delete();
        cursor.continue();
      };
    };
    store.transaction.oncomplete = () => resolve(id);
    store.transaction.onabort = () => reject(store.transaction.error || new Error("履歴を保存できませんでした。"));
    store.transaction.onerror = () => reject(store.transaction.error);
    req.onerror = () => reject(req.error);
  });
}

async function listHistory(limit = MAX_HISTORY) {
  const store = await tx(STORE_HISTORY, "readonly");
  return new Promise((resolve, reject) => {
    const results = [];
    const req = store.index("timestamp").openCursor(null, "prev");
    req.onsuccess = () => {
      const cursor = req.result;
      if (cursor && results.length < limit) {
        results.push(cursor.value);
        cursor.continue();
      } else {
        resolve(results);
      }
    };
    req.onerror = () => reject(req.error);
  });
}

async function clearHistory() {
  const store = await tx(STORE_HISTORY, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function deleteHistoryEntry(id) {
  const store = await tx(STORE_HISTORY, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* =========================================================
   lawTree.js
   ========================================================= */

// e-Gov 法令API v2 の law_full_text (tag/attr/children のXML由来ツリー) から
// 法令 → 章 → 節(あれば) → 条 のナビゲーション構造を組み立てるユーティリティ。

// ノード配下の文字列を再帰的に連結して取り出す(タグに関わらず安全に使える)。
function extractText(node) {
  if (typeof node === "string") return node;
  if (!node || !Array.isArray(node.children)) return "";
  return node.children.map(extractText).join("");
}

// 指定タグの直接の子ノードを1つ取得。
function findChild(node, tag) {
  if (!node || !Array.isArray(node.children)) return null;
  return node.children.find((c) => c && c.tag === tag) || null;
}

function findChildren(node, tag) {
  if (!node || !Array.isArray(node.children)) return [];
  return node.children.filter((c) => c && c.tag === tag);
}

function getChildText(node, tag) {
  const child = findChild(node, tag);
  return child ? extractText(child).trim() : "";
}

// Column を持つ文(定義規定などで「用語」「意義」のように列が分かれる場合)を
// 読みやすく全角スペース区切りで連結する。Column が無ければ通常のテキスト抽出。
function extractSentenceText(node) {
  if (!node) return "";
  const columns = findChildren(node, "Column");
  if (columns.length > 0) {
    return columns.map((c) => extractText(c).trim()).join("　");
  }
  return extractText(node).trim();
}

function makeArticleSummary(articleNode) {
  const num = articleNode.attr && articleNode.attr.Num;
  const title = getChildText(articleNode, "ArticleTitle") || `第${num}条`;
  const caption = getChildText(articleNode, "ArticleCaption");
  return { num, title, caption, node: articleNode };
}

// Section/Subsection など入れ子構造の中から Article を出現順にすべて収集する。
function collectArticlesDeep(nodes) {
  let result = [];
  for (const n of nodes || []) {
    if (!n || typeof n !== "object") continue;
    if (n.tag === "Article") {
      result.push(makeArticleSummary(n));
    } else if (Array.isArray(n.children)) {
      result = result.concat(collectArticlesDeep(n.children));
    }
  }
  return result;
}

// LawBody.MainProvision から 章(Chapter) → 節(Section) → 条(Article) の
// ナビゲーションツリーを構築する。章が無い法令は単一の仮想章にまとめる。
function buildChapters(mainProvisionNode) {
  const topChildren = (mainProvisionNode && mainProvisionNode.children) || [];
  const hasChapters = topChildren.some((c) => c && c.tag === "Chapter");

  if (!hasChapters) {
    const articles = collectArticlesDeep(topChildren);
    if (articles.length === 0) return [];
    return [
      {
        key: "c-single",
        num: null,
        title: null,
        sections: [],
        articles,
      },
    ];
  }

  const chapters = [];
  topChildren
    .filter((c) => c && c.tag === "Chapter")
    .forEach((chapterNode, ci) => {
      const num = (chapterNode.attr && chapterNode.attr.Num) || String(ci);
      const title = getChildText(chapterNode, "ChapterTitle") || `第${num}章`;
      const sections = [];
      const directArticles = [];

      for (const child of chapterNode.children || []) {
        if (!child || typeof child !== "object") continue;
        if (child.tag === "Section") {
          const sNum = (child.attr && child.attr.Num) || String(sections.length);
          const sTitle = getChildText(child, "SectionTitle") || `第${sNum}節`;
          const sArticles = collectArticlesDeep(child.children || []);
          if (sArticles.length > 0) {
            sections.push({
              key: `c${num}-s${sNum}`,
              num: sNum,
              title: sTitle,
              articles: sArticles,
            });
          }
        } else if (child.tag === "Article") {
          directArticles.push(makeArticleSummary(child));
        }
      }

      if (sections.length > 0 || directArticles.length > 0) {
        chapters.push({
          key: `c${num}`,
          num,
          title,
          sections,
          articles: directArticles,
        });
      }
    });

  return chapters;
}

function getLawTitle(lawData) {
  const lawBody = findChild(lawData.law_full_text, "LawBody");
  return getChildText(lawBody, "LawTitle") || lawData.revision_info?.law_title || "";
}

function getMainProvision(lawData) {
  const lawBody = findChild(lawData.law_full_text, "LawBody");
  return findChild(lawBody, "MainProvision");
}

// 条番号(例: "5", "3_2")を指定して、法令内から該当条文ノードを1件検索する。
// 設問モードの判定根拠(引用条文)を表示するために使う。
function findArticleByNum(mainProvisionNode, num) {
  const stack = [mainProvisionNode];
  while (stack.length > 0) {
    const node = stack.pop();
    if (!node || typeof node !== "object") continue;
    if (node.tag === "Article" && node.attr && node.attr.Num === num) {
      return makeArticleSummary(node);
    }
    for (const c of node.children || []) {
      if (c && typeof c === "object") stack.push(c);
    }
  }
  return null;
}

/* =========================================================
   render.js
   ========================================================= */

// 条文(Article)ノードを人間が読みやすいHTMLに変換する再帰レンダラー。
// e-Gov法令標準XMLスキーマの主要タグ(Paragraph/Item/Subitem1-3/List/Table等)を
// 明示的に扱い、未対応タグはテキストのみ安全に抽出するフォールバックを持つ。

function renderEscapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function renderFindChild(node, tag) {
  if (!node || !Array.isArray(node.children)) return null;
  return node.children.find((c) => c && c.tag === tag) || null;
}
function renderFindChildren(node, tag) {
  if (!node || !Array.isArray(node.children)) return [];
  return node.children.filter((c) => c && c.tag === tag);
}
function textOf(node, tag) {
  const c = renderFindChild(node, tag);
  return c ? extractText(c).trim() : "";
}

function renderArticle(articleNode) {
  const title = textOf(articleNode, "ArticleTitle");
  const caption = textOf(articleNode, "ArticleCaption");

  let html = '<div class="article">';
  html += '<div class="article-head">';
  if (caption) {
    html += `<span class="article-caption">${renderEscapeHtml(caption)}</span>`;
  }
  html += `<span class="article-title">${renderEscapeHtml(title)}</span>`;
  html += "</div>";

  for (const child of articleNode.children || []) {
    if (!child || typeof child !== "object") continue;
    if (child.tag === "Paragraph") {
      html += renderParagraph(child);
    } else if (child.tag === "ArticleCaption" || child.tag === "ArticleTitle") {
      // 見出しとして既に表示済み
    } else if (typeof child !== "string") {
      html += renderGenericBlock(child);
    }
  }

  html += "</div>";
  return html;
}

function renderParagraph(p) {
  const numText = textOf(p, "ParagraphNum"); // 第1項は空、第2項以降は全角数字
  const caption = textOf(p, "ParagraphCaption");
  const sentenceNode = renderFindChild(p, "ParagraphSentence");
  const sentenceText = sentenceNode ? extractSentenceText(sentenceNode) : "";

  let html = '<div class="paragraph">';
  if (caption) {
    html += `<div class="paragraph-caption">${renderEscapeHtml(caption)}</div>`;
  }
  html += '<div class="paragraph-line">';
  html += `<span class="para-num">${renderEscapeHtml(numText)}</span>`;
  html += `<span class="para-text">${renderEscapeHtml(sentenceText)}</span>`;
  html += "</div>";

  const items = renderFindChildren(p, "Item");
  if (items.length > 0) {
    html += '<div class="item-list">' + items.map(renderItem).join("") + "</div>";
  }

  const lists = renderFindChildren(p, "List");
  if (lists.length > 0) {
    html += lists.map(renderList).join("");
  }

  const tables = renderFindChildren(p, "TableStruct");
  if (tables.length > 0) {
    html += tables.map(renderTableStruct).join("");
  }

  const remarks = renderFindChildren(p, "Remarks");
  if (remarks.length > 0) {
    html += remarks.map(renderRemarks).join("");
  }

  html += "</div>";
  return html;
}

function renderItem(item) {
  const title = textOf(item, "ItemTitle");
  const sentenceNode = renderFindChild(item, "ItemSentence");
  const sentenceText = sentenceNode ? extractSentenceText(sentenceNode) : "";

  let html = '<div class="item">';
  html += '<div class="item-line">';
  html += `<span class="item-title">${renderEscapeHtml(title)}</span>`;
  html += `<span class="item-text">${renderEscapeHtml(sentenceText)}</span>`;
  html += "</div>";

  html += renderSubitems(item, 1);

  const tables = renderFindChildren(item, "TableStruct");
  if (tables.length > 0) {
    html += tables.map(renderTableStruct).join("");
  }

  html += "</div>";
  return html;
}

function renderSubitems(node, level) {
  const tag = `Subitem${level}`;
  const subs = renderFindChildren(node, tag);
  if (subs.length === 0) return "";

  const titleTag = `${tag}Title`;
  const sentenceTag = `${tag}Sentence`;

  let html = `<div class="subitem-list level-${level}">`;
  for (const sub of subs) {
    const title = textOf(sub, titleTag);
    const sentenceNode = renderFindChild(sub, sentenceTag);
    const sentenceText = sentenceNode ? extractSentenceText(sentenceNode) : "";
    html += `<div class="subitem level-${level}">`;
    html += '<div class="item-line">';
    html += `<span class="item-title">${renderEscapeHtml(title)}</span>`;
    html += `<span class="item-text">${renderEscapeHtml(sentenceText)}</span>`;
    html += "</div>";
    html += renderSubitems(sub, level + 1);
    html += "</div>";
  }
  html += "</div>";
  return html;
}

function renderList(listNode) {
  const sentences = renderFindChildren(listNode, "ListSentence");
  if (sentences.length === 0) {
    return `<div class="list-block">${renderEscapeHtml(extractText(listNode).trim())}</div>`;
  }
  return (
    '<div class="list-block">' +
    sentences.map((s) => `<div class="list-line">${renderEscapeHtml(extractSentenceText(s))}</div>`).join("") +
    "</div>"
  );
}

function renderRemarks(remarksNode) {
  const label = textOf(remarksNode, "RemarksLabel") || "備考";
  const paragraphs = renderFindChildren(remarksNode, "Paragraph");
  let html = '<div class="remarks">';
  html += `<div class="remarks-label">${renderEscapeHtml(label)}</div>`;
  if (paragraphs.length > 0) {
    html += paragraphs.map(renderParagraph).join("");
  } else {
    html += `<div class="remarks-text">${renderEscapeHtml(extractText(remarksNode).trim())}</div>`;
  }
  html += "</div>";
  return html;
}

function renderTableStruct(tableStructNode) {
  const table = renderFindChild(tableStructNode, "Table");
  if (!table) {
    return `<div class="table-fallback">${renderEscapeHtml(extractText(tableStructNode).trim())}</div>`;
  }
  const rows = renderFindChildren(table, "TableRow");
  let html = '<table class="law-table"><tbody>';
  for (const row of rows) {
    html += "<tr>";
    const cols = renderFindChildren(row, "TableColumn");
    for (const col of cols) {
      const attr = col.attr || {};
      const attrs = [];
      if (attr.colspan) attrs.push(`colspan="${renderEscapeHtml(attr.colspan)}"`);
      if (attr.rowspan) attrs.push(`rowspan="${renderEscapeHtml(attr.rowspan)}"`);
      html += `<td ${attrs.join(" ")}>${renderEscapeHtml(extractSentenceText(col))}</td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  return html;
}

// 上記で明示的に扱っていないタグに対する安全なフォールバック。
// 内容は失わず、プレーンテキストとして表示する。
function renderGenericBlock(node) {
  const text = extractText(node).trim();
  if (!text) return "";
  return `<div class="generic-block">${renderEscapeHtml(text)}</div>`;
}

const INVALID_MESSAGE = "必要な情報が不足しているか、入力値を確認できないため判定できません。";

function isChoice(value, allowed) {
  return typeof value === "string" && allowed.includes(value);
}

function readNonNegativeNumber(value) {
  if (value === null || value === undefined) return null;
  if (typeof value === "string" && value.trim() === "") return null;
  const number = Number(value);
  return Number.isFinite(number) && number >= 0 ? number : null;
}

function invalidDiagnosis(message = INVALID_MESSAGE) {
  return { verdict: "invalid", message };
}

// invalid は画面側でも結果オブジェクトとして安全に扱えるよう、公開境界で形をそろえる。
function normalizeDiagnosisResult(result) {
  if (!result || typeof result !== "object") {
    return {
      ...invalidDiagnosis(),
      title: "確認が必要です",
      summary: INVALID_MESSAGE,
      citations: [],
      procedures: [],
    };
  }
  if (result.verdict !== "invalid") return result;
  return {
    ...result,
    title: result.title || "確認が必要です",
    summary: result.summary || result.message || INVALID_MESSAGE,
    citations: Array.isArray(result.citations) ? result.citations : [],
    procedures: Array.isArray(result.procedures) ? result.procedures : [],
  };
}

// 一般則: 施行令第3条・一般則第102条による算式。
// T(許可基準, m3/日) = 100 + (2/3)×S1 (0<=S1<=300の範囲で線形補間)
// S1=0(第一種ガスなし)のとき T=100、S1>=300(第一種ガスのみで既に300以上)のとき T=300 に自然に収束する。
function calcGeneralThreshold(s1) {
  const clamped = Math.max(0, Math.min(s1, 300));
  return 100 + (2 / 3) * clamped;
}

function evaluateGeneral(answers) {
  const { gasScope, isBusiness } = answers;
  if (!isChoice(gasScope, ["type1only", "otherOnly", "mixed"]) || !isChoice(isBusiness, ["yes", "no"])) {
    return invalidDiagnosis("ガスの種類と事業性を確認できないため判定できません。");
  }

  const citations = [
    { lawId: ACT, num: "5", label: "高圧ガス保安法 第5条(製造の許可等)" },
    { lawId: ORDER, num: "3", label: "高圧ガス保安法施行令 第3条(政令で定めるガスの種類等)" },
  ];

  let overThreshold;
  let thresholdLabel;
  let note = null;

  if (gasScope === "type1only") {
    if (!isChoice(answers.capacityBand, ["over", "under"])) return invalidDiagnosis();
    overThreshold = answers.capacityBand === "over";
    thresholdLabel = "300立方メートル/日";
  } else if (gasScope === "otherOnly") {
    if (!isChoice(answers.capacityBand, ["over", "under"])) return invalidDiagnosis();
    overThreshold = answers.capacityBand === "over";
    thresholdLabel = "100立方メートル/日";
  } else if (gasScope === "mixed") {
    const s1 = readNonNegativeNumber(answers.s1);
    const s2 = readNonNegativeNumber(answers.s2);
    if (s1 === null || s2 === null) {
      return invalidDiagnosis("混合ガスの処理能力を確認できないため判定できません。");
    }
    const total = s1 + s2;
    const threshold = calcGeneralThreshold(s1);
    overThreshold = total >= threshold;
    thresholdLabel = `約${threshold.toFixed(1)}立方メートル/日(第一種ガス処理能力${s1}m³/日から算式で算出)`;
    citations.push({ lawId: IPPAN, num: "102", label: "一般高圧ガス保安規則 第102条(第一種製造者に係るガス処理容積の算定方法)" });
    if (s1 > 0 && s2 > 0) {
      note =
        "不活性ガス(第一種ガス)と可燃性ガス・毒性ガスなどを併せて扱うため、施行令第3条・一般則第102条の算式" +
        "(T=100+(2/3)×第一種ガスの処理能力)により許可基準を計算しています。";
    }
  } else {
    return { verdict: "invalid", message: "ガスの種類を選択してください。" };
  }

  if (overThreshold) {
    return {
      verdict: "permit",
      title: "第一種製造者に該当する可能性があります",
      summary: `処理能力が許可基準(${thresholdLabel})以上です。都道府県知事の許可が必要です。`,
      citations,
      procedures: IPPAN_PROCEDURES.permit,
      note,
    };
  }

  if (answers.isBusiness === "yes") {
    return {
      verdict: "notification",
      title: "第二種製造者に該当する可能性があります",
      summary: `処理能力は許可基準(${thresholdLabel})未満ですが、事業として行うため届出が必要です。`,
      citations,
      procedures: IPPAN_PROCEDURES.notification,
      note,
    };
  }

  return {
    verdict: "none",
    title: "許可・届出の対象とならない可能性があります",
    summary: "事業として行わない場合、高圧ガス保安法第5条に基づく許可・届出は不要となる可能性があります。",
    citations,
    procedures: [],
    note: "貯蔵・消費など高圧ガス保安法の他の規定が別途適用される場合があります。",
  };
}

/* ---------- 冷凍則: 製造 ---------- */

// 法第5条第1項第2号・第2項第2号は、冷凍のための製造すべてに適用される基準値そのもの(許可20トン/届出3トン)を
// 条文本体に定めており、施行令第4条はこの値を特定のガス種(第一種ガス、フルオロカーボン+アンモニア)についてのみ
// 「20トン(届出は3トン)を超える政令で定める値」(=50トン/20トン、50トン/5トン)に引き上げる規定に過ぎない。
// したがって施行令第4条の表(2行)に該当しない冷媒ガス(プロパン等)は、一般則にまわるのではなく、法本体の
// デフォルト値(許可20トン/届出3トン)がそのまま適用される。
// フルオロカーボンが「第一種ガス」側(50t/20t)に含まれるのは、施行令第2条第3項第4号の
// 燃焼性基準に適合するものに限られ、その基準に適合しないものはフルオロカーボン+アンモニア側
// (50t/5t)に該当する。根拠は施行令第4条及び一般則第101条(2026-09-19確認)。
const REFRIGERATION_GAS_TYPE_STEP = {
  id: "gasType",
  prompt: "使用する冷媒ガスの種類は?",
  type: "choice",
  options: [
    {
      value: "type1",
      label: "不活性ガス等(第一種ガス): 二酸化炭素・不活性のフルオロカーボンなど",
      help:
        "ヘリウム・ネオン・アルゴン・クリプトン・キセノン・ラドン・窒素・二酸化炭素・空気、及び難燃性の基準" +
        "(経済産業省令で定める燃焼性の基準)に適合するフルオロカーボン",
    },
    {
      value: "fluorocarbon_ammonia",
      label: "フルオロカーボン(不活性でないもの)またはアンモニア",
      help:
        "難燃性の基準(経済産業省令で定める燃焼性の基準)に適合しない、可燃性・微燃性のフルオロカーボン、及び" +
        "アンモニアが該当します。",
    },
    {
      value: "other",
      label: "フルオロカーボン又はアンモニア以外の冷媒ガス(プロパンなど)",
      help: "上記いずれにも該当しない冷媒ガスには、法第5条本体に定める基準値がそのまま適用されます。",
    },
  ],
};

function getRefrigerationThresholds(gasType) {
  if (gasType === "type1") {
    return { permitThreshold: 50, notifyThreshold: 20, gasLabel: "第一種ガス" };
  }
  if (gasType === "fluorocarbon_ammonia") {
    return { permitThreshold: 50, notifyThreshold: 5, gasLabel: "フルオロカーボン(不活性でないもの)又はアンモニア" };
  }
  return { permitThreshold: 20, notifyThreshold: 3, gasLabel: "フルオロカーボン又はアンモニア以外の冷媒ガス" };
}

function makeRefrigerationBandStep(gasType) {
  const { permitThreshold, notifyThreshold } = getRefrigerationThresholds(gasType);
  return {
    id: "capacityBand",
    prompt: "1日の冷凍能力の区分は?",
    type: "choice",
    help: "冷凍則第5条で定める算定基準による換算値です。設備の仕様書・メーカー資料でご確認ください。",
    options: [
      { value: "over", label: `${permitThreshold} トン/日 以上` },
      { value: "between", label: `${notifyThreshold} トン/日 以上 ${permitThreshold} トン/日 未満` },
      { value: "under", label: `${notifyThreshold} トン/日 未満` },
    ],
  };
}

function getRefrigerationSteps(answers) {
  const steps = [REFRIGERATION_GAS_TYPE_STEP];
  if (answers.gasType) {
    steps.push(makeRefrigerationBandStep(answers.gasType));
  }
  return steps;
}

function evaluateRefrigeration(answers) {
  if (!isChoice(answers.gasType, ["type1", "fluorocarbon_ammonia", "other"])) {
    return invalidDiagnosis("冷媒ガスの区分を確認できないため判定できません。");
  }
  if (!isChoice(answers.capacityBand, ["over", "between", "under"])) {
    return invalidDiagnosis("冷凍能力の区分を確認できないため判定できません。");
  }

  const citations = [
    { lawId: ACT, num: "5", label: "高圧ガス保安法 第5条(製造の許可等)" },
    { lawId: ORDER, num: "4", label: "高圧ガス保安法施行令 第4条(政令で定めるガスの種類等)" },
  ];

  const { permitThreshold, notifyThreshold, gasLabel } = getRefrigerationThresholds(answers.gasType);

  if (answers.capacityBand === "over") {
    return {
      verdict: "permit",
      title: "第一種製造者に該当する可能性があります",
      summary: `${gasLabel}の許可基準 ${permitThreshold} トン/日 以上に該当します。都道府県知事の許可が必要です。`,
      citations,
      procedures: REITOU_PROCEDURES.permit,
      note: null,
    };
  }

  if (answers.capacityBand === "between") {
    return {
      verdict: "notification",
      title: "第二種製造者に該当する可能性があります",
      summary: `${gasLabel}の届出基準 ${notifyThreshold} トン/日 以上、許可基準 ${permitThreshold} トン/日 未満に該当します。都道府県知事への届出が必要です。`,
      citations,
      procedures: REITOU_PROCEDURES.notification,
      note: "高圧ガス保安法第5条第2項第2号の冷凍能力による届出基準には、一般則のような事業性(事業として行うか)の要件は明記されていません。",
    };
  }

  return {
    verdict: "none",
    title: "許可・届出の対象とならない可能性があります",
    summary: `${gasLabel}の届出基準 ${notifyThreshold} トン/日 未満です。`,
    citations,
    procedures: [],
    note: "貯蔵・消費など高圧ガス保安法の他の規定が別途適用される場合があります。",
  };
}

/* ---------- 液石則: 製造 ---------- */

const LPGAS_CAPACITY_STEP = makeCapacityBandStep(
  100,
  "液化石油ガス法上の供給設備へ一般消費者向けに充塡する場合は対象外です(判定結果の注記を参照)。"
);

const LPGAS_CONSUMER_SUPPLY_STEP = {
  id: "lpgasConsumerSupply",
  prompt: "液化石油ガス法上の一般消費者等に供給するための充塡ですか?",
  type: "choice",
  help:
    "液化石油ガス法第2条第2項の『一般消費者等』に供給するための液化石油ガスの充塡は、" +
    "高圧ガス保安法第5条第1項第1号のかっこ書きにより同号の製造許可・届出の対象外となる場合があります。該当性を確認できない場合は『不明』を選んでください。",
  options: [
    { value: "yes", label: "はい(一般消費者等への供給用)" },
    { value: "no", label: "いいえ(一般消費者等への供給用ではない)" },
    { value: "unknown", label: "不明(確認できない)" },
  ],
};

function getLpgasSteps(answers) {
  if (answers.lpgasConsumerSupply !== "no") return [LPGAS_CONSUMER_SUPPLY_STEP];
  return [LPGAS_CONSUMER_SUPPLY_STEP, LPGAS_CAPACITY_STEP, BUSINESS_STEP];
}

function evaluateLpgas(answers) {
  if (!isChoice(answers.lpgasConsumerSupply, ["yes", "no", "unknown"])) {
    return invalidDiagnosis("液化石油ガスの一般消費者等向け充塡か確認できないため判定できません。");
  }
  if (answers.lpgasConsumerSupply === "unknown") {
    return invalidDiagnosis("液化石油ガスの一般消費者等向け充塡か不明なため、不要とは判定しません。");
  }
  if (answers.lpgasConsumerSupply === "yes") {
    return {
      verdict: "other_law",
      title: "液化石油ガス法の対象となる可能性があります",
      summary:
        "液化石油ガス法上の一般消費者等に供給するための充塡は、高圧ガス保安法第5条第1項第1号のかっこ書きにより、同号の製造許可・届出の対象外となる場合があります。",
      citations: [
        { lawId: ACT, num: "5", label: "高圧ガス保安法 第5条第1項第1号(液化石油ガスの適用除外)" },
        { lawId: LPG_ACT, num: "2", label: "液化石油ガス法 第2条第2項(一般消費者等)" },
      ],
      procedures: [],
      note:
        "液化石油ガス法その他の関係法令上の登録・届出・保安規制の要否は、本ツールの対象外です。" +
        "事業所所在地を管轄する都道府県にご確認ください。",
    };
  }
  if (!isChoice(answers.capacityBand, ["over", "under"]) || !isChoice(answers.isBusiness, ["yes", "no"])) {
    return invalidDiagnosis("液化石油ガスの処理能力と事業性を確認できないため判定できません。");
  }

  const citations = [
    { lawId: ACT, num: "5", label: "高圧ガス保安法 第5条(製造の許可等)" },
    { lawId: ORDER, num: "3", label: "高圧ガス保安法施行令 第3条(政令で定めるガスの種類等)" },
  ];
  const lpgasNote =
    "液化石油ガスの保安の確保及び取引の適正化に関する法律(液化石油ガス法)上の供給設備へ一般消費者向けにガスを充塡する行為は、" +
    "高圧ガス保安法第5条第1項第1号のかっこ書きにより本条の対象外です。該当する場合は液化石油ガス法上の規制(別途登録等)をご確認ください。";

  if (answers.capacityBand === "over") {
    return {
      verdict: "permit",
      title: "第一種製造者に該当する可能性があります",
      summary: "処理能力が許可基準(100立方メートル/日)以上です。都道府県知事の許可が必要です。",
      citations,
      procedures: EKISEKI_PROCEDURES.permit,
      note: lpgasNote,
    };
  }

  if (answers.isBusiness === "yes") {
    return {
      verdict: "notification",
      title: "第二種製造者に該当する可能性があります",
      summary: "処理能力は許可基準(100立方メートル/日)未満ですが、事業として行うため届出が必要です。",
      citations,
      procedures: EKISEKI_PROCEDURES.notification,
      note: lpgasNote,
    };
  }

  return {
    verdict: "none",
    title: "許可・届出の対象とならない可能性があります",
    summary: "事業として行わない場合、高圧ガス保安法第5条に基づく許可・届出は不要となる可能性があります。",
    citations,
    procedures: [],
    note: lpgasNote,
  };
}

/* ---------- 販売事業 ---------- */
//
// 高圧ガス保安法第20条の4(販売事業の届出)は、処理能力のような数値基準を持たず、
// 「販売所ごとに事業開始の20日前までに届出」が原則。以下の場合は届出不要:
//  一号: 第一種製造者(法第5条第1項第1号=一般則・液石則の許可)が、自ら製造した高圧ガスを
//        その製造事業所内で販売するとき。※冷凍(法第5条第1項第2号)の第一種製造者は
//        この号の対象外(条文上「第五条第一項第一号に規定する者」に限定されているため)。
//  二号: 施行令第6条の六類型(医療用、300mL以下容器で35℃・20MPa以下、消火器、
//        1.2L以下容器の液化フルオロカーボン、自動車等、指定緩衝装置)を、
//        貯蔵数量が常時5立方メートル未満の販売所で販売するとき。
// また、LPガスの一般消費者向け供給(液化石油ガス法上の供給設備への充塡・供給)は、
// 同条本文かっこ書きにより高圧ガス保安法の届出対象外(液化石油ガス法の管轄)。

const SALES_LPGAS_CONSUMER_STEP = {
  id: "lpgasConsumer",
  prompt: "液化石油ガス法上の一般消費者等に販売しますか?",
  type: "choice",
  help:
    "家庭用などの一般消費者への販売だけでなく、液化石油ガス法第2条第2項の『一般消費者等』(消費態様が生活用に類似する政令指定の者を含む)への販売を指します。" +
    "該当する場合は高圧ガス保安法ではなく、液化石油ガス法第2条第3項・第3条の登録対象です。",
  options: [
    { value: "yes", label: "はい(液石法上の一般消費者等への販売)" },
    { value: "no", label: "いいえ(業務用・産業用などへの販売)" },
    { value: "unknown", label: "不明(該当性を確認できない)" },
  ],
};

const SALES_SMALL_EXCEPTION_STEP = {
  id: "smallSalesException",
  prompt: "販売届出の政令指定少量例外に該当しますか?",
  type: "choice",
  help:
    "高圧ガス保安法第20条の4第2号・施行令第6条に定める次のいずれかの高圧ガスで、販売所の貯蔵数量が常時5立方メートル未満である場合に限ります。" +
    "対象は、医療用(大臣指定の種類を除く)、内容積300mL以下の容器内で35℃・20MPa以下(大臣指定の種類を除く)、消火器内、内容積1.2L以下の容器内の液化フルオロカーボン、" +
    "自動車又はその部分品内(大臣指定のものを除く)、大臣指定の緩衝装置内の高圧ガスです。両方を確認できない場合は『不明』を選んでください。",
  options: [
    { value: "yes", label: "はい(令第6条の対象ガスかつ常時5m³未満)" },
    { value: "no", label: "いいえ(例外に該当しない)" },
    { value: "unknown", label: "不明(確認できない)" },
  ],
};

const SALES_SELF_STEP = {
  id: "selfSale",
  prompt: "法第5条第1項第1号の第一種製造者として、自ら製造した高圧ガスをその製造事業所内で販売しますか?",
  type: "choice",
  help:
    "一般則又は液石則の法第5条第1項第1号に該当する第一種製造者が、自社の製造事業所内で自ら製造した高圧ガスを販売する場合、販売事業の届出は不要です" +
    "(高圧ガス保安法第20条の4第1号)。",
  options: [
    { value: "yes", label: "はい(第一種製造者による自社製造所内の販売のみ)" },
    { value: "no", label: "いいえ(第二種製造者、仕入れ、または事業所外の販売を含む)" },
  ],
};

function getSalesSteps(gasCategoryId, answers) {
  const steps = [];
  if (gasCategoryId === "lpgas") {
    steps.push(SALES_LPGAS_CONSUMER_STEP);
    if (answers.lpgasConsumer === "yes") return steps;
    if (answers.lpgasConsumer !== "no") return steps;
  }
  steps.push(SALES_SMALL_EXCEPTION_STEP);
  if (answers.smallSalesException !== "no") return steps;
  if (gasCategoryId !== "refrigeration") {
    steps.push(SALES_SELF_STEP);
  }
  return steps;
}

function evaluateSales(gasCategoryId, answers) {
  if (!isChoice(gasCategoryId, ["general", "refrigeration", "lpgas"])) {
    return invalidDiagnosis("販売する高圧ガスの区分を確認できないため判定できません。");
  }

  const baseCitation = { lawId: ACT, num: "20_4", label: "高圧ガス保安法 第20条の4(販売事業の届出)" };

  if (gasCategoryId === "lpgas") {
    if (!isChoice(answers.lpgasConsumer, ["yes", "no", "unknown"])) {
      return invalidDiagnosis("液化石油ガス法上の販売区分を確認できないため判定できません。");
    }
    if (answers.lpgasConsumer === "unknown") {
      return invalidDiagnosis("液化石油ガス法上の販売区分が不明なため、不要とは判定しません。");
    }
    if (answers.lpgasConsumer === "yes") {
      return {
        verdict: "other_law",
        title: "液化石油ガス法の対象となる可能性があります",
        summary:
          "一般消費者向けの液化石油ガス供給は、高圧ガス保安法第20条の4のかっこ書きにより本条の対象外です。" +
          "液化石油ガス法上の販売事業登録が必要です。",
        citations: [
          baseCitation,
          { lawId: LPG_ACT, num: "2", label: "液化石油ガス法 第2条第2項(一般消費者等)" },
          { lawId: LPG_ACT, num: "3", label: "液化石油ガス法 第3条(販売事業の登録)" },
        ],
        procedures: [],
        note:
          "液化石油ガスの保安の確保及び取引の適正化に関する法律(液化石油ガス法)上の登録等の要否・手続きについては、" +
          "本ツールの対象外です。事業所所在地を管轄する都道府県にご確認ください。",
      };
    }
  }

  if (!isChoice(answers.smallSalesException, ["yes", "no", "unknown"])) {
    return invalidDiagnosis("販売届出の政令指定少量例外を確認できないため判定できません。");
  }

  if (answers.smallSalesException === "unknown") {
    return invalidDiagnosis("販売届出の政令指定少量例外を確認できないため、不要とは判定しません。");
  }

  if (answers.smallSalesException === "yes") {
    return {
      verdict: "none",
      title: "販売事業の届出は不要となる可能性があります",
      summary:
        "施行令第6条に定める高圧ガスを販売し、販売所の貯蔵数量が常時5立方メートル未満である場合は、販売事業の届出が不要となる可能性があります。",
      citations: [baseCitation, { lawId: ORDER, num: "6", label: "高圧ガス保安法施行令 第6条(販売事業の届出を要しない高圧ガス)" }],
      procedures: [],
      note: "施行令第6条の対象ガスかつ常時5立方メートル未満という回答を前提にした判定です。貯蔵・販売方法など他の規定は別途適用されます。",
    };
  }

  if (gasCategoryId === "refrigeration") {
    return {
      verdict: "notification",
      title: "販売事業の届出が必要な可能性があります",
      summary: "事業開始の日の20日前までに、販売所ごとに都道府県知事への届出が必要です(高圧ガス保安法第20条の4)。",
      citations: [
        baseCitation,
        { lawId: ACT, num: "20_5", label: "高圧ガス保安法 第20条の5(周知させる義務等)" },
        { lawId: ACT, num: "20_6", label: "高圧ガス保安法 第20条の6(販売の方法)" },
      ],
      procedures: SALES_PROCEDURES.refrigeration,
      note:
        "冷凍のための製造に係る第一種製造者(高圧ガス保安法第5条第1項第2号)は、自ら製造した高圧ガスを自社事業所内で" +
        "販売する場合であっても、第20条の4第1号の届出免除の対象外です(同号は第5条第1項第1号の第一種製造者に限定)。",
    };
  }

  if (!isChoice(answers.selfSale, ["yes", "no"])) {
    return invalidDiagnosis("第一種製造者による自社製造所内販売か確認できないため判定できません。");
  }

  if (answers.selfSale === "yes") {
    return {
      verdict: "none",
      title: "販売事業の届出は不要となる可能性があります",
      summary:
        "第一種製造者が自ら製造した高圧ガスをその製造事業所内で販売する場合、販売事業の届出は不要です" +
        "(高圧ガス保安法第20条の4第1号)。",
      citations: [baseCitation],
      procedures: [],
      note: "貯蔵・製造など高圧ガス保安法の他の規定が別途適用される場合があります。",
    };
  }

  return {
    verdict: "notification",
    title: "販売事業の届出が必要な可能性があります",
    summary: "事業開始の日の20日前までに、販売所ごとに都道府県知事への届出が必要です(高圧ガス保安法第20条の4)。",
    citations: [
      baseCitation,
      { lawId: ACT, num: "20_5", label: "高圧ガス保安法 第20条の5(周知させる義務等)" },
      { lawId: ACT, num: "20_6", label: "高圧ガス保安法 第20条の6(販売の方法)" },
    ],
    procedures: SALES_PROCEDURES[gasCategoryId],
    note: "販売・貯蔵・製造など高圧ガス保安法の他の規定が別途適用される場合があります。",
  };
}

/* ---------- 貯蔵 ---------- */
//
// 貯蔵所の許可・届出は高圧ガス保安法第16条(第一種貯蔵所・許可)・第17条の2(第二種貯蔵所・届出)に基づく。
// 閾値は施行令第5条の表による: 第一種ガス(不活性ガス等)のみ3000m³、第一種ガス以外(第二種ガス)のみ1000m³、
// 両方混在する場合は一般則第102条と同様の算式(一般則第103条 N=1000+(2/3)×M、M=第一種ガスの貯蔵容積)で
// 許可基準を算出する。第二種貯蔵所(届出)の基準は一律300m³以上(ただし第一種貯蔵所の許可基準に該当する場合を除く)。
// 液化ガスは10kg=容積1m³とみなして算定する(法第16条第3項)。
// 経済産業省令で定める容積(0.15m³)以下の高圧ガスは貯蔵の技術基準(法第15条)自体が適用除外となる。
// 一般則第19条第2項は液化ガスの質量10kgを容積1m³とみなすため、0.15m³相当は1.5kg。液石則第20条も1.5kgを明記する。
// これは貯蔵能力の換算であり、容器の物理的な内容積そのものを意味しない。この差は許可・届出の要否には影響しないため設問では扱わない。
//
// 冷凍則には貯蔵所固有の閾値規定がなく(冷凍則第20条は貯蔵の技術基準を一般則相当の基準に委ねるのみ)、
// 冷凍のための高圧ガスの貯蔵所も一般則の第16条・第17条の2・施行令第5条がそのまま適用されるため、
// 「一般」「冷凍」の両カテゴリーで同一の設問・算式・一般則の手続きを用いる。
// 液化石油ガスは液石則が独自の貯蔵所規定(液石則第19条〜第43条)を持つため、液石則の手続きを用いる。
//
// なお、施行令第5条には「第三種ガス」(一般則第2条第1項第3号の特殊高圧ガス: アルシン・ジシラン・ジボラン・
// セレン化水素・ホスフィン・モノゲルマン・モノシラン)を含む場合の別表(4〜6号、300m³超からの算式)があるが、
// 極めて限定的なガスのため、本ツールでは対象外の注記のみで案内する。
//
// 参照した一次資料:
//  - 高圧ガス保安法 第15条(貯蔵)・第16条(貯蔵所)・第17条の2(第二種貯蔵所)
//  - 高圧ガス保安法施行令 第5条(貯蔵所に係る政令で定めるガスの種類等)
//  - 一般高圧ガス保安規則 第19条(貯蔵の規制を受けない容積)・第20条〜第30条(貯蔵所の許可・届出・変更等)・
//    第43条(廃止届)・第95条(帳簿)・第103条(第一種貯蔵所に係る貯蔵容積の算定方法)
//  - 冷凍保安規則 第20条(貯蔵の方法に係る技術上の基準)
//  - 液化石油ガス保安規則 第19条・第20条・第21条〜第32条・第43条・第93条

const STORAGE_SELF_MANUFACTURE_STEP = {
  id: "selfManufactureStorage",
  prompt: "第一種製造者として、製造許可を受けたところに従い、同じ事業所内で自ら製造した高圧ガスをそのまま貯蔵しますか?",
  type: "choice",
  help:
    "第一種製造者が高圧ガス保安法第5条第1項の許可を受けたところに従って貯蔵する高圧ガスについては、" +
    "貯蔵の技術基準(法第15条)や貯蔵所の許可・届出(法第16条・第17条の2)は適用されません" +
    "(製造許可の技術基準の中に含まれるため)。",
  options: [
    { value: "yes", label: "はい(第一種製造者の製造許可の範囲内で、その事業所内で貯蔵するのみ)" },
    { value: "no", label: "いいえ(他社から仕入れた高圧ガスの貯蔵、製造許可の範囲を超える貯蔵など)" },
  ],
};

const STORAGE_LPGAS_SUPPLY_STEP = {
  id: "lpgasSupply",
  prompt: "液化石油ガス法上の供給設備又は貯蔵施設(液化石油ガス販売事業者としての設備)で貯蔵しますか?",
  type: "choice",
  help:
    "液化石油ガスの保安の確保及び取引の適正化に関する法律(液化石油ガス法)第6条の液化石油ガス販売事業者が、" +
    "同法上の供給設備又は貯蔵施設で貯蔵する液化石油ガスは、高圧ガス保安法第15条・第16条・第17条の2の" +
    "対象外です(液化石油ガス法の管轄)。",
  options: [
    { value: "yes", label: "はい(液化石油ガス法上の供給設備・貯蔵施設での貯蔵)" },
    { value: "no", label: "いいえ(業務用ボンベの保管など、それ以外の貯蔵)" },
  ],
};

const STORAGE_GAS_SCOPE_STEP = {
  id: "storageGasScope",
  prompt: "貯蔵する高圧ガスの種類は?",
  type: "choice",
  options: [
    {
      value: "type1only",
      label: "不活性ガス等(第一種ガス)のみ",
      help: "ヘリウム・ネオン・アルゴン・クリプトン・キセノン・ラドン・窒素・二酸化炭素・難燃性フルオロカーボン・空気",
    },
    {
      value: "otherOnly",
      label: "可燃性ガス・毒性ガスなど(第一種ガス以外)のみ",
      help:
        "上記以外のガス。ただしアルシン・ジシラン・ジボラン・セレン化水素・ホスフィン・モノゲルマン・モノシラン" +
        "(特殊高圧ガス)を貯蔵する場合は、施行令第5条の別表により基準が異なるため、都道府県窓口にご確認ください。",
    },
    {
      value: "mixed",
      label: "第一種ガスと、それ以外のガスの両方を貯蔵する",
      help: "同一の貯蔵所で両方を貯蔵する場合",
    },
  ],
};

const STORAGE_THIRD_GAS_STEP = {
  id: "storageThirdGas",
  prompt: "特殊高圧ガス(施行令第5条の第三種ガス)を含みますか?",
  type: "choice",
  help:
    "アルシン、ジシラン、ジボラン、セレン化水素、ホスフィン、モノゲルマン、モノシランなどの第三種ガスを含む場合、" +
    "第一種ガス・第二種ガスだけの基準とは異なる組合せ区分になります。本ツールでは安全のため自動分類せず、都道府県窓口で確認します。",
  options: [
    { value: "yes", label: "はい(含む)" },
    { value: "no", label: "いいえ(含まない)" },
    { value: "unknown", label: "不明(分類を確認できない)" },
  ],
};

function makeStorageBandStep(permitThreshold, gasLabel) {
  return {
    id: "storageCapacityBand",
    prompt: `${gasLabel}の貯蔵容積は?`,
    type: "choice",
    help:
      "圧縮ガスは温度0℃・圧力0Paの状態に換算した容積、液化ガスは10キログラムを容積1立方メートルとみなして算定します" +
      "(高圧ガス保安法第16条第3項)。",
    options: [
      { value: "over", label: `${permitThreshold} 立方メートル以上` },
      { value: "between", label: `300 立方メートル以上 ${permitThreshold} 立方メートル未満` },
      { value: "under", label: "300 立方メートル未満" },
    ],
  };
}

const STORAGE_M_STEP = {
  id: "storageM",
  prompt: "不活性ガス等(第一種ガス)の貯蔵容積は?",
  type: "number",
  unit: "立方メートル",
  help: "液化ガスの場合は、10キログラムを容積1立方メートルとみなして換算した数値を入力してください。",
  min: 0,
};

const STORAGE_S2_STEP = {
  id: "storageS2",
  prompt: "それ以外(可燃性ガス・毒性ガスなど)の貯蔵容積は?",
  type: "number",
  unit: "立方メートル",
  help: "液化ガスの場合は、10キログラムを容積1立方メートルとみなして換算した数値を入力してください。",
  min: 0,
};

// 一般則第103条による算式。N(許可基準, m3) = 1000 + (2/3)×M (0<=M<=3000の範囲で線形補間)
function calcStorageThreshold(m) {
  const clamped = Math.max(0, Math.min(m, 3000));
  return 1000 + (2 / 3) * clamped;
}

function getStorageSteps(gasCategoryId, answers) {
  const steps = [STORAGE_SELF_MANUFACTURE_STEP];
  if (answers.selfManufactureStorage === "yes") return steps;
  if (answers.selfManufactureStorage !== "no") return steps;

  if (gasCategoryId === "lpgas") {
    steps.push(STORAGE_LPGAS_SUPPLY_STEP);
    if (answers.lpgasSupply === "yes") return steps;
    if (answers.lpgasSupply !== "no") return steps;
    steps.push(makeStorageBandStep(1000, "液化石油ガス"));
    return steps;
  }

  steps.push(STORAGE_GAS_SCOPE_STEP);
  if (["otherOnly", "mixed"].includes(answers.storageGasScope)) {
    steps.push(STORAGE_THIRD_GAS_STEP);
    if (answers.storageThirdGas !== "no") return steps;
  }
  if (answers.storageGasScope === "type1only") {
    steps.push(makeStorageBandStep(3000, "不活性ガス等(第一種ガス)"));
  } else if (answers.storageGasScope === "otherOnly") {
    steps.push(makeStorageBandStep(1000, "第一種ガス以外のガス"));
  } else if (answers.storageGasScope === "mixed") {
    steps.push(STORAGE_M_STEP, STORAGE_S2_STEP);
  }
  return steps;
}

function evaluateStorage(gasCategoryId, answers) {
  if (!isChoice(gasCategoryId, ["general", "refrigeration", "lpgas"])) {
    return invalidDiagnosis("貯蔵する高圧ガスの区分を確認できないため判定できません。");
  }

  if (!isChoice(answers.selfManufactureStorage, ["yes", "no"])) {
    return invalidDiagnosis("第一種製造者の製造許可範囲内での貯蔵か確認できないため判定できません。");
  }

  if (answers.selfManufactureStorage === "yes") {
    return {
      verdict: "none",
      title: "貯蔵所の許可・届出は不要となる可能性があります",
      summary:
        "第一種製造者が製造許可を受けたところに従って、その事業所内でそのまま貯蔵する場合、" +
        "貯蔵の技術基準・貯蔵所の許可/届出は製造許可の技術基準に含まれます。",
      citations: [
        { lawId: ACT, num: "15", label: "高圧ガス保安法 第15条(貯蔵)" },
        { lawId: ACT, num: "16", label: "高圧ガス保安法 第16条(第一種貯蔵所)" },
      ],
      procedures: [],
      note: "製造・販売など高圧ガス保安法の他の規定が別途適用される場合があります。",
    };
  }

  const storageCitations = [
    { lawId: ACT, num: "15", label: "高圧ガス保安法 第15条(貯蔵)" },
    { lawId: ACT, num: "16", label: "高圧ガス保安法 第16条(貯蔵所)" },
    { lawId: ACT, num: "17_2", label: "高圧ガス保安法 第17条の2(第二種貯蔵所)" },
    { lawId: ORDER, num: "5", label: "高圧ガス保安法施行令 第5条(貯蔵所に係る政令で定めるガスの種類等)" },
  ];
  if (gasCategoryId === "refrigeration") {
    storageCitations.push({ lawId: REITOU, num: "20", label: "冷凍保安規則 第20条(貯蔵の方法に係る技術上の基準)" });
  }
  if (gasCategoryId === "general" || gasCategoryId === "refrigeration") {
    storageCitations.push({ lawId: IPPAN, num: "19", label: "一般高圧ガス保安規則 第19条(貯蔵の規制を受けない容積)" });
  }
  if (gasCategoryId === "lpgas") {
    storageCitations.push({ lawId: EKISEKI, num: "20", label: "液化石油ガス保安規則 第20条(貯蔵の規制を受けない容積)" });
  }

  if (gasCategoryId === "lpgas") {
    if (!isChoice(answers.lpgasSupply, ["yes", "no"])) {
      return invalidDiagnosis("液化石油ガス法上の供給設備・貯蔵施設か確認できないため判定できません。");
    }
    if (answers.lpgasSupply === "yes") {
      return {
        verdict: "other_law",
        title: "液化石油ガス法の対象となる可能性があります",
        summary:
          "液化石油ガス法上の供給設備・貯蔵施設での液化石油ガスの貯蔵は、高圧ガス保安法第15条・第16条・" +
          "第17条の2の対象外です。液化石油ガス法上の規制をご確認ください。",
        citations: storageCitations,
        procedures: [],
        note:
          "液化石油ガスの保安の確保及び取引の適正化に関する法律(液化石油ガス法)上の規制の詳細については、" +
          "本ツールの対象外です。事業所所在地を管轄する都道府県にご確認ください。",
      };
    }
    return evaluateStorageBand(answers, storageCitations, EKISEKI_STORAGE_PROCEDURES, 1000, "液化石油ガス");
  }

  if (!isChoice(answers.storageGasScope, ["type1only", "otherOnly", "mixed"])) {
    return invalidDiagnosis("貯蔵するガスの種類を確認できないため判定できません。");
  }

  if (answers.storageGasScope !== "type1only" && !isChoice(answers.storageThirdGas, ["yes", "no", "unknown"])) {
    return invalidDiagnosis("第三種ガスを含むか確認できないため判定できません。");
  }

  if (answers.storageGasScope !== "type1only" && answers.storageThirdGas !== "no") {
    return invalidDiagnosis(
      "第三種ガスを含む貯蔵は施行令第5条の組合せ区分が異なるため、自動的に不要とは判定しません。都道府県窓口で確認してください。"
    );
  }

  if (answers.storageGasScope === "type1only") {
    return evaluateStorageBand(answers, storageCitations, IPPAN_STORAGE_PROCEDURES, 3000, "不活性ガス等(第一種ガス)");
  }

  if (answers.storageGasScope === "otherOnly") {
    return evaluateStorageBand(answers, storageCitations, IPPAN_STORAGE_PROCEDURES, 1000, "第一種ガス以外のガス");
  }

  if (answers.storageGasScope === "mixed") {
    const m = readNonNegativeNumber(answers.storageM);
    const s2 = readNonNegativeNumber(answers.storageS2);
    if (m === null || s2 === null) {
      return invalidDiagnosis("混合ガスの貯蔵容積を確認できないため判定できません。");
    }
    const total = m + s2;
    const threshold = calcStorageThreshold(m);
    const citations = [
      ...storageCitations,
      { lawId: IPPAN, num: "103", label: "一般高圧ガス保安規則 第103条(第一種貯蔵所に係る貯蔵容積の算定方法)" },
    ];
    const note =
      m > 0 && s2 > 0
        ? "不活性ガス(第一種ガス)と可燃性ガス・毒性ガスなどを併せて貯蔵するため、施行令第5条・一般則第103条の算式" +
          "(N=1000+(2/3)×第一種ガスの貯蔵容積)により許可基準を計算しています。"
        : null;

    if (total >= threshold) {
      return {
        verdict: "permit",
        title: "第一種貯蔵所の設置許可が必要な可能性があります",
        summary: `貯蔵容積の合計が許可基準(約${threshold.toFixed(1)}立方メートル)以上です。都道府県知事の許可が必要です。`,
        citations,
        procedures: IPPAN_STORAGE_PROCEDURES.permit,
        note,
      };
    }
    if (total >= 300) {
      return {
        verdict: "notification",
        title: "第二種貯蔵所の設置届出が必要な可能性があります",
        summary: `貯蔵容積の合計が300立方メートル以上、許可基準(約${threshold.toFixed(1)}立方メートル)未満です。都道府県知事への届出が必要です。`,
        citations,
        procedures: IPPAN_STORAGE_PROCEDURES.notification,
        note,
      };
    }
    return {
      verdict: "none",
      title: "貯蔵所の許可・届出の対象とならない可能性があります",
      summary: "貯蔵容積の合計が300立方メートル未満です。",
      citations,
      procedures: [],
      note: "貯蔵容積が0.15立方メートル(液化ガスは1.5キログラム相当)を超える場合、貯蔵所の許可・届出は不要でも、" +
        "貯蔵の技術基準(法第15条)には従う必要があります。",
    };
  }

  return { verdict: "invalid", message: "貯蔵するガスの種類を選択してください。" };
}

function evaluateStorageBand(answers, baseCitations, procedures, permitThreshold, gasLabel) {
  if (!isChoice(answers.storageCapacityBand, ["over", "between", "under"])) {
    return invalidDiagnosis("貯蔵容積の区分を確認できないため判定できません。");
  }

  if (answers.storageCapacityBand === "over") {
    return {
      verdict: "permit",
      title: "第一種貯蔵所の設置許可が必要な可能性があります",
      summary: `${gasLabel}の許可基準(${permitThreshold}立方メートル)以上に該当します。都道府県知事の許可が必要です。`,
      citations: baseCitations,
      procedures: procedures.permit,
      note: null,
    };
  }

  if (answers.storageCapacityBand === "between") {
    return {
      verdict: "notification",
      title: "第二種貯蔵所の設置届出が必要な可能性があります",
      summary:
        `${gasLabel}の届出基準(300立方メートル)以上、許可基準(${permitThreshold}立方メートル)未満に該当します。` +
        "都道府県知事への届出が必要です。",
      citations: baseCitations,
      procedures: procedures.notification,
      note: null,
    };
  }

  return {
    verdict: "none",
    title: "貯蔵所の許可・届出の対象とならない可能性があります",
    summary: `${gasLabel}の届出基準(300立方メートル)未満です。`,
    citations: baseCitations,
    procedures: [],
    note:
      "貯蔵容積が0.15立方メートル(液化ガスは1.5キログラム相当)を超える場合、" +
      "貯蔵所の許可・届出は不要でも、貯蔵の技術基準(法第15条)には従う必要があります。",
  };
}

/* ---------- 消費 ---------- */
//
// 特定高圧ガス消費者の届出(高圧ガス保安法第24条の2)は、施行令第7条で定める2グループのガスが対象。
// グループ1(施行令7条1項、圧縮又は液化した状態のもの): モノシラン・ホスフィン・アルシン・ジボラン・
//   セレン化水素・モノゲルマン・ジシラン。経済産業省の逐条解説は、貯蔵量・濃度にかかわらず、
//   漏えい検知警報設備の校正試験だけの場合を除き届出対象と説明している。
// グループ2(施行令7条2項、貯蔵能力の閾値あり): 圧縮水素・圧縮天然ガス(各300m³)、液化酸素・液化アンモニア
//   (各3000kg)、液化塩素(1000kg)、液化石油ガス(一般消費者向けを除き3000kg、液化石油ガス法施行令第2条各号に
//   掲げる者は10000kg)。
// グループ2は、法24条の2かっこ書きにより「貯蔵設備の貯蔵能力が政令で定める数量以上である者」または
// 「消費事業所以外の事業所から導管により供給を受ける者」に該当する場合に特定高圧ガス消費者となる(許可制度は
// なく、届出のみ)。液化石油ガスの一般消費者等の消費は液化石油ガス法の管轄(施行令7条2項の表かっこ書き)。
// 液化石油ガスのみ液石則が独自の手続き条文(51条以下)を持ち、それ以外は一般則(53条以下)が適用される。
// 冷凍則には消費者固有の規定がなく、冷凍のための消費(大量アンモニア冷媒等)も一般則の規定に従う。

function getConsumptionThresholdInfo(gasType, lpgasLargeConsumer = false) {
  const map = {
    hydrogen: { quantity: 300, unit: "立方メートル", gasLabel: "圧縮水素" },
    natgas: { quantity: 300, unit: "立方メートル", gasLabel: "圧縮天然ガス" },
    oxygen: { quantity: 3000, unit: "キログラム", gasLabel: "液化酸素" },
    ammonia: { quantity: 3000, unit: "キログラム", gasLabel: "液化アンモニア" },
    chlorine: { quantity: 1000, unit: "キログラム", gasLabel: "液化塩素" },
    lpgas: { quantity: lpgasLargeConsumer ? 10000 : 3000, unit: "キログラム", gasLabel: "液化石油ガス" },
  };
  return map[gasType] || null;
}

  prompt: "消費する事業所以外の事業所から、導管によりこのガスの供給を受けていますか?",
  type: "choice",

function makeConsumptionBandStep(gasType, lpgasLargeConsumer = false) {
  const info = getConsumptionThresholdInfo(gasType, lpgasLargeConsumer);
  const extraHelp =
    gasType === "lpgas"
      ? "液化石油ガスの保安の確保及び取引の適正化に関する法律施行令第2条各号に掲げる者(大口需要家など)が消費する場合は、基準が1万キログラムになります。"
      : null;
  return {
    id: "consumptionStorageBand",
    prompt: `${info.gasLabel}の貯蔵設備の貯蔵能力は?`,
    type: "choice",
    help: "施行令第7条第2項に定める数量です。" + (extraHelp ? " " + extraHelp : ""),
    options: [
      { value: "over", label: `${info.quantity} ${info.unit} 以上` },
      { value: "under", label: `${info.quantity} ${info.unit} 未満(貯蔵設備がない場合を含む)` },
    ],
  };
}

const CONSUMPTION_LPGAS_CONSUMER_STEP = {
  id: "lpgasConsumer",
  prompt: "液化石油ガス法上の一般消費者等として消費しますか?",
  type: "choice",
  help:
    "液化石油ガス法上の一般消費者等(同法第2条第2項)が消費する液化石油ガスは、施行令第7条第2項のかっこ書きにより" +
    "高圧ガス保安法の特定高圧ガス消費者規定の対象外です(液化石油ガス法の管轄)。",
  options: [
    { value: "yes", label: "はい(家庭用その他、液石法上の一般消費者等)" },
    { value: "no", label: "いいえ(業務用・産業用など)" },
    { value: "unknown", label: "不明(該当性を確認できない)" },
  ],
};

function getConsumptionSteps(gasCategoryId, answers) {
  if (gasCategoryId === "lpgas") {
    const steps = [CONSUMPTION_LPGAS_CONSUMER_STEP];
    if (answers.lpgasConsumer === "yes") return steps;
    if (answers.lpgasConsumer !== "no") return steps;
    steps.push(CONSUMPTION_PIPELINE_STEP);
    if (answers.consumptionPipeline === "yes") return steps;
    if (answers.consumptionPipeline !== "no") return steps;
    steps.push(CONSUMPTION_LPGAS_LARGE_CONSUMER_STEP);
    if (!isChoice(answers.lpgasLargeConsumer, ["yes", "no"])) return steps;
    steps.push(makeConsumptionBandStep("lpgas", answers.lpgasLargeConsumer === "yes"));
    return steps;
  }

  const steps = [CONSUMPTION_GAS_TYPE_STEP];
  const gasType = answers.consumptionGasType;
  if (!isChoice(gasType, ["special7", "hydrogen", "natgas", "oxygen", "ammonia", "chlorine", "other"]) || gasType === "other") return steps;

  if (gasType === "special7") {
    steps.push(CONSUMPTION_SPECIAL7_PURPOSE_STEP);
    return steps;
  }

  steps.push(CONSUMPTION_PIPELINE_STEP);
  if (answers.consumptionPipeline === "yes") return steps;
  if (answers.consumptionPipeline !== "no") return steps;
  steps.push(makeConsumptionBandStep(gasType));
  return steps;
}

function buildConsumptionResult(gasLabel, procedures, citations, note) {
  return {
    verdict: "notification",
    title: "特定高圧ガス消費者に該当する可能性があります",
    summary: `${gasLabel}の消費者として、事業所ごとに消費開始の日の20日前までに都道府県知事への届出が必要です(高圧ガス保安法第24条の2)。`,
    citations,
    procedures: procedures.notification,
    note,
  };
}

function buildConsumptionNoneResult(gasLabel, citations, extraNote) {
  return {
    verdict: "none",
    title: "特定高圧ガス消費者の届出は不要となる可能性があります",
    summary: `${gasLabel}の貯蔵設備の貯蔵能力が基準未満で、他事業所からの導管供給も受けない場合、特定高圧ガス消費者の届出は不要です。`,
    citations,
    procedures: [],
    note:
      (extraNote ? extraNote + " " : "") +
      "届出が不要な場合でも、可燃性ガス・毒性ガス・酸素・空気を消費する場合は消費の技術基準(法第24条の5)には従う必要があります。",
  };
}

function evaluateConsumption(gasCategoryId, answers) {
  const citations = [
    { lawId: ACT, num: "24_2", label: "高圧ガス保安法 第24条の2(消費)" },
    { lawId: ORDER, num: "7", label: "高圧ガス保安法施行令 第7条(政令で定める種類の高圧ガス)" },
  ];

  if (!isChoice(gasCategoryId, ["general", "lpgas"])) {
    return invalidDiagnosis("消費する高圧ガスの区分を確認できないため判定できません。");
  }

  if (gasCategoryId === "lpgas") {
    if (!isChoice(answers.lpgasConsumer, ["yes", "no", "unknown"])) {
      return invalidDiagnosis("液化石油ガス法上の消費区分を確認できないため判定できません。");
    }
    if (answers.lpgasConsumer === "unknown") {
      return invalidDiagnosis("液化石油ガス法上の消費区分が不明なため、不要とは判定しません。");
    }
    if (answers.lpgasConsumer === "yes") {
      return {
        verdict: "other_law",
        title: "液化石油ガス法の対象となる可能性があります",
        summary:
          "液化石油ガス法上の一般消費者等による液化石油ガスの消費は、高圧ガス保安法施行令第7条第2項のかっこ書きにより特定高圧ガス" +
          "消費者の対象外です。液化石油ガス法上の規制をご確認ください。",
        citations: [
          ...citations,
          { lawId: LPG_ACT, num: "2", label: "液化石油ガス法 第2条第2項(一般消費者等)" },
        ],
        procedures: [],
        note:
          "液化石油ガスの保安の確保及び取引の適正化に関する法律(液化石油ガス法)上の規制の詳細については、" +
          "本ツールの対象外です。事業所所在地を管轄する都道府県にご確認ください。",
      };
    }
    if (!isChoice(answers.consumptionPipeline, ["yes", "no"])) {
      return invalidDiagnosis("導管供給の有無を確認できないため判定できません。");
    }
    if (answers.consumptionPipeline === "yes") {
      return buildConsumptionResult("液化石油ガス", EKISEKI_CONSUMPTION_PROCEDURES, citations, null);
    }
    if (!isChoice(answers.lpgasLargeConsumer, ["yes", "no", "unknown"])) {
      return invalidDiagnosis("液化石油ガスの1万キログラム特例の該当性を確認できないため判定できません。");
    }
    if (answers.lpgasLargeConsumer === "unknown") {
      return invalidDiagnosis("液化石油ガスの1万キログラム特例が不明なため、届出不要とは判定しません。");
    }
    if (!isChoice(answers.consumptionStorageBand, ["over", "under"])) {
      return invalidDiagnosis("液化石油ガスの貯蔵能力区分を確認できないため判定できません。");
    }
    const lpgasInfo = getConsumptionThresholdInfo("lpgas", answers.lpgasLargeConsumer === "yes");
    if (answers.consumptionStorageBand === "over") {
      return buildConsumptionResult(
        lpgasInfo.gasLabel,
        EKISEKI_CONSUMPTION_PROCEDURES,
        citations,
        answers.lpgasLargeConsumer === "yes" ? "液化石油ガス法施行令第2条各号に掲げる者のため、基準は1万キログラムです。" : null
      );
    }
    return buildConsumptionNoneResult(
      lpgasInfo.gasLabel,
      citations,
      answers.lpgasLargeConsumer === "yes" ? "1万キログラム未満のため、届出不要となる可能性があります。" : null
    );
  }

  const gasType = answers.consumptionGasType;
  if (!isChoice(gasType, ["special7", "hydrogen", "natgas", "oxygen", "ammonia", "chlorine", "other"])) {
    return invalidDiagnosis("消費するガスの種類を確認できないため判定できません。");
  }

  if (gasType === "other") {
    return {
      verdict: "none",
      title: "特定高圧ガス消費者の届出は不要となる可能性があります",
      summary: "施行令第7条に定めるガスの種類に該当しないため、特定高圧ガス消費者の届出(法第24条の2)は不要です。",
      citations,
      procedures: [],
      note:
        "可燃性ガス・毒性ガス・酸素・空気を消費する場合は、届出は不要でも消費の技術基準" +
        "(法第24条の5、一般則第59条・第60条)には従う必要があります。",
    };
  }

  if (gasType === "special7") {
    const gasLabel = "モノシラン・ホスフィン・アルシン・ジボラン・セレン化水素・モノゲルマン・ジシラン";
    if (!isChoice(answers.special7CalibrationOnly, ["yes", "no", "unknown"])) {
      return invalidDiagnosis("特殊高圧ガスの用途を確認できないため判定できません。");
    }
    if (answers.special7CalibrationOnly === "unknown") {
      return invalidDiagnosis("特殊高圧ガスの用途が不明なため、届出不要とは判定しません。");
    }
    if (answers.special7CalibrationOnly === "yes") {
      return {
        verdict: "none",
        title: "特定高圧ガス消費届出は不要となる可能性があります",
        summary: "特殊高圧ガスを漏えい検知警報設備の校正試験だけに使用する場合、特定高圧ガスの消費とはみなされず、届出不要となる可能性があります。",
        citations: [...citations, { lawId: IPPAN, num: "53", label: "一般高圧ガス保安規則 第53条(特定高圧ガス消費者に係る消費の届出)" }],
        procedures: [],
        note: "これは経済産業省の一般則逐条解説に基づく限定的な扱いです。消費・貯蔵・移動の技術基準は別途確認してください。",
      };
    }
    return buildConsumptionResult(
      gasLabel,
      IPPAN_CONSUMPTION_PROCEDURES,
      citations,
      "特殊高圧ガスは、容器からの消費を含め、貯蔵量・濃度にかかわらず特定高圧ガス消費の届出対象となり得ます。"
    );
  }

  const info = getConsumptionThresholdInfo(gasType);
  if (!info) {
    return invalidDiagnosis("消費するガスの基準を確認できないため判定できません。");
  }
  if (!isChoice(answers.consumptionPipeline, ["yes", "no"])) {
    return invalidDiagnosis("導管供給の有無を確認できないため判定できません。");
  }
  if (answers.consumptionPipeline === "yes") {
    return buildConsumptionResult(info.gasLabel, IPPAN_CONSUMPTION_PROCEDURES, citations, null);
  }
  if (!isChoice(answers.consumptionStorageBand, ["over", "under"])) {
    return invalidDiagnosis("貯蔵能力区分を確認できないため判定できません。");
  }
  if (answers.consumptionStorageBand === "over") {
    return buildConsumptionResult(info.gasLabel, IPPAN_CONSUMPTION_PROCEDURES, citations, null);
  }
  return buildConsumptionNoneResult(info.gasLabel, citations, null);
}

function getStepsForGasCategory(actionType, gasCategoryId, answers = {}) {
  const safeAnswers = answers && typeof answers === "object" ? answers : {};
  if (actionType === "sales") return getSalesSteps(gasCategoryId, safeAnswers);
  if (actionType === "storage") return getStorageSteps(gasCategoryId, safeAnswers);
  if (actionType === "consumption") return getConsumptionSteps(gasCategoryId, safeAnswers);
  if (gasCategoryId === "general") return getGeneralSteps(safeAnswers);
  if (gasCategoryId === "refrigeration") return getRefrigerationSteps(safeAnswers);
  if (gasCategoryId === "lpgas") return getLpgasSteps(safeAnswers);
  return [];
}

function evaluateDiagnosis(actionType, gasCategoryId, answers = {}) {
  const safeAnswers = answers && typeof answers === "object" ? answers : {};
  try {
    let result;
    if (actionType === "sales") result = evaluateSales(gasCategoryId, safeAnswers);
    else if (actionType === "storage") result = evaluateStorage(gasCategoryId, safeAnswers);
    else if (actionType === "consumption") result = evaluateConsumption(gasCategoryId, safeAnswers);
    else if (gasCategoryId === "general") result = evaluateGeneral(safeAnswers);
    else if (gasCategoryId === "refrigeration") result = evaluateRefrigeration(safeAnswers);
    else if (gasCategoryId === "lpgas") result = evaluateLpgas(safeAnswers);
    else result = invalidDiagnosis("行為とガスの種類を確認できないため判定できません。");
    return normalizeDiagnosisResult(result);
  } catch (_error) {
    return normalizeDiagnosisResult(invalidDiagnosis("入力条件を安全に確認できないため判定できません。"));
  }
}

const REVISION_CACHE_MS = 24 * 60 * 60 * 1000;

function compareLawRevisions(lawId, data) {
  if (!Object.hasOwn(REVISION_BASELINES, lawId) || !Array.isArray(data?.revisions) || !data.revisions.length) throw new Error("改正応答の形式不一致");
  let currentCount = 0;
  const changes = [];
  for (const row of data.revisions) {
    if (!row || typeof row.current_revision_status !== "string" || typeof row.law_revision_id !== "string" || !row.law_revision_id.startsWith(lawId + "_")) throw new Error("改正応答の形式不一致");
    const status = row.current_revision_status;
    if (!["CurrentEnforced", "UnEnforced"].includes(status)) continue;
    if (typeof row.amendment_enforcement_date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(row.amendment_enforcement_date) || typeof row.amendment_law_title !== "string") throw new Error("改正応答の形式不一致");

    if (changed) changes.push({ lawId, lawTitle: ALL_LAWS.find(l => l.lawId === lawId).title, revisionId: row.law_revision_id, status,
      enforcementDate: row.amendment_enforcement_date, amendmentTitle: row.amendment_law_title });
  }
  if (currentCount !== 1) throw new Error("施行中の改正を特定できません");
  return changes;
}

async function fetchLawRevisions(lawId, { fetcher = globalThis.fetch, timeoutMs = 10000 } = {}) {
  const controller = new AbortController();
  let timer;
  try {
    return await Promise.race([
      (async () => {
        const response = await fetcher(API_BASE + "/law_revisions/" + encodeURIComponent(lawId), { signal: controller.signal });
        if (!response.ok) throw new Error("改正情報を取得できません");
        return compareLawRevisions(lawId, await response.json());
      })(),
      new Promise((_, reject) => { timer = setTimeout(() => { controller.abort(); reject(new Error("改正確認のタイムアウト")); }, timeoutMs); }),
    ]);
  } finally { clearTimeout(timer); }
}

async function checkLawRevisions({ now = Date.now(), online = globalThis.navigator?.onLine !== false,
  readCache = () => getCachedLaw(REVISION_CACHE_KEY), writeCache = value => putCachedLaw(REVISION_CACHE_KEY, value),
  fetcher = globalThis.fetch, timeoutMs = 10000 } = {}) {
  try {
    const cached = (await readCache())?.data;
    if (cached?.tag === revisionCacheTag && Number.isFinite(cached.checkedAt) && now >= cached.checkedAt && now - cached.checkedAt < REVISION_CACHE_MS &&
      ["ready", "failed"].includes(cached.status) && Array.isArray(cached.changes)) return cached;
  } catch { /* 保存禁止でも、照合と案内は使える。 */ }
  let result;
  try {
    if (!online) throw new Error("オフライン");
    const changes = (await Promise.all(Object.keys(REVISION_BASELINES).map(id => fetchLawRevisions(id, { fetcher, timeoutMs })))).flat();
    result = { tag: revisionCacheTag, checkedAt: now, status: "ready", changes };
  } catch { result = { tag: revisionCacheTag, checkedAt: now, status: "failed", changes: [] }; }
  try { await writeCache(result); } catch { /* 取得成功は保存の可否と分ける。 */ }
  return result;
}
