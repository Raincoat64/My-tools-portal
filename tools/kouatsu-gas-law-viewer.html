// 一般則: 施行令第3条・一般則第102条による算式。
// T(許可基準, m3/日) = 100 + (2/3)×S1 (0<=S1<=300の範囲で線形補間)
// S1=0(第一種ガスなし)のとき T=100、S1>=300(第一種ガスのみで既に300以上)のとき T=300 に自然に収束する。
function calcGeneralThreshold(s1) {
  const clamped = Math.max(0, Math.min(s1, 300));
  return 100 + (2 / 3) * clamped;
}

function evaluateGeneral(answers) {
  const { gasScope, isBusiness } = answers;
  if (!gasScope || !isBusiness) {
    return { verdict: "invalid", message: "すべての設問に回答してください。" };
  }

  const citations = [
    { lawId: ACT, num: "5", label: "高圧ガス保安法 第5条(製造の許可等)" },
    { lawId: ORDER, num: "3", label: "高圧ガス保安法施行令 第3条(政令で定めるガスの種類等)" },
  ];

  let overThreshold;
  let thresholdLabel;
  let note = null;

  if (gasScope === "type1only") {
    if (!answers.capacityBand) return { verdict: "invalid", message: "すべての設問に回答してください。" };
    overThreshold = answers.capacityBand === "over";
    thresholdLabel = "300立方メートル/日";
  } else if (gasScope === "otherOnly") {
    if (!answers.capacityBand) return { verdict: "invalid", message: "すべての設問に回答してください。" };
    overThreshold = answers.capacityBand === "over";
    thresholdLabel = "100立方メートル/日";
  } else if (gasScope === "mixed") {
    const s1 = Number(answers.s1);
    const s2 = Number(answers.s2);
    if (!Number.isFinite(s1) || !Number.isFinite(s2) || s1 < 0 || s2 < 0) {
      return { verdict: "invalid", message: "すべての設問に回答してください。" };
    }
    const total = s1 + s2;
    const threshold = calcGeneralThreshold(s1);
    overThreshold = total >= threshold;
    thresholdLabel = `約${threshold.toFixed(1)}立方メートル/日(第一種ガス処理能力${s1}m³/日から算式で算出)`;
    citations.push({ lawId: IPPAN, num: "102", label: "一般高圧ガス保安規則 第102条(第一種製造者に係るガス処理容積の算定方法)" });
    if (s1 > 0 && s2 > 0) {
      note =
        "不活性ガス(第一種ガス)と可燃性ガス・毒性ガスなどを併せて扱うため、施行令第3条・一般則第102条の算式" +
        "(T=100+(2/3)×第一種ガスの処理能力)により許可基準を計算しています。";
    }
  } else {
    return { verdict: "invalid", message: "ガスの種類を選択してください。" };
  }

  if (overThreshold) {
    return {
      verdict: "permit",
      title: "第一種製造者に該当する可能性があります",
      summary: `処理能力が許可基準(${thresholdLabel})以上です。都道府県知事の許可が必要です。`,
      citations,
      procedures: IPPAN_PROCEDURES.permit,
      note,
    };
  }

  if (answers.isBusiness === "yes") {
    return {
      verdict: "notification",
      title: "第二種製造者に該当する可能性があります",
      summary: `処理能力は許可基準(${thresholdLabel})未満ですが、事業として行うため届出が必要です。`,
      citations,
      procedures: IPPAN_PROCEDURES.notification,
      note,
    };
  }

  return {
    verdict: "none",
    title: "許可・届出の対象とならない可能性があります",
    summary: "事業として行わない場合、高圧ガス保安法第5条に基づく許可・届出は不要となる可能性があります。",
    citations,
    procedures: [],
    note: "貯蔵・消費など高圧ガス保安法の他の規定が別途適用される場合があります。",
  };
}

/* ---------- 冷凍則: 製造 ---------- */

// 法第5条第1項第2号・第2項第2号は、冷凍のための製造すべてに適用される基準値そのもの(許可20トン/届出3トン)を
// 条文本体に定めており、施行令第4条はこの値を特定のガス種(第一種ガス、フルオロカーボン+アンモニア)についてのみ
// 「20トン(届出は3トン)を超える政令で定める値」(=50トン/20トン、50トン/5トン)に引き上げる規定に過ぎない。
// したがって施行令第4条の表(2行)に該当しない冷媒ガス(プロパン等)は、一般則にまわるのではなく、法本体の
// デフォルト値(許可20トン/届出3トン)がそのまま適用される。
// フルオロカーボンが「第一種ガス」側(50t/20t)に含まれるのは、施行令第2条第5項第4号の難燃性基準に適合する
// ものに限られ、その基準に適合しないもの(=可燃性・微燃性のフルオロカーボン)はフルオロカーボン+アンモニア側
// (50t/5t)に該当する。
// 出典: 高圧ガス保安法令解説(セーフティー・マネジメント・サービス株式会社)掲載の区分図により、上記3区分・
// 閾値(20/3, 50/20, 50/5トン)を2026-07-17に再確認した。
const REFRIGERATION_GAS_TYPE_STEP = {
  id: "gasType",
  prompt: "使用する冷媒ガスの種類は?",
  type: "choice",
  options: [
    {
      value: "type1",
      label: "不活性ガス等(第一種ガス): 二酸化炭素・不活性のフルオロカーボンなど",
      help:
        "ヘリウム・ネオン・アルゴン・クリプトン・キセノン・ラドン・窒素・二酸化炭素・空気、及び難燃性の基準" +
        "(経済産業省令で定める燃焼性の基準)に適合するフルオロカーボン",
    },
    {
      value: "fluorocarbon_ammonia",
      label: "フルオロカーボン(不活性でないもの)またはアンモニア",
      help:
        "難燃性の基準(経済産業省令で定める燃焼性の基準)に適合しない、可燃性・微燃性のフルオロカーボン、及び" +
        "アンモニアが該当します。",
    },
    {
      value: "other",
      label: "フルオロカーボン又はアンモニア以外の冷媒ガス(プロパンなど)",
      help: "上記いずれにも該当しない冷媒ガスには、法第5条本体に定める基準値がそのまま適用されます。",
    },
  ],
};

function getRefrigerationThresholds(gasType) {
  if (gasType === "type1") {
    return { permitThreshold: 50, notifyThreshold: 20, gasLabel: "第一種ガス" };
  }
  if (gasType === "fluorocarbon_ammonia") {
    return { permitThreshold: 50, notifyThreshold: 5, gasLabel: "フルオロカーボン(不活性でないもの)又はアンモニア" };
  }
  return { permitThreshold: 20, notifyThreshold: 3, gasLabel: "フルオロカーボン又はアンモニア以外の冷媒ガス" };
}

function makeRefrigerationBandStep(gasType) {
  const { permitThreshold, notifyThreshold } = getRefrigerationThresholds(gasType);
  return {
    id: "capacityBand",
    prompt: "1日の冷凍能力の区分は?",
    type: "choice",
    help: "冷凍則第5条で定める算定基準による換算値です。設備の仕様書・メーカー資料でご確認ください。",
    options: [
      { value: "over", label: `${permitThreshold} トン/日 以上` },
      { value: "between", label: `${notifyThreshold} トン/日 以上 ${permitThreshold} トン/日 未満` },
      { value: "under", label: `${notifyThreshold} トン/日 未満` },
    ],
  };
}

function getRefrigerationSteps(answers) {
  const steps = [REFRIGERATION_GAS_TYPE_STEP];
  if (answers.gasType) {
    steps.push(makeRefrigerationBandStep(answers.gasType));
  }
  return steps;
}

function evaluateRefrigeration(answers) {
  if (!answers.gasType || !answers.capacityBand) {
    return { verdict: "invalid", message: "すべての設問に回答してください。" };
  }

  const citations = [
    { lawId: ACT, num: "5", label: "高圧ガス保安法 第5条(製造の許可等)" },
    { lawId: ORDER, num: "4", label: "高圧ガス保安法施行令 第4条(政令で定めるガスの種類等)" },
  ];

  const { permitThreshold, notifyThreshold, gasLabel } = getRefrigerationThresholds(answers.gasType);

  if (answers.capacityBand === "over") {
    return {
      verdict: "permit",
      title: "第一種製造者に該当する可能性があります",
      summary: `${gasLabel}の許可基準 ${permitThreshold} トン/日 以上に該当します。都道府県知事の許可が必要です。`,
      citations,
      procedures: REITOU_PROCEDURES.permit,
      note: null,
    };
  }

  if (answers.capacityBand === "between") {
    return {
      verdict: "notification",
      title: "第二種製造者に該当する可能性があります",
      summary: `${gasLabel}の届出基準 ${notifyThreshold} トン/日 以上、許可基準 ${permitThreshold} トン/日 未満に該当します。都道府県知事への届出が必要です。`,
      citations,
      procedures: REITOU_PROCEDURES.notification,
      note: "高圧ガス保安法第5条第2項第2号の冷凍能力による届出基準には、一般則のような事業性(事業として行うか)の要件は明記されていません。",
    };
  }

  return {
    verdict: "none",
    title: "許可・届出の対象とならない可能性があります",
    summary: `${gasLabel}の届出基準 ${notifyThreshold} トン/日 未満です。`,
    citations,
    procedures: [],
    note: "貯蔵・消費など高圧ガス保安法の他の規定が別途適用される場合があります。",
  };
}

        "販売する場合であっても、第20条の4第1号の届出免除の対象外です(同号は第5条第1項第1号の第一種製造者に限定)。",

      baseCitation,
      { lawId: ACT, num: "20_5", label: "高圧ガス保安法 第20条の5(周知させる義務等)" },

      "(高圧ガス保安法第20条の4第2号、施行令第6条)。該当する可能性がある場合は都道府県窓口にご確認ください。",
  };
}

/* ---------- 貯蔵 ---------- */
//
// 貯蔵所の許可・届出は高圧ガス保安法第16条(第一種貯蔵所・許可)・第17条の2(第二種貯蔵所・届出)に基づく。
// 閾値は施行令第5条の表による: 第一種ガス(不活性ガス等)のみ3000m³、第一種ガス以外(第二種ガス)のみ1000m³、
// 両方混在する場合は一般則第102条と同様の算式(一般則第103条 N=1000+(2/3)×M、M=第一種ガスの貯蔵容積)で
// 許可基準を算出する。第二種貯蔵所(届出)の基準は一律300m³以上(ただし第一種貯蔵所の許可基準に該当する場合を除く)。
// 液化ガスは10kg=容積1m³とみなして算定する(法第16条第3項)。
// 経済産業省令で定める容積(0.15m³、液化ガスは10kg)以下の高圧ガスは貯蔵の技術基準(法第15条)自体が適用除外となる
// (一般則第19条・液石則第20条)が、この差は許可・届出の要否には影響しないため設問では扱わない。
//
// 冷凍則には貯蔵所固有の閾値規定がなく(冷凍則第20条は貯蔵の技術基準を一般則相当の基準に委ねるのみ)、
// 冷凍のための高圧ガスの貯蔵所も一般則の第16条・第17条の2・施行令第5条がそのまま適用されるため、
// 「一般」「冷凍」の両カテゴリーで同一の設問・算式・一般則の手続きを用いる。
// 液化石油ガスは液石則が独自の貯蔵所規定(液石則第19条〜第43条)を持つため、液石則の手続きを用いる。
//
// なお、施行令第5条には「第三種ガス」(一般則第2条第1項第3号の特殊高圧ガス: アルシン・ジシラン・ジボラン・
// セレン化水素・ホスフィン・モノゲルマン・モノシラン)を含む場合の別表(4〜6号、300m³超からの算式)があるが、
// 極めて限定的なガスのため、本ツールでは対象外の注記のみで案内する。
//
// 参照した一次資料:
//  - 高圧ガス保安法 第15条(貯蔵)・第16条(貯蔵所)・第17条の2(第二種貯蔵所)
//  - 高圧ガス保安法施行令 第5条(貯蔵所に係る政令で定めるガスの種類等)
//  - 一般高圧ガス保安規則 第19条(貯蔵の規制を受けない容積)・第20条〜第30条(貯蔵所の許可・届出・変更等)・
//    第43条(廃止届)・第95条(帳簿)・第103条(第一種貯蔵所に係る貯蔵容積の算定方法)
//  - 冷凍保安規則 第20条(貯蔵の方法に係る技術上の基準)
//  - 液化石油ガス保安規則 第19条・第20条・第21条〜第32条・第43条・第93条

const STORAGE_SELF_MANUFACTURE_STEP = {
  id: "selfManufactureStorage",
  prompt: "自ら製造した高圧ガスを、その製造許可を受けたところに従って、同じ事業所内でそのまま貯蔵しますか?",
  type: "choice",
  help:
    "第一種製造者が高圧ガス保安法第5条第1項の許可を受けたところに従って貯蔵する高圧ガスについては、" +
    "貯蔵の技術基準(法第15条)や貯蔵所の許可・届出(法第16条・第17条の2)は適用されません" +
    "(製造許可の技術基準の中に含まれるため)。",
  options: [
    { value: "yes", label: "はい(自社の製造許可の範囲内で、その事業所内で貯蔵するのみ)" },
    { value: "no", label: "いいえ(他社から仕入れた高圧ガスの貯蔵、製造許可の範囲を超える貯蔵など)" },
  ],
};

const STORAGE_LPGAS_SUPPLY_STEP = {
  id: "lpgasSupply",
  prompt: "液化石油ガス法上の供給設備又は貯蔵施設(液化石油ガス販売事業者としての設備)で貯蔵しますか?",
  type: "choice",
  help:
    "液化石油ガスの保安の確保及び取引の適正化に関する法律(液化石油ガス法)第6条の液化石油ガス販売事業者が、" +
    "同法上の供給設備又は貯蔵施設で貯蔵する液化石油ガスは、高圧ガス保安法第15条・第16条・第17条の2の" +
    "対象外です(液化石油ガス法の管轄)。",
  options: [
    { value: "yes", label: "はい(液化石油ガス法上の供給設備・貯蔵施設での貯蔵)" },
    { value: "no", label: "いいえ(業務用ボンベの保管など、それ以外の貯蔵)" },
  ],
};

const STORAGE_GAS_SCOPE_STEP = {
  id: "storageGasScope",
  prompt: "貯蔵する高圧ガスの種類は?",
  type: "choice",
  options: [
    {
      value: "type1only",
      label: "不活性ガス等(第一種ガス)のみ",
      help: "ヘリウム・ネオン・アルゴン・クリプトン・キセノン・ラドン・窒素・二酸化炭素・難燃性フルオロカーボン・空気",
    },
    {
      value: "otherOnly",
      label: "可燃性ガス・毒性ガスなど(第一種ガス以外)のみ",
      help:
        "上記以外のガス。ただしアルシン・ジシラン・ジボラン・セレン化水素・ホスフィン・モノゲルマン・モノシラン" +
        "(特殊高圧ガス)を貯蔵する場合は、施行令第5条の別表により基準が異なるため、都道府県窓口にご確認ください。",
    },
    {
      value: "mixed",
      label: "第一種ガスと、それ以外のガスの両方を貯蔵する",
      help: "同一の貯蔵所で両方を貯蔵する場合",
    },
  ],
};

function makeStorageBandStep(permitThreshold, gasLabel) {
  return {
    id: "storageCapacityBand",
    prompt: `${gasLabel}の貯蔵容積は?`,
    type: "choice",
    help:
      "圧縮ガスは温度0℃・圧力0Paの状態に換算した容積、液化ガスは10キログラムを容積1立方メートルとみなして算定します" +
      "(高圧ガス保安法第16条第3項)。",
    options: [
      { value: "over", label: `${permitThreshold} 立方メートル以上` },
      { value: "between", label: `300 立方メートル以上 ${permitThreshold} 立方メートル未満` },
      { value: "under", label: "300 立方メートル未満" },
    ],
  };
}

const STORAGE_M_STEP = {
  id: "storageM",
  prompt: "不活性ガス等(第一種ガス)の貯蔵容積は?",
  type: "number",
  unit: "立方メートル",
  help: "液化ガスの場合は、10キログラムを容積1立方メートルとみなして換算した数値を入力してください。",
  min: 0,
};

const STORAGE_S2_STEP = {
  id: "storageS2",
  prompt: "それ以外(可燃性ガス・毒性ガスなど)の貯蔵容積は?",
  type: "number",
  unit: "立方メートル",
  help: "液化ガスの場合は、10キログラムを容積1立方メートルとみなして換算した数値を入力してください。",
  min: 0,
};

// 一般則第103条による算式。N(許可基準, m3) = 1000 + (2/3)×M (0<=M<=3000の範囲で線形補間)
function calcStorageThreshold(m) {
  const clamped = Math.max(0, Math.min(m, 3000));
  return 1000 + (2 / 3) * clamped;
}

function getStorageSteps(gasCategoryId, answers) {
  const steps = [STORAGE_SELF_MANUFACTURE_STEP];
  if (answers.selfManufactureStorage === "yes") return steps;
  if (answers.selfManufactureStorage !== "no") return steps;

  if (gasCategoryId === "lpgas") {
    steps.push(STORAGE_LPGAS_SUPPLY_STEP);
    if (answers.lpgasSupply === "yes") return steps;
    if (answers.lpgasSupply !== "no") return steps;
    steps.push(makeStorageBandStep(1000, "液化石油ガス"));
    return steps;
  }

  steps.push(STORAGE_GAS_SCOPE_STEP);
  if (answers.storageGasScope === "type1only") {
    steps.push(makeStorageBandStep(3000, "不活性ガス等(第一種ガス)"));
  } else if (answers.storageGasScope === "otherOnly") {
    steps.push(makeStorageBandStep(1000, "第一種ガス以外のガス"));
  } else if (answers.storageGasScope === "mixed") {
    steps.push(STORAGE_M_STEP, STORAGE_S2_STEP);
  }
  return steps;
}

function evaluateStorage(gasCategoryId, answers) {
  if (!answers.selfManufactureStorage) {
    return { verdict: "invalid", message: "すべての設問に回答してください。" };
  }

  if (answers.selfManufactureStorage === "yes") {
    return {
      verdict: "none",
      title: "貯蔵所の許可・届出は不要となる可能性があります",
      summary:
        "第一種製造者が製造許可を受けたところに従って、その事業所内でそのまま貯蔵する場合、" +
        "貯蔵の技術基準・貯蔵所の許可/届出は製造許可の技術基準に含まれます。",
      citations: [{ lawId: ACT, num: "15", label: "高圧ガス保安法 第15条(貯蔵)" }],
      procedures: [],
      note: "製造・販売など高圧ガス保安法の他の規定が別途適用される場合があります。",
    };
  }

  const storageCitations = [
    { lawId: ACT, num: "15", label: "高圧ガス保安法 第15条(貯蔵)" },
    { lawId: ACT, num: "16", label: "高圧ガス保安法 第16条(貯蔵所)" },
    { lawId: ACT, num: "17_2", label: "高圧ガス保安法 第17条の2(第二種貯蔵所)" },
    { lawId: ORDER, num: "5", label: "高圧ガス保安法施行令 第5条(貯蔵所に係る政令で定めるガスの種類等)" },
  ];

  if (gasCategoryId === "lpgas") {
    if (!answers.lpgasSupply) {
      return { verdict: "invalid", message: "すべての設問に回答してください。" };
    }
    if (answers.lpgasSupply === "yes") {
      return {
        verdict: "other_law",
        title: "液化石油ガス法の対象となる可能性があります",
        summary:
          "液化石油ガス法上の供給設備・貯蔵施設での液化石油ガスの貯蔵は、高圧ガス保安法第15条・第16条・" +
          "第17条の2の対象外です。液化石油ガス法上の規制をご確認ください。",
        citations: storageCitations,
        procedures: [],
        note:
          "液化石油ガスの保安の確保及び取引の適正化に関する法律(液化石油ガス法)上の規制の詳細については、" +
          "本ツールの対象外です。事業所所在地を管轄する都道府県にご確認ください。",
      };
    }
    return evaluateStorageBand(answers, storageCitations, EKISEKI_STORAGE_PROCEDURES, 1000, "液化石油ガス");
  }

  if (!answers.storageGasScope) {
    return { verdict: "invalid", message: "貯蔵するガスの種類を選択してください。" };
  }

  if (answers.storageGasScope === "type1only") {
    return evaluateStorageBand(answers, storageCitations, IPPAN_STORAGE_PROCEDURES, 3000, "不活性ガス等(第一種ガス)");
  }

  if (answers.storageGasScope === "otherOnly") {
    return evaluateStorageBand(answers, storageCitations, IPPAN_STORAGE_PROCEDURES, 1000, "第一種ガス以外のガス");
  }

  if (answers.storageGasScope === "mixed") {
    const m = Number(answers.storageM);
    const s2 = Number(answers.storageS2);
    if (!Number.isFinite(m) || !Number.isFinite(s2) || m < 0 || s2 < 0) {
      return { verdict: "invalid", message: "すべての設問に回答してください。" };
    }
    const total = m + s2;
    const threshold = calcStorageThreshold(m);
    const citations = [
      ...storageCitations,
      { lawId: IPPAN, num: "103", label: "一般高圧ガス保安規則 第103条(第一種貯蔵所に係る貯蔵容積の算定方法)" },
    ];
    const note =
      m > 0 && s2 > 0
        ? "不活性ガス(第一種ガス)と可燃性ガス・毒性ガスなどを併せて貯蔵するため、施行令第5条・一般則第103条の算式" +
          "(N=1000+(2/3)×第一種ガスの貯蔵容積)により許可基準を計算しています。"
        : null;

    if (total >= threshold) {
      return {
        verdict: "permit",
        title: "第一種貯蔵所の設置許可が必要な可能性があります",
        summary: `貯蔵容積の合計が許可基準(約${threshold.toFixed(1)}立方メートル)以上です。都道府県知事の許可が必要です。`,
        citations,
        procedures: IPPAN_STORAGE_PROCEDURES.permit,
        note,
      };
    }
    if (total >= 300) {
      return {
        verdict: "notification",
        title: "第二種貯蔵所の設置届出が必要な可能性があります",
        summary: `貯蔵容積の合計が300立方メートル以上、許可基準(約${threshold.toFixed(1)}立方メートル)未満です。都道府県知事への届出が必要です。`,
        citations,
        procedures: IPPAN_STORAGE_PROCEDURES.notification,
        note,
      };
    }
    return {
      verdict: "none",
      title: "貯蔵所の許可・届出の対象とならない可能性があります",
      summary: "貯蔵容積の合計が300立方メートル未満です。",
      citations,
      procedures: [],
      note: "貯蔵容積が0.15立方メートル(液化ガスは10キログラム)を超える場合、貯蔵所の許可・届出は不要でも、" +
        "貯蔵の技術基準(法第15条)には従う必要があります。",
    };
  }

  return { verdict: "invalid", message: "貯蔵するガスの種類を選択してください。" };
}

function evaluateStorageBand(answers, baseCitations, procedures, permitThreshold, gasLabel) {
  if (!answers.storageCapacityBand) {
    return { verdict: "invalid", message: "すべての設問に回答してください。" };
  }

  if (answers.storageCapacityBand === "over") {
    return {
      verdict: "permit",
      title: "第一種貯蔵所の設置許可が必要な可能性があります",
      summary: `${gasLabel}の許可基準(${permitThreshold}立方メートル)以上に該当します。都道府県知事の許可が必要です。`,
      citations: baseCitations,
      procedures: procedures.permit,
      note: null,
    };
  }

  if (answers.storageCapacityBand === "between") {
    return {
      verdict: "notification",
      title: "第二種貯蔵所の設置届出が必要な可能性があります",
      summary:
        `${gasLabel}の届出基準(300立方メートル)以上、許可基準(${permitThreshold}立方メートル)未満に該当します。` +
        "都道府県知事への届出が必要です。",
      citations: baseCitations,
      procedures: procedures.notification,
      note: null,
    };
  }

  return {
    verdict: "none",
    title: "貯蔵所の許可・届出の対象とならない可能性があります",
    summary: `${gasLabel}の届出基準(300立方メートル)未満です。`,
    citations: baseCitations,
    procedures: [],
    note:
      "貯蔵容積が0.15立方メートル(液化ガスは10キログラム、液化石油ガスは1.5キログラム)を超える場合、" +
      "貯蔵所の許可・届出は不要でも、貯蔵の技術基準(法第15条)には従う必要があります。",
  };
}

/* ---------- 消費 ---------- */
//
// 特定高圧ガス消費者の届出(高圧ガス保安法第24条の2)は、施行令第7条で定める2グループのガスが対象。
// グループ1(施行令7条1項、圧縮又は液化した状態のもの): モノシラン・ホスフィン・アルシン・ジボラン・
//   セレン化水素・モノゲルマン・ジシラン。数量の閾値は政令上定められていない。
// グループ2(施行令7条2項、貯蔵能力の閾値あり): 圧縮水素・圧縮天然ガス(各300m³)、液化酸素・液化アンモニア
//   (各3000kg)、液化塩素(1000kg)、液化石油ガス(一般消費者向けを除き3000kg、液化石油ガス法施行令第2条各号に
//   掲げる者は10000kg)。
// いずれのグループも、法24条の2かっこ書きにより「貯蔵設備の貯蔵能力が政令で定める数量以上である者」または
// 「消費事業所以外の事業所から導管により供給を受ける者」に該当する場合のみ特定高圧ガス消費者となる(許可制度は
// なく、届出のみ)。液化石油ガスの一般消費者向け消費は液化石油ガス法の管轄(施行令7条2項の表かっこ書き)。
// 液化石油ガスのみ液石則が独自の手続き条文(51条以下)を持ち、それ以外は一般則(53条以下)が適用される。
// 冷凍則には消費者固有の規定がなく、冷凍のための消費(大量アンモニア冷媒等)も一般則の規定に従う。
//
// 参照した一次資料:
//  - 高圧ガス保安法 第24条の2(消費)・第24条の3(技術基準)・第24条の4(変更・廃止の届出)・

function makeConsumptionBandStep(gasType) {
  const info = getConsumptionThresholdInfo(gasType);
  const extraHelp =
    gasType === "lpgas"
      ? "液化石油ガスの保安の確保及び取引の適正化に関する法律施行令第2条各号に掲げる者(大口需要家など)が消費する場合は、基準が1万キログラムになります。"
      : null;
  return {
    id: "consumptionStorageBand",
    prompt: `${info.gasLabel}の貯蔵設備の貯蔵能力は?`,
    type: "choice",
    help: "施行令第7条第2項に定める数量です。" + (extraHelp ? " " + extraHelp : ""),
    options: [
      { value: "over", label: `${info.quantity} ${info.unit} 以上` },
      { value: "under", label: `${info.quantity} ${info.unit} 未満(貯蔵設備がない場合を含む)` },
    ],
  };
}

  ],
};

function getConsumptionSteps(gasCategoryId, answers) {
  if (gasCategoryId === "lpgas") {
    const steps = [CONSUMPTION_LPGAS_CONSUMER_STEP];
    if (answers.lpgasConsumer === "yes") return steps;
    if (answers.lpgasConsumer !== "no") return steps;
    steps.push(CONSUMPTION_PIPELINE_STEP);
    if (answers.consumptionPipeline === "yes") return steps;
    if (answers.consumptionPipeline !== "no") return steps;
    steps.push(makeConsumptionBandStep("lpgas"));
    return steps;
  }

  const steps = [CONSUMPTION_GAS_TYPE_STEP];
  const gasType = answers.consumptionGasType;
  if (!gasType || gasType === "other") return steps;

  if (gasType === "special7") {
    steps.push(CONSUMPTION_PIPELINE_STEP);
    if (answers.consumptionPipeline === "yes") return steps;
    if (answers.consumptionPipeline !== "no") return steps;
    steps.push(CONSUMPTION_SPECIAL7_STORAGE_STEP);
    return steps;
  }

  steps.push(CONSUMPTION_PIPELINE_STEP);
  if (answers.consumptionPipeline === "yes") return steps;
  if (answers.consumptionPipeline !== "no") return steps;
  steps.push(makeConsumptionBandStep(gasType));
  return steps;
}

function buildConsumptionResult(gasLabel, procedures, citations, note) {
  return {
    verdict: "notification",
    title: "特定高圧ガス消費者に該当する可能性があります",
    summary: `${gasLabel}の消費者として、事業所ごとに消費開始の日の20日前までに都道府県知事への届出が必要です(高圧ガス保安法第24条の2)。`,
    citations,
    procedures: procedures.notification,
    note,
  };
}

function buildConsumptionNoneResult(gasLabel, citations, extraNote) {
  return {
    verdict: "none",
    title: "特定高圧ガス消費者の届出は不要となる可能性があります",
    summary: `${gasLabel}の貯蔵設備の貯蔵能力が基準未満で、他事業所からの導管供給も受けない場合、特定高圧ガス消費者の届出は不要です。`,
    citations,
    procedures: [],
    note:
      (extraNote ? extraNote + " " : "") +
      "届出が不要な場合でも、可燃性ガス・毒性ガス・酸素・空気を消費する場合は消費の技術基準(法第24条の5)には従う必要があります。",
  };
}

function evaluateConsumption(gasCategoryId, answers) {
  const citations = [
    { lawId: ACT, num: "24_2", label: "高圧ガス保安法 第24条の2(消費)" },
    { lawId: ORDER, num: "7", label: "高圧ガス保安法施行令 第7条(政令で定める種類の高圧ガス)" },
  ];

  if (gasCategoryId === "lpgas") {
    if (!answers.lpgasConsumer) {
      return { verdict: "invalid", message: "すべての設問に回答してください。" };
    }
    if (answers.lpgasConsumer === "yes") {
      return {
        verdict: "other_law",
        title: "液化石油ガス法の対象となる可能性があります",
        summary:
          "一般消費者向けの液化石油ガスの消費は、高圧ガス保安法施行令第7条第2項のかっこ書きにより特定高圧ガス" +
          "消費者の対象外です。液化石油ガス法上の規制をご確認ください。",
        citations,
        procedures: [],
        note:
          "液化石油ガスの保安の確保及び取引の適正化に関する法律(液化石油ガス法)上の規制の詳細については、" +
          "本ツールの対象外です。事業所所在地を管轄する都道府県にご確認ください。",
      };
    }
    if (!answers.consumptionPipeline) {
      return { verdict: "invalid", message: "すべての設問に回答してください。" };
    }
    if (answers.consumptionPipeline === "yes") {
      return buildConsumptionResult("液化石油ガス", EKISEKI_CONSUMPTION_PROCEDURES, citations, null);
    }
    if (!answers.consumptionStorageBand) {
      return { verdict: "invalid", message: "すべての設問に回答してください。" };
    }
    if (answers.consumptionStorageBand === "over") {
      return buildConsumptionResult("液化石油ガス", EKISEKI_CONSUMPTION_PROCEDURES, citations, null);
    }
    return buildConsumptionNoneResult("液化石油ガス", citations, null);
  }

  const gasType = answers.consumptionGasType;
  if (!gasType) {
    return { verdict: "invalid", message: "ガスの種類を選択してください。" };
  }

  if (gasType === "other") {
    return {
      verdict: "none",
      title: "特定高圧ガス消費者の届出は不要となる可能性があります",
      summary: "施行令第7条に定めるガスの種類に該当しないため、特定高圧ガス消費者の届出(法第24条の2)は不要です。",
      citations,
      procedures: [],
      note:
        "可燃性ガス・毒性ガス・酸素・空気を消費する場合は、届出は不要でも消費の技術基準" +
        "(法第24条の5、一般則第59条・第60条)には従う必要があります。",
    };
  }

  if (gasType === "special7") {
    const gasLabel = "モノシラン・ホスフィン・アルシン・ジボラン・セレン化水素・モノゲルマン・ジシラン";
    if (!answers.consumptionPipeline) {
      return { verdict: "invalid", message: "すべての設問に回答してください。" };
    }
    if (answers.consumptionPipeline === "yes") {
      return buildConsumptionResult(gasLabel, IPPAN_CONSUMPTION_PROCEDURES, citations, null);
    }
    if (!answers.consumptionStorage) {
      return { verdict: "invalid", message: "すべての設問に回答してください。" };
    }
    if (answers.consumptionStorage === "yes") {
      return buildConsumptionResult(
        gasLabel,
        IPPAN_CONSUMPTION_PROCEDURES,
        citations,
        "施行令第7条第1項のガスには貯蔵能力の数量基準が定められていないため、貯蔵設備を有する場合は特定高圧ガス消費者に該当します。"
      );
    }
    return buildConsumptionNoneResult(gasLabel, citations, null);
  }

  const info = getConsumptionThresholdInfo(gasType);
  if (!answers.consumptionPipeline) {
    return { verdict: "invalid", message: "すべての設問に回答してください。" };
  }
  if (answers.consumptionPipeline === "yes") {
    return buildConsumptionResult(info.gasLabel, IPPAN_CONSUMPTION_PROCEDURES, citations, null);
  }
  if (!answers.consumptionStorageBand) {
    return { verdict: "invalid", message: "すべての設問に回答してください。" };
  }
  if (answers.consumptionStorageBand === "over") {
    return buildConsumptionResult(info.gasLabel, IPPAN_CONSUMPTION_PROCEDURES, citations, null);
  }
  return buildConsumptionNoneResult(info.gasLabel, citations, null);
}

function getStepsForGasCategory(actionType, gasCategoryId, answers = {}) {
  if (actionType === "sales") return getSalesSteps(gasCategoryId, answers);
  if (actionType === "storage") return getStorageSteps(gasCategoryId, answers);
  if (actionType === "consumption") return getConsumptionSteps(gasCategoryId, answers);
  if (gasCategoryId === "general") return getGeneralSteps(answers);
  if (gasCategoryId === "refrigeration") return getRefrigerationSteps(answers);
  if (gasCategoryId === "lpgas") return getLpgasSteps();
  return [];
}

function evaluateDiagnosis(actionType, gasCategoryId, answers) {
  if (actionType === "sales") return evaluateSales(gasCategoryId, answers);
  if (actionType === "storage") return evaluateStorage(gasCategoryId, answers);
  if (actionType === "consumption") return evaluateConsumption(gasCategoryId, answers);
  if (gasCategoryId === "general") return evaluateGeneral(answers);
  if (gasCategoryId === "refrigeration") return evaluateRefrigeration(answers);
  if (gasCategoryId === "lpgas") return evaluateLpgas(answers);
  return { verdict: "invalid", message: "ガスの種類を選択してください。" };
}

 }
 if(item.kind==='ancillary')return item.ancillaryConfirmed==='yes'?result('minor','製造設備以外の製造施設に係る設備の取替え工事に該当するとの回答に基づきます。'):result('review','冷媒配管や冷媒設備を含む「製造設備」ではないことを図面で確認してください。');
 if(item.kind!=='replace')return result('review','この工事は一括して軽微・届出不要とは判定できません。変更前後の図面、能力、冷媒、工事方法を基に確認してください。');
 if(item.designated!=='no')return result('review','認定指定設備の取替え・変更は専用の選択肢で確認してください。認定の有無が不明な場合は認定証を確認してください。',[ref(REITOU,62)]);

function deadlineFor(date) {
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return null;
 const d=new Date(date+'T00:00:00Z');
 if(!Number.isFinite(d.getTime())||d.toISOString().slice(0,10)!==date)return null;
 d.setUTCDate(d.getUTCDate()-20);return d.toISOString().slice(0,10);
}
function searchCatalog(query) {

 const words=normalize(query).trim().split(/\s+/).filter(Boolean);
 return PROCEDURES.filter(p=>words.every(w=>normalize(p.title+' '+p.subtitle+' '+p.keywords).includes(w)));
}

// e-Govの原文を順序を保って表示。外部応答をHTMLとして挿入しない。
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function plain(n){return typeof n==='string'?n:(n?.children||[]).map(plain).join('');}
function child(n,tag){return(n?.children||[]).find(c=>c?.tag===tag);}
function articleList(data) {
 const body=child(data?.law_full_text,'LawBody'),main=child(body,'MainProvision');
 const result=[];
 function walk(n,chapter='') {
  if(!n||typeof n!=='object')return;
  if(['Chapter','Section'].includes(n.tag))chapter=[chapter,plain(child(n,n.tag+'Title'))].filter(Boolean).join(' / ');
  if(n.tag==='Article')result.push({num:n.attr?.Num,title:plain(child(n,'ArticleTitle')),caption:plain(child(n,'ArticleCaption')),chapter,node:n});
  else for(const c of n.children||[])walk(c,chapter);
 }walk(main);return result;
}
function lawNode(n) {
 if(typeof n==='string')return esc(n);if(!n||typeof n!=='object')return '';
 const tag=n.tag,inside=()=> (n.children||[]).map(lawNode).join('');
 if(tag==='Fig')return '<p class="notice">図があります。図の内容はe-Gov原文で確認してください。</p>';
 if(tag==='Table')return '<div class="table-scroll"><table class="law-table">'+inside()+'</table></div>';
 if(/Table(Header)?Row/.test(tag))return '<tr>'+inside()+'</tr>';
 if(/Table(Header)?Column/.test(tag)){
  const t=tag==='TableHeaderColumn'?'th':'td';let attr='';
  for(const k of ['rowspan','colspan'])if(/^\d{1,3}$/.test(n.attr?.[k]||''))attr+=' '+k+'="'+n.attr[k]+'"';
  return '<'+t+attr+'>'+inside()+'</'+t+'>';
 }
 if(tag==='ArticleTitle')return '<h3>'+inside()+'</h3>';
 if(/(Title|Caption)$/.test(tag))return '<div class="law-label">'+inside()+'</div>';
 if(/^(Paragraph|Item|Subitem\d+|Remarks|List|TableStruct|Appdx.*|SupplProvision|NoteStruct|FormatStruct)$/.test(tag))return '<div class="law-'+(tag==='Paragraph'?'paragraph':'block')+'">'+inside()+'</div>';
 if(tag==='ParagraphNum')return '<b>'+inside()+'</b> ';
 if(tag==='Column')return '<span>'+inside()+'</span>　';
 if(tag==='Sup')return '<sup>'+inside()+'</sup>';if(tag==='Sub')return '<sub>'+inside()+'</sub>';
 if(tag==='Ruby')return '<ruby>'+inside()+'</ruby>';if(tag==='Rt')return '<rt>'+inside()+'</rt>';
 return inside();
}
const lawMemory=new Map(), lawChecks=new Map(), inflight=new Map();
let dbPromise;
function lawDb(){
 if(dbPromise)return dbPromise;
 dbPromise=new Promise(resolve=>{
  let done=false;const end=v=>{if(!done){done=true;resolve(v);}};
  setTimeout(()=>end(null),1800);
  try{const r=indexedDB.open('kouatsu-navigator-laws',1);r.onupgradeneeded=()=>r.result.createObjectStore('laws');r.onsuccess=()=>{if(done)r.result.close();else end(r.result);};r.onerror=()=>end(null);r.onblocked=()=>end(null);}catch{end(null);}
 });return dbPromise;
}
async function cacheLaw(id,data){const db=await lawDb();if(!db)return null;return new Promise(resolve=>{let finished=false;const end=v=>{if(!finished){finished=true;resolve(v);}};setTimeout(()=>end(null),1800);try{const tx=db.transaction('laws',data?'readwrite':'readonly'),store=tx.objectStore('laws');const req=data?store.put(data,id):store.get(id);req.onsuccess=()=>{if(!data)end(req.result||null);};tx.oncomplete=()=>{if(data)end(data);};tx.onerror=()=>end(null);tx.onabort=()=>end(null);}catch{end(null);}});}
function checkedLawData(data,id){
 if(!data||!data.law_full_text||data.law_info?.law_id!==id||!data.revision_info?.law_revision_id)throw new Error('法令データの形式を確認できませんでした。');
 return data;
}
async function currentLaw(id){
 if(inflight.has(id))return inflight.get(id);
 const task=(async()=>{
  lawChecks.set(id,'checking');
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);
  try{
   const response=await fetch('https://laws.e-gov.go.jp/api/2/law_data/'+encodeURIComponent(id)+'?response_format=json',{signal:ctrl.signal,credentials:'omit'});
   if(!response.ok)throw new Error('HTTP '+response.status);
   const data=checkedLawData(await response.json(),id);
   data.fetchedAt=new Date().toISOString();
   data.partial=false;
   lawMemory.set(id,data);
   const revision=data.revision_info;
   lawChecks.set(id,revision.current_revision_status!=='CurrentEnforced'?'different':revision.law_revision_id===SNAPSHOTS[id]?.revision_info.law_revision_id?'match':'different');
   void cacheLaw(id,data);return data;
  }catch(error){lawChecks.set(id,'offline');throw error;}finally{clearTimeout(timer);inflight.delete(id);}
 })();inflight.set(id,task);return task;
}
async function storedLaw(id){
 if(lawMemory.has(id))return lawMemory.get(id);
 const cached=await cacheLaw(id);if(cached){try{checkedLawData(cached,id);lawMemory.set(id,cached);return cached;}catch{}}
 return SNAPSHOTS[id]||null;
}
function versionMessage(ids){
 const states=[...new Set(ids)].map(id=>lawChecks.get(id)||'unchecked');
 if(states.includes('different'))return {kind:'warning',text:'取得した法令の版が案内の確認済み版と異なります。表示中の案内は2026年9月5日確認版です。変更箇所と経過措置を原文で確認してください。'};
 if(states.includes('checking'))return {kind:'notice',text:'案内の確認済み版とe-Govの法令の版を照合しています。'};
 if(states.length&&states.every(s=>s==='match'))return {kind:'notice',text:'参照法令の版は案内の確認済み版と一致しました。自治体資料・通達の確認日は別に表示しています。'};
 if(states.includes('offline'))return {kind:'warning',text:'現在の法令の版を照合できませんでした。案内は2026年9月5日確認版です。収録条文は引き続き読めます。'};
 return {kind:'notice',text:'案内は2026年9月5日に確認した条件に基づきます。現在の法令の版は未照合です。'};
}

function classifySteps(){
 const c=app.classification;if(!c.action||!c.category)return [];
 const intro=[{id:'applicable',prompt:'高圧ガス保安法の適用対象であることを確認していますか？',help:'圧力・温度、設備構成、法第3条・施行令の適用除外を確認します。該当が不明なときは原文・窓口で確認してください。',type:'choice',options:[{value:'yes',label:'適用対象であることを確認済み'},{value:'unknown',label:'未確認・適用除外に該当する可能性がある'}]}];
 if(c.answers.applicable!=='yes')return intro;
 if(c.action==='manufacture')intro.push({id:'designatedScope',prompt:'認定指定設備、特別な認定・個別の取扱いはありますか？',type:'choice',options:[{value:'no',label:'ない（通常の製造区分を確認する）'},{value:'unknown',label:'ある・わからない'}]});
 if(c.action==='storage')intro.push({id:'specialGas',prompt:'第三種ガス（特殊高圧ガス）を含みますか？',help:'アルシン、ジシラン、ジボラン、セレン化水素、ホスフィン、モノゲルマン、モノシラン。',type:'choice',options:[{value:'no',label:'含まない'},{value:'unknown',label:'含む・わからない'}]});
 if((c.action==='manufacture'&&c.answers.designatedScope!=='no')||(c.action==='storage'&&c.answers.specialGas!=='no'))return intro;
 return intro.concat(getStepsForGasCategory(c.action,c.category,c.answers));
}
function classificationResult(){
 const c=app.classification,steps=classifySteps();
 if(steps.some(s=>c.answers[s.id]==='unknown')||c.answers.applicable!=='yes'||(c.action==='manufacture'&&c.answers.designatedScope!=='no')||(c.action==='storage'&&c.answers.specialGas!=='no'))return {verdict:'review',title:'区分を決めるための確認が必要です',summary:'未確認の項目や特別な取扱いがあるため、通常の能力・数量による区分を確定できません。回答内容と設備仕様を窓口に伝えてください。',citations:[{lawId:ACT,num:'3'},{lawId:ACT,num:'5'}]};
 if(steps.some(s=>s.type==='number'&&(!isKnown(c.answers[s.id])||!Number.isFinite(Number(c.answers[s.id])))))return {verdict:'review',title:'数値の確認が必要です',summary:'仕様書の処理能力・貯蔵能力を確認してください。',citations:[]};
 return evaluateDiagnosis(c.action,c.category,c.answers);
}

 let html=crumb('製造・貯蔵・消費・販売の区分')+titleBlock('区分の目安を確認','設備・ガスの使い方を確認する','新設時などの区分を確認するための補助です。変更工事の手続きは「設備・配管を変更する」から確認してください。');
 if(!c.action)return html+'<div class="grid two">'+ACTION_TYPES.map(a=>'<button class="card" data-action="class-action" data-value="'+a.id+'"><strong>'+esc(a.label)+'</strong><p>'+({manufacture:'圧縮・液化・充塡・減圧等、冷凍・空調設備',storage:'ボンベやタンクで保管する',consumption:'ガスを使う',sales:'ガスを販売する'})[a.id]+'</p></button>').join('')+'</div>';
 if(!c.category)return html+'<div class="panel"><h2>'+ACTION_TYPES.find(a=>a.id===c.action).label+'：ガス・設備の区分</h2><div class="question-options">'+getCategoriesForAction(c.action).map(g=>'<button data-action="class-category" data-value="'+g.id+'">'+esc(g.label)+'<span>'+esc(g.help)+'</span></button>').join('')+'</div><div class="actions"><button data-action="class-reset">行為から選び直す</button></div></div>';
 const steps=classifySteps(),done=c.started&&c.index>=steps.length;
 const answers=steps.slice(0,c.index).map((s,i)=>'<div class="answer-item"><b>'+esc(s.prompt)+'</b>'+esc(s.options?.find(o=>o.value===c.answers[s.id])?.label??c.answers[s.id]??'未回答')+'<br><button data-action="class-back" data-index="'+i+'">変更する</button></div>').join('');
 let body='';
 if(done){const r=classificationResult();body='<div class="summary '+(['review','invalid'].includes(r.verdict)?'review':'')+'"><h2>'+esc(r.title||'確認が必要です')+'</h2><p>'+esc(r.summary||r.message||'')+'</p></div>'+(r.note?'<div class="notice">'+esc(r.note)+'</div>':'')+refsHtml((r.citations||[]).map(x=>ref(x.lawId,x.num)))+'<p class="help">通常の区分の目安です。ガス・設備構成・用途による例外や別の手続きがないかも確認してください。</p>'+
 (c.action==='manufacture'&&c.category==='refrigeration'&&r.verdict==='notification'?'<a class="primary" href="#procedure/cold-new">冷凍・第二種製造届の必要書類を見る</a>':'<a class="primary" href="#procedure/'+c.action+'">関係する手続き・公式案内を見る</a>')+
 '<div class="actions"><button data-action="class-reset">最初から確認する</button><button data-action="save">この確認を履歴に保存</button><button data-action="print">印刷・PDF保存</button></div>';
 }else{
  const s=steps[c.index]||steps[0];body='<section class="panel"><div class="progress">'+esc(ACTION_TYPES.find(a=>a.id===c.action).label)+' / <b>質問 '+(c.index+1)+'</b></div><h2>'+esc(s.prompt)+'</h2>'+(s.help?'<p class="help">'+esc(s.help)+'</p>':'');
  if(s.type==='number')body+='<form id="class-number-form"><label class="field" for="class-number"><span>'+esc(s.unit||s.label||'数値')+'</span><input id="class-number" type="number" min="0" step="any" required value="'+esc(c.answers[s.id]||'')+'"></label><button class="primary" type="submit">この数値で進む</button></form>';
  else body+='<div class="question-options">'+(s.options||[]).map(o=>'<button data-action="class-answer" data-value="'+esc(o.value)+'">'+esc(o.label)+(o.help?'<span>'+esc(o.help)+'</span>':'')+'</button>').join('')+'</div>';
  if(!s.options?.some(o=>o.value==='unknown'))body+='<div class="actions"><button data-action="class-answer" data-value="unknown">わからない・資料を確認したい</button></div>';
  body+='<div class="actions"><button data-action="class-back" data-index="'+Math.max(0,c.index-1)+'">前の質問へ</button><button data-action="class-reset">最初から</button></div></section>';
 }
 return html+'<div class="split"><aside class="sidebar"><div class="panel"><h2>回答した内容</h2>'+(answers||'<p class="help">回答がここに表示されます。</p>')+'</div></aside><div>'+body+'</div></div>';
}
function answerClass(value){const c=app.classification,step=classifySteps()[c.index];if(!step)return;c.answers[step.id]=value;c.index++;c.started=true;if(value==='unknown')c.index=classifySteps().length;render(false);}
function renderLaws(themes=false){
 return crumb('法令・例示基準')+titleBlock('原文・基準から確認','法令・例示基準を調べる','収録条文は通信なしでも表示できます。全文の取得や最新版の確認にはインターネット接続が必要です。')+
 '<div class="panel"><div class="law-selection"><label class="field" for="law-select"><span>法令</span><select id="law-select">'+LAWS.map(l=>'<option value="'+l.id+'"'+(l.id===app.law?' selected':'')+'>'+l.name+'</option>').join('')+'</select></label><label class="field" for="law-search"><span>条番号・見出し・本文の言葉</span><input type="search" id="law-search" placeholder="例：19、14の2、耐圧" value="'+esc(app.lawQuery)+'"></label></div><div class="row"><span id="law-meta" class="meta"></span><button data-action="law-refresh">e-Govから現在の全文を取得</button></div></div><div id="law-results" class="panel article-list"><p>収録条文を読み込んでいます…</p></div>'+
 '<section id="themes"><h2 class="section-label">設備・技術テーマから探す</h2><div class="grid two">'+THEMES.map((t,i)=>'<button class="card" data-action="theme" data-index="'+i+'"><strong>'+esc(t.title)+'</strong><p>'+esc(t.description)+'</p></button>').join('')+'</div><h2 class="section-label">例示基準・運用解釈</h2><div class="panel"><p>経済産業省の掲載ページで、対象の規則の「機能性基準の運用について」を開いてください。</p><div class="quick-links">'+['一般高圧ガス保安規則','液化石油ガス保安規則','冷凍保安規則','容器保安規則'].map(name=>'<button data-action="standard" data-name="'+name+'">'+name+'</button>').join('')+'</div><p>'+external(SOURCES.meti,'例示基準・基本通達の掲載ページ')+'</p><p class="help">例示基準は法令の機能性基準への適合例です。原文の条項と例示基準の該当箇所を合わせて確認してください。最新版PDFの個別項目・ページ対応は未収録です。</p></div></section>';
}
function renderLawList(){
 const el=document.getElementById('law-results');if(!el||!app.lawData)return;
 const d=app.lawData,info=d.revision_info,query=app.lawQuery.normalize('NFKC').trim(),num=query.replace(/^第/,'').replace(/条/g,'').replace(/の|-/g,'_');
 const rows=articleList(d).filter(a=>!query||a.num===num||plain(a.node).includes(query));
 document.getElementById('law-meta').textContent=(d.partial?'収録した一部の条文':'取得済みの法令全文')+' ／ 施行日：'+(info.amendment_enforcement_date||'確認できません')+' ／ 取得日：'+String(d.fetchedAt||'').slice(0,10);
 el.innerHTML='<p class="count">'+rows.length+'条'+(d.partial?'（収録範囲内）':'')+'</p>'+(rows.length?rows.map(a=>'<button class="article-button" data-action="evidence" data-law="'+app.law+'" data-num="'+esc(a.num)+'">'+esc(a.title)+' '+esc(a.caption)+'<span>'+esc(a.chapter)+'</span></button>').join(''):'<p class="empty">該当する収録条文がありません。全文を取得するか、e-Gov原文を確認してください。</p>')+
 (!d.partial?'<details><summary>附則・別表・様式等を表示</summary>'+((child(d.law_full_text,'LawBody')?.children||[]).filter(n=>n?.tag&&!['MainProvision','LawTitle','TOC','Preamble'].includes(n.tag)).map(lawNode).join('')||'<p>附則等はありません。</p>')+'</details>':'')+'<p>'+external('https://laws.e-gov.go.jp/law/'+app.law,'e-Gov原文を開く')+'</p>';
}
async function loadLawPage(refresh=false){const token=routeToken,id=app.law;const button=document.querySelector('[data-action="law-refresh"]');if(button)button.disabled=true;
 try{const data=refresh?await currentLaw(id):await storedLaw(id);if(routeToken!==token||id!==app.law)return;app.lawData=data;renderLawList();if(refresh)toast('法令全文を取得しました。案内の判定条件は別に管理しています。');}
 catch{if(routeToken===token)toast('現在の全文を取得できませんでした。収録条文・取得済み条文をご利用ください。');}
 finally{if(routeToken===token&&button)button.disabled=false;refreshStatuses();}
}
async function openEvidence(law,num,refresh=false){
 const meta=LAWS.find(l=>l.id===law);if(!meta)return;
 if(!refresh)showDialog(meta.short+' 第'+num.replaceAll('_','条の')+(num.includes('_')?'':'条'),'<p>条文を読み込んでいます…</p>');
 const token=++evidenceToken;
 try{
  const data=refresh?await currentLaw(law):await storedLaw(law);if(token!==evidenceToken)return;
  const article=articleList(data).find(a=>a.num===num),revision=data.revision_info;
  const same=revision.law_revision_id===SNAPSHOTS[law]?.revision_info.law_revision_id;
  dialogBody.innerHTML='<p class="tag">法令原文</p><p class="meta">'+esc(meta.name)+' ／ 施行日：'+esc(revision.amendment_enforcement_date||'未確認')+'<br>取得日：'+esc(String(data.fetchedAt||'').slice(0,10))+'<br>法令改正ID：'+esc(revision.law_revision_id)+'</p>'+(!same?'<div class="warning">案内の確認済み版と異なる法令本文です。条件・例外・経過措置を確認してください。</div>':'<p class="help">案内と同じ確認済み版の条文です。現在の法令の版との照合状況は案内画面に表示します。</p>')+
   '<div class="actions"><button data-action="refresh-evidence" data-law="'+law+'" data-num="'+esc(num)+'">現在の原文を取得</button>'+external('https://laws.e-gov.go.jp/law/'+law+'#Mp-At_'+num,'e-Govで開く')+'</div>'+(article?'<div class="law-text">'+lawNode(article.node)+'</div>':'<div class="notice">この条は保存版に収録されていません。「現在の原文を取得」又はe-Govで確認してください。</div>');
 }catch{if(token===evidenceToken)dialogBody.insertAdjacentHTML('afterbegin','<div class="warning">現在の条文を取得できませんでした。'+external('https://laws.e-gov.go.jp/law/'+law,'e-Govで確認')+'</div>');}refreshStatuses();
}
function renderMissing(){return titleBlock('ページの確認','該当するページがありません')+'<a href="#home">ホームへ戻る</a>';}
function route(){return location.hash.slice(1).split('/');}
function render(moveFocus=true){
 const [page='',id]=route();routeToken++;
 const active=document.activeElement?.id,scroll=window.scrollY;
 if(page==='procedure')main.innerHTML=renderProcedure(id);
 else if(page==='procedures'){if(id){try{app.query=decodeURIComponent(id);}catch{app.query='';}}main.innerHTML=renderCatalog();}
 else if(page==='change'||page==='change-result')main.innerHTML=renderChange();
 else if(page==='classify')main.innerHTML=renderClassification();
 else if(page==='laws'){main.innerHTML=renderLaws(id==='themes');void loadLawPage();}
 else if(page==='home'||!page)main.innerHTML=renderHome();else main.innerHTML=renderMissing();
 document.querySelectorAll('[data-nav]').forEach(el=>{const match=el.dataset.nav===(page==='laws'?'laws':['procedure','procedures'].includes(page)?'procedures':'home');if(match)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
 if(moveFocus){main.focus({preventScroll:true});window.scrollTo(0,0);}else{if(active)document.getElementById(active)?.focus({preventScroll:true});window.scrollTo(0,scroll);}
 if(page==='procedure'){const p=PROCEDURES.find(p=>p.id===id);if(p)autoVerify([...new Set(p.refs.map(r=>r.law))]);}
 if(page==='change'||page==='change-result')autoVerify([ACT,REITOU]);
 if(page==='change-result')document.getElementById('change-result')?.scrollIntoView();
 if(page==='laws'&&id==='themes')document.getElementById('themes')?.scrollIntoView();
}
function historyEntries(){try{const raw=localStorage.getItem('kouatsu-navigator-history');if(!raw||raw.length>200000)return [];const parsed=JSON.parse(raw);return Array.isArray(parsed)?parsed.filter(e=>e&&typeof e.title==='string'&&typeof e.route==='string'&&e.version===VERSION).slice(0,20):[];}catch{return [];}}
function saveHistory(){
 const [page,id]=route();if(!['procedure','change','change-result','classify'].includes(page)){toast('手続き詳細又は確認結果を開いて保存してください。');return;}
 const title=page==='procedure'?PROCEDURES.find(p=>p.id===id)?.title:page==='classify'?'区分の確認':'設備変更の確認';
 const entry={version:VERSION,date:new Date().toISOString(),title,route:location.hash,region:app.region,forms:app.forms,checks:app.checks,change:app.change,classification:app.classification};
 try{localStorage.setItem('kouatsu-navigator-history',JSON.stringify([entry,...historyEntries()].slice(0,20)));toast('この端末に保存しました。');}catch{toast('この環境では履歴を保存できません。印刷・PDF保存をご利用ください。');}
}
function showHistory(){const entries=historyEntries();showDialog('この端末の照会履歴','<p class="help">保存した回答は、開く時点のツールの条件で再計算します。別の端末には送信しません。</p>'+(entries.length?entries.map((e,i)=>'<div class="list-card"><div><b>'+esc(e.title)+'</b><p>'+esc(e.date.slice(0,16).replace('T',' '))+' ／ '+(e.region==='nara'?'奈良県':'全国共通')+'</p></div><button data-action="restore" data-index="'+i+'">開く</button></div>').join('')+'<div class="actions"><button data-action="clear-history">保存した履歴をすべて削除</button></div>':'<p class="empty">保存した履歴はありません。</p>'));}
if(typeof document!=='undefined'){
document.addEventListener('click',async event=>{
 const el=event.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='close-dialog'){evidenceToken++;dialog.close();}
 else if(a==='evidence')void openEvidence(el.dataset.law,el.dataset.num);
 else if(a==='refresh-evidence'){el.disabled=true;await openEvidence(el.dataset.law,el.dataset.num,true);el.disabled=false;}
 else if(a==='verify')void verify(el.dataset.laws.split(','));
 else if(a==='change-procedure'){const item=app.change.items[Number(el.dataset.index)],r=evaluateChange(app.change.base,item);if(r.procedure){app.forms[r.procedure]??={};if(r.procedure==='cold-change')app.forms[r.procedure].installDesignated=item.kind==='installDesignated'?'yes':'no';if(r.procedure==='cold-minor')app.forms[r.procedure].certMinor=['installDesignated','designated'].includes(item.kind)?'yes':'no';app.checks[r.procedure]={};}}
 else if(a==='law-refresh')void loadLawPage(true);
 else if(a==='print')window.print();
 else if(a==='history')showHistory();
 else if(a==='save')saveHistory();
 else if(a==='clear-history'){try{localStorage.removeItem('kouatsu-navigator-history');showHistory();}catch{toast('保存領域にアクセスできませんでした。');}}
 else if(a==='restore'){
  const e=historyEntries()[Number(el.dataset.index)];if(!e)return;
  if(!e.forms||!e.checks||!Array.isArray(e.change?.items)||e.change.items.length>20||!e.classification?.answers){toast('保存内容を読み取れませんでした。');return;}
  Object.assign(app,{region:e.region==='nara'?'nara':'national',forms:e.forms,checks:e.checks,change:e.change,classification:e.classification});document.getElementById('region').value=app.region;dialog.close();if(location.hash===e.route)render();else location.hash=e.route;
 }
 else if(a==='clear-checks'){app.checks[route()[1]]={};render(false);}
 else if(a==='add-item'){if(app.change.items.length>=20){toast('工事は20件まで追加できます。');return;}app.change.items.push({kind:'replace'});render(false);}
 else if(a==='remove-item'){app.change.items.splice(Number(el.dataset.index),1);render(false);}
 else if(a==='reset-change'){app.change={base:{regime:'refrigeration',class:'unknown',sameClass:'unknown',special:'unknown'},items:[{kind:'replace'}]};render(false);}
 else if(a==='class-reset'){app.classification={action:null,category:null,answers:{},index:0,started:false};render();}
 else if(a==='class-action'){Object.assign(app.classification,{action:el.dataset.value,category:null,answers:{},index:0,started:false});render();}
 else if(a==='class-category'){Object.assign(app.classification,{category:el.dataset.value,answers:{},index:0,started:false});render();}
 else if(a==='class-answer')answerClass(el.dataset.value);
 else if(a==='class-back'){const c=app.classification,i=Number(el.dataset.index);for(const s of classifySteps().slice(i))delete c.answers[s.id];c.index=i;c.started=false;render(false);}
 else if(a==='theme'){const t=THEMES[Number(el.dataset.index)];if(t)showDialog(t.title,'<p>'+esc(t.description)+'</p><h3>法令上の要求・条件</h3>'+refsHtml(t.refs)+'<h3>関連する例示基準</h3><p>冷凍保安規則の機能性基準の運用についてを確認してください。設備の区分と、参照する条項を照合します。</p>'+external(SOURCES.meti,'公式の例示基準・通達一覧'));}
 else if(a==='standard')showDialog(el.dataset.name+'の例示基準','<p>経済産業省の掲載ページで「'+esc(el.dataset.name)+'の機能性基準の運用について」を選んでください。</p><p>PDFの現行版、対象条項、項目名を確認します。PDF全文と個別ページ索引はこのHTMLには内包していません。</p>'+external(SOURCES.meti,'経済産業省の掲載ページを開く'));
 else if(a==='about')showDialog('収録範囲・更新','<p><b>高圧ガス 手続き・基準ナビ v'+VERSION+'</b><br>案内の確認日：'+REVIEW_DATE+'</p><h3>書類・変更案内</h3><p>冷凍の第二種製造届、冷凍の第一種・第二種製造施設の代表的な変更。一般則・液石則等の変更は公式資料案内。個別認定・経過措置等は確認対象として扱います。</p><h3>区分の目安</h3><p>製造・貯蔵・消費・販売の既存算定機能を継承。特別な条件や不明な回答は区分を確定しません。</p><h3>法令・資料</h3><p>法律・施行令・4省令の一部条文を収録。現在の全文はe-Govから取得します。案内の条件は本文の更新だけでは変わりません。過去時点や将来の施行・経過措置を含む判断は原文を確認してください。</p><p>奈良県資料は2026年9月5日に確認。例示基準は経済産業省の掲載ページへ案内します。公式の該非判断・申請の代行は行いません。</p><h3>保存</h3><p>回答は「履歴に保存」でこの端末のブラウザ内に保存。法令は取得時に端末内へ保存を試みます。保存できない環境でも案内を使えます。配布HTMLを移動した場合、履歴は引き継がれないことがあります。</p><p>'+external('https://github.com/Raincoat64/My-tools-portal','配布元・更新情報')+'</p>');
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='region'){app.region=el.value;app.checks={};render(false);return;}
 if(el.dataset.docField){const id=route()[1];app.forms[id]??={};app.forms[id][el.dataset.docField]=el.value;app.checks[id]={};render(false);}
 if(el.dataset.check){const id=route()[1];app.checks[id]??={};app.checks[id][el.dataset.check]=el.checked;render(false);}
 if(el.dataset.baseField){app.change.base[el.dataset.baseField]=el.value;render(false);}
 if(el.dataset.itemField){const item=app.change.items[Number(el.dataset.item)];if(el.dataset.itemField==='kind')app.change.items[Number(el.dataset.item)]={kind:el.value};else item[el.dataset.itemField]=el.value;render(false);}
 if(el.id==='law-select'){app.law=el.value;app.lawData=null;app.lawQuery='';render(false);}
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='procedure-search'){app.query=el.value;document.getElementById('catalog-results').innerHTML=catalogResults();}if(el.id==='law-search'){app.lawQuery=el.value;renderLawList();}});
document.addEventListener('submit',event=>{if(event.target.id==='class-number-form'){event.preventDefault();const input=document.getElementById('class-number');if(input.value.trim()===''||!Number.isFinite(Number(input.value))||Number(input.value)<0){toast('0以上の数値を入力してください。');return;}answerClass(input.value);}});
dialog.addEventListener('close',()=>evidenceToken++);
window.addEventListener('hashchange',()=>render());
window.addEventListener('beforeprint',()=>{
 document.getElementById('print-conditions')?.remove();
 const values=[...main.querySelectorAll('select,input[type=date]')].map(el=>{
  const label=main.querySelector('label[for="'+el.id+'"]>span')?.textContent||el.id;
  const value=el.tagName==='SELECT'?el.selectedOptions[0]?.textContent:el.value;
  return value?'<li>'+esc(label)+'：'+esc(value)+'</li>':'';
 }).join('');
 const block=document.createElement('div');block.id='print-conditions';block.className='print-only panel';
 block.innerHTML='<h2>確認時の条件</h2><p>対象地域：'+(app.region==='nara'?'奈良県':'全国共通の法令のみ')+' ／ 案内の確認日：'+REVIEW_DATE+'</p>'+(values?'<ul>'+values+'</ul>':'');
 main.prepend(block);
});
render(false);
}
</script>
