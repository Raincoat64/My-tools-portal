<body>
  <header class="app-header">
    <a href="../index.html" style="display:inline-block;margin-bottom:6px;font-size:0.85rem;color:var(--accent,#2f6b3a);text-decoration:none;">‹ ツール一覧</a>
    <h1>LP法(液化石油ガス法) 法令ビューア</h1>
    <p class="app-sub">
      対象法令: 液化石油ガスの保安の確保及び取引の適正化に関する法律 / 同施行令 / 同施行規則
      <br />データ出典: <a href="https://laws.e-gov.go.jp/" target="_blank" rel="noopener">e-Gov法令検索</a>
      (<a href="https://laws.e-gov.go.jp/api/2/swagger-ui" target="_blank" rel="noopener">法令API Version 2</a>)
    </p>
  </header>

  <div class="app-layout">
    <main class="main-panel">
      <div class="mode-tabs" id="mode-tabs" role="tablist">
        <button type="button" class="mode-tab" data-mode="diagnosis" role="tab">設問で調べる</button>
        <button type="button" class="mode-tab" data-mode="browse" role="tab">条文を直接みる</button>
      </div>
      <nav class="breadcrumb" id="breadcrumb" aria-label="選択パンくず"></nav>
      <section class="stage" id="stage"></section>
    </main>

    <aside class="history-panel">
      <div class="history-header">
        <h2>照会履歴</h2>
        <button id="clear-history-btn" class="btn-link" type="button">すべて削除</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
    </aside>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
"use strict";

/* =========================================================
   constants.js
   ========================================================= */

// 対象法令(LP法本体・施行令・施行規則)の law_id は e-Gov 法令API v2 の
// GET /laws?law_title=... で事前に確認済みの値。
const TARGET_LAWS = [
  {
    lawId: "342AC0000000149",
    shortName: "法",
    title: "液化石油ガスの保安の確保及び取引の適正化に関する法律",
  },
  {
    lawId: "343CO0000000014",
    shortName: "施行令",
    title: "液化石油ガスの保安の確保及び取引の適正化に関する法律施行令",
  },
  {
    lawId: "409M50000400011",
    shortName: "施行規則",
    title: "液化石油ガスの保安の確保及び取引の適正化に関する法律施行規則",
  },
];

// 設問モードの判定根拠として条文を引用する際に参照する法令(他法令の関連条文の
// 原文表示のためだけに使う。対象3法令とは別枠)。
const REFERENCE_LAWS = [
  {
    lawId: "326AC0000000204",
    shortName: "高圧法",
    title: "高圧ガス保安法",
  },
];

const ALL_LAWS = [...TARGET_LAWS, ...REFERENCE_LAWS];

function findLawMeta(lawId) {
  return ALL_LAWS.find((l) => l.lawId === lawId) || null;
}

const API_BASE = "https://laws.e-gov.go.jp/api/2";

/* =========================================================
   api.js
   ========================================================= */

// 法令本文全体を取得する。e-Gov 法令API v2 /law_data/{law_id_or_num}
// レスポンスは { law_info, revision_info, law_full_text, ... } の形。
async function fetchLawData(lawId) {
  const url = `${API_BASE}/law_data/${encodeURIComponent(lawId)}?response_format=json`;
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(`法令データの取得に失敗しました (HTTP ${res.status}): ${lawId}`);
  }
  return res.json();
}

/* =========================================================
   storage.js
   ========================================================= */

// ブラウザの IndexedDB を使った法令データキャッシュと照会履歴の永続化。
// サーバーは一切使わず、この端末・このブラウザ内にのみ保存される。

const DB_NAME = "lp-law-viewer-db";
const DB_VERSION = 1;
const STORE_LAW_CACHE = "lawCache";
const STORE_HISTORY = "history";

let dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_LAW_CACHE)) {
        db.createObjectStore(STORE_LAW_CACHE, { keyPath: "lawId" });
      }
      if (!db.objectStoreNames.contains(STORE_HISTORY)) {
        const store = db.createObjectStore(STORE_HISTORY, {
          keyPath: "id",
          autoIncrement: true,
        });
        store.createIndex("timestamp", "timestamp");
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(storeName, mode) {
  return openDb().then(
    (db) => db.transaction(storeName, mode).objectStore(storeName)
  );
}

// --- 法令データキャッシュ ---

async function getCachedLaw(lawId) {
  const store = await tx(STORE_LAW_CACHE, "readonly");
  return new Promise((resolve, reject) => {
    const req = store.get(lawId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function putCachedLaw(lawId, data, updated) {
  const store = await tx(STORE_LAW_CACHE, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.put({
      lawId,
      data,
      updated: updated || null,
      fetchedAt: new Date().toISOString(),
    });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function clearCachedLaw(lawId) {
  const store = await tx(STORE_LAW_CACHE, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.delete(lawId);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// --- 照会履歴 ---

const MAX_HISTORY = 200;

async function addHistoryEntry(entry) {
  const store = await tx(STORE_HISTORY, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.add({
      ...entry,
      timestamp: new Date().toISOString(),
    });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function listHistory(limit = MAX_HISTORY) {
  const store = await tx(STORE_HISTORY, "readonly");
  return new Promise((resolve, reject) => {
    const results = [];
    const req = store.index("timestamp").openCursor(null, "prev");
    req.onsuccess = () => {
      const cursor = req.result;
      if (cursor && results.length < limit) {
        results.push(cursor.value);
        cursor.continue();
      } else {
        resolve(results);
      }
    };
    req.onerror = () => reject(req.error);
  });
}

async function clearHistory() {
  const store = await tx(STORE_HISTORY, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function deleteHistoryEntry(id) {
  const store = await tx(STORE_HISTORY, "readwrite");
  return new Promise((resolve, reject) => {
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* =========================================================
   lawTree.js
   ========================================================= */

// e-Gov 法令API v2 の law_full_text (tag/attr/children のXML由来ツリー) から
// 法令 → 章 → 節(あれば) → 条 のナビゲーション構造を組み立てるユーティリティ。

// ノード配下の文字列を再帰的に連結して取り出す(タグに関わらず安全に使える)。
function extractText(node) {
  if (typeof node === "string") return node;
  if (!node || !Array.isArray(node.children)) return "";
  return node.children.map(extractText).join("");
}

// 指定タグの直接の子ノードを1つ取得。
function findChild(node, tag) {
  if (!node || !Array.isArray(node.children)) return null;
  return node.children.find((c) => c && c.tag === tag) || null;
}

function findChildren(node, tag) {
  if (!node || !Array.isArray(node.children)) return [];
  return node.children.filter((c) => c && c.tag === tag);
}

function getChildText(node, tag) {
  const child = findChild(node, tag);
  return child ? extractText(child).trim() : "";
}

// Column を持つ文(定義規定などで「用語」「意義」のように列が分かれる場合)を
// 読みやすく全角スペース区切りで連結する。Column が無ければ通常のテキスト抽出。
function extractSentenceText(node) {
  if (!node) return "";
  const columns = findChildren(node, "Column");
  if (columns.length > 0) {
    return columns.map((c) => extractText(c).trim()).join("　");
  }
  return extractText(node).trim();
}

function makeArticleSummary(articleNode) {
  const num = articleNode.attr && articleNode.attr.Num;
  const title = getChildText(articleNode, "ArticleTitle") || `第${num}条`;
  const caption = getChildText(articleNode, "ArticleCaption");
  return { num, title, caption, node: articleNode };
}

// Section/Subsection など入れ子構造の中から Article を出現順にすべて収集する。
function collectArticlesDeep(nodes) {
  let result = [];
  for (const n of nodes || []) {
    if (!n || typeof n !== "object") continue;
    if (n.tag === "Article") {
      result.push(makeArticleSummary(n));
    } else if (Array.isArray(n.children)) {
      result = result.concat(collectArticlesDeep(n.children));
    }
  }
  return result;
}

// LawBody.MainProvision から 章(Chapter) → 節(Section) → 条(Article) の
// ナビゲーションツリーを構築する。章が無い法令は単一の仮想章にまとめる。
function buildChapters(mainProvisionNode) {
  const topChildren = (mainProvisionNode && mainProvisionNode.children) || [];
  const hasChapters = topChildren.some((c) => c && c.tag === "Chapter");

  if (!hasChapters) {
    const articles = collectArticlesDeep(topChildren);
    if (articles.length === 0) return [];
    return [
      {
        key: "c-single",
        num: null,
        title: null,
        sections: [],
        articles,
      },
    ];
  }

  const chapters = [];
  topChildren
    .filter((c) => c && c.tag === "Chapter")
    .forEach((chapterNode, ci) => {
      const num = (chapterNode.attr && chapterNode.attr.Num) || String(ci);
      const title = getChildText(chapterNode, "ChapterTitle") || `第${num}章`;
      const sections = [];
      const directArticles = [];

      for (const child of chapterNode.children || []) {
        if (!child || typeof child !== "object") continue;
        if (child.tag === "Section") {
          const sNum = (child.attr && child.attr.Num) || String(sections.length);
          const sTitle = getChildText(child, "SectionTitle") || `第${sNum}節`;
          const sArticles = collectArticlesDeep(child.children || []);
          if (sArticles.length > 0) {
            sections.push({
              key: `c${num}-s${sNum}`,
              num: sNum,
              title: sTitle,
              articles: sArticles,
            });
          }
        } else if (child.tag === "Article") {
          directArticles.push(makeArticleSummary(child));
        }
      }

      if (sections.length > 0 || directArticles.length > 0) {
        chapters.push({
          key: `c${num}`,
          num,
          title,
          sections,
          articles: directArticles,
        });
      }
    });

  return chapters;
}

function getLawTitle(lawData) {
  const lawBody = findChild(lawData.law_full_text, "LawBody");
  return getChildText(lawBody, "LawTitle") || lawData.revision_info?.law_title || "";
}

function getMainProvision(lawData) {
  const lawBody = findChild(lawData.law_full_text, "LawBody");
  return findChild(lawBody, "MainProvision");
}

// 条番号(例: "5", "3_2")を指定して、法令内から該当条文ノードを1件検索する。
// 設問モードの判定根拠(引用条文)を表示するために使う。
function findArticleByNum(mainProvisionNode, num) {
  const stack = [mainProvisionNode];
  while (stack.length > 0) {
    const node = stack.pop();
    if (!node || typeof node !== "object") continue;
    if (node.tag === "Article" && node.attr && node.attr.Num === num) {
      return makeArticleSummary(node);
    }
    for (const c of node.children || []) {
      if (c && typeof c === "object") stack.push(c);
    }
  }
  return null;
}

   render.js
   ========================================================= */

// 条文(Article)ノードを人間が読みやすいHTMLに変換する再帰レンダラー。
// e-Gov法令標準XMLスキーマの主要タグ(Paragraph/Item/Subitem1-3/List/Table等)を
// 明示的に扱い、未対応タグはテキストのみ安全に抽出するフォールバックを持つ。

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function findChild(node, tag) {
  if (!node || !Array.isArray(node.children)) return null;
  return node.children.find((c) => c && c.tag === tag) || null;
}
function findChildren(node, tag) {
  if (!node || !Array.isArray(node.children)) return [];
  return node.children.filter((c) => c && c.tag === tag);
}
function textOf(node, tag) {
  const c = findChild(node, tag);
  return c ? extractText(c).trim() : "";
}

function renderArticle(articleNode) {
  const title = textOf(articleNode, "ArticleTitle");
  const caption = textOf(articleNode, "ArticleCaption");

  let html = '<div class="article">';
  html += '<div class="article-head">';
  if (caption) {
    html += `<span class="article-caption">${escapeHtml(caption)}</span>`;
  }
  html += `<span class="article-title">${escapeHtml(title)}</span>`;
  html += "</div>";

  for (const child of articleNode.children || []) {
    if (!child || typeof child !== "object") continue;
    if (child.tag === "Paragraph") {
      html += renderParagraph(child);
    } else if (child.tag === "ArticleCaption" || child.tag === "ArticleTitle") {
      // 見出しとして既に表示済み
    } else if (typeof child !== "string") {
      html += renderGenericBlock(child);
    }
  }

  html += "</div>";
  return html;
}

function renderParagraph(p) {
  const numText = textOf(p, "ParagraphNum"); // 第1項は空、第2項以降は全角数字
  const caption = textOf(p, "ParagraphCaption");
  const sentenceNode = findChild(p, "ParagraphSentence");
  const sentenceText = sentenceNode ? extractSentenceText(sentenceNode) : "";

  let html = '<div class="paragraph">';
  if (caption) {
    html += `<div class="paragraph-caption">${escapeHtml(caption)}</div>`;
  }
  html += '<div class="paragraph-line">';
  html += `<span class="para-num">${escapeHtml(numText)}</span>`;
  html += `<span class="para-text">${escapeHtml(sentenceText)}</span>`;
  html += "</div>";

  const items = findChildren(p, "Item");
  if (items.length > 0) {
    html += '<div class="item-list">' + items.map(renderItem).join("") + "</div>";
  }

  const lists = findChildren(p, "List");
  if (lists.length > 0) {
    html += lists.map(renderList).join("");
  }

  const tables = findChildren(p, "TableStruct");
  if (tables.length > 0) {
    html += tables.map(renderTableStruct).join("");
  }

  const remarks = findChildren(p, "Remarks");
  if (remarks.length > 0) {
    html += remarks.map(renderRemarks).join("");
  }

  html += "</div>";
  return html;
}

function renderItem(item) {
  const title = textOf(item, "ItemTitle");
  const sentenceNode = findChild(item, "ItemSentence");
  const sentenceText = sentenceNode ? extractSentenceText(sentenceNode) : "";

  let html = '<div class="item">';
  html += '<div class="item-line">';
  html += `<span class="item-title">${escapeHtml(title)}</span>`;
  html += `<span class="item-text">${escapeHtml(sentenceText)}</span>`;
  html += "</div>";

  html += renderSubitems(item, 1);

  const tables = findChildren(item, "TableStruct");
  if (tables.length > 0) {
    html += tables.map(renderTableStruct).join("");
  }

  html += "</div>";
  return html;
}

function renderSubitems(node, level) {
  const tag = `Subitem${level}`;
  const subs = findChildren(node, tag);
  if (subs.length === 0) return "";

  const titleTag = `${tag}Title`;
  const sentenceTag = `${tag}Sentence`;

  let html = `<div class="subitem-list level-${level}">`;
  for (const sub of subs) {
    const title = textOf(sub, titleTag);
    const sentenceNode = findChild(sub, sentenceTag);
    const sentenceText = sentenceNode ? extractSentenceText(sentenceNode) : "";
    html += `<div class="subitem level-${level}">`;
    html += '<div class="item-line">';
    html += `<span class="item-title">${escapeHtml(title)}</span>`;
    html += `<span class="item-text">${escapeHtml(sentenceText)}</span>`;
    html += "</div>";
    html += renderSubitems(sub, level + 1);
    html += "</div>";
  }
  html += "</div>";
  return html;
}

function renderList(listNode) {
  const sentences = findChildren(listNode, "ListSentence");
  if (sentences.length === 0) {
    return `<div class="list-block">${escapeHtml(extractText(listNode).trim())}</div>`;
  }
  return (
    '<div class="list-block">' +
    sentences.map((s) => `<div class="list-line">${escapeHtml(extractSentenceText(s))}</div>`).join("") +
    "</div>"
  );
}

function renderRemarks(remarksNode) {
  const label = textOf(remarksNode, "RemarksLabel") || "備考";
  const paragraphs = findChildren(remarksNode, "Paragraph");
  let html = '<div class="remarks">';
  html += `<div class="remarks-label">${escapeHtml(label)}</div>`;
  if (paragraphs.length > 0) {
    html += paragraphs.map(renderParagraph).join("");
  } else {
    html += `<div class="remarks-text">${escapeHtml(extractText(remarksNode).trim())}</div>`;
  }
  html += "</div>";
  return html;
}

function renderTableStruct(tableStructNode) {
  const table = findChild(tableStructNode, "Table");
  if (!table) {
    return `<div class="table-fallback">${escapeHtml(extractText(tableStructNode).trim())}</div>`;
  }
  const rows = findChildren(table, "TableRow");
  let html = '<table class="law-table"><tbody>';
  for (const row of rows) {
    html += "<tr>";
    const cols = findChildren(row, "TableColumn");
    for (const col of cols) {
      const attr = col.attr || {};
      const attrs = [];
      if (attr.colspan) attrs.push(`colspan="${escapeHtml(attr.colspan)}"`);
      if (attr.rowspan) attrs.push(`rowspan="${escapeHtml(attr.rowspan)}"`);
      html += `<td ${attrs.join(" ")}>${escapeHtml(extractSentenceText(col))}</td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  return html;
}

// 上記で明示的に扱っていないタグに対する安全なフォールバック。
// 内容は失わず、プレーンテキストとして表示する。
function renderGenericBlock(node) {
  const text = extractText(node).trim();
  if (!text) return "";
  return `<div class="generic-block">${escapeHtml(text)}</div>`;
}

    type: "choice",
    options: capacityOptions,
  });
  return steps;
}

function stepsConstructionNotification(answers) {
  const steps = [
    {
      id: "facilityType",
      prompt: "工事対象の施設・建築物は、次のいずれかに該当しますか？",
      help: "学校・病院・診療所・劇場・映画館・演芸場・公会堂・キャバレー等・貸席飲食店・百貨店マーケット・旅館ホテル寄宿舎共同住宅・図書館博物館美術館・公衆浴場・駅や船舶航空機発着場・神社寺院教会・床面積1,000㎡以上の事務所(いずれかに類する施設を含む)",
      type: "choice",
      options: [
        { value: "yes", label: "該当する" },
        { value: "no", label: "該当しない" },
      ],
    },
  ];
  if (answers.facilityType !== "yes") return steps;

  steps.push({
    id: "capacityOver500",
    prompt: "その供給設備(特定供給設備を除く)に係る貯蔵能力は500kgを超えますか？",
    type: "choice",
    options: [
      { value: "yes", label: "超える" },
      { value: "no", label: "超えない" },
    ],
  });
  if (answers.capacityOver500 !== "yes") return steps;

  steps.push({
    id: "workType",
    prompt: "行う工事の内容は？",
    type: "choice",
    options: [
      { value: "pipe_extension", label: "供給管の延長を伴う工事" },
      { value: "storage_change", label: "貯蔵設備の位置変更又は貯蔵能力の増加を伴う工事" },
      { value: "other", label: "上記以外(容器交換のみ等)" },
    ],
  });
  return steps;
}

function evalConstructionNotification(answers) {
  if (answers.facilityType !== "yes") {
    return {
      verdict: "not_required",
      title: "設備工事の届出は不要です",
      summary: "工事対象の施設・建築物が届出対象の類型に該当しないため、この規定による届出は不要です。",
      citations: [cite(RULE, "86", "施行規則第八十六条(施設又は建築物の指定)")],
    };
  }
  if (answers.capacityOver500 !== "yes") {
    return {
      verdict: "not_required",
      title: "設備工事の届出は不要です",
      summary: "供給設備の貯蔵能力が500kgを超えないため、この規定による届出は不要です。",
      citations: [cite(RULE, "87", "施行規則第八十七条(液化石油ガス設備工事)")],
    };
  }
  if (answers.workType === "other") {
    return {
      verdict: "not_required",
      title: "設備工事の届出は不要です",
      summary: "供給管の延長、又は貯蔵設備の位置変更・貯蔵能力の増加のいずれにも該当しない工事のため、この規定による届出は不要です。",
      citations: [cite(RULE, "87", "施行規則第八十七条(液化石油ガス設備工事)")],
    };
  }
  return {
    verdict: "notification",
    title: "液化石油ガス設備工事の届出が必要です",
    summary:
      "対象施設・建築物、貯蔵能力500kg超、かつ供給管の延長又は貯蔵設備の位置変更・能力増加を伴う工事のいずれにも該当するため、工事後遅滞なく所在地を管轄する都道府県知事への届出が必要です。",
    procedures: [cite(LAW, "38_3", "第三十八条の三(液化石油ガス設備工事の届出)"), cite(RULE, "88", "施行規則第八十八条(工事の届出)")],
    citations: [
      cite(LAW, "38_3", "第三十八条の三(液化石油ガス設備工事の届出)"),
      cite(RULE, "86", "施行規則第八十六条(施設又は建築物の指定)"),
      cite(RULE, "87", "施行規則第八十七条(液化石油ガス設備工事)"),
      cite(RULE, "88", "施行規則第八十八条(工事の届出)"),
    ],
  };
}

const STEP_BUILDERS = {
  sales_registration: stepsSalesRegistration,
  safety_org: stepsSafetyOrg,
  supply_equipment: stepsSupplyEquipment,
  construction_notification: stepsConstructionNotification,
};

const EVALUATORS = {
  sales_registration: evalSalesRegistration,
  safety_org: evalSafetyOrg,
  supply_equipment: evalSupplyEquipment,
  construction_notification: evalConstructionNotification,
};

function getStepsForAction(actionType, answers) {
  const builder = STEP_BUILDERS[actionType];
  return builder ? builder(answers) : [];
}

function evaluateDiagnosis(actionType, answers) {
  const evaluator = EVALUATORS[actionType];
  if (!evaluator) {
    return { verdict: "invalid", title: "対象外", summary: "", citations: [] };
  }
  return evaluator(answers);
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

// --- 法令データ取得(キャッシュ優先、対象3法令・参照法令いずれにも使える) ---

async function loadLawData(lawMeta, { forceRefresh = false } = {}) {
  if (forceRefresh) {
    await clearCachedLaw(lawMeta.lawId);
  }
  const cached = await getCachedLaw(lawMeta.lawId);
  if (cached && !forceRefresh) {
    return cached.data;
  }
  const data = await fetchLawData(lawMeta.lawId);
  await putCachedLaw(lawMeta.lawId, data, data?.revision_info?.updated || null);
  return data;
}

/* =========================================================
   設問モード (diagnosis)
   ========================================================= */

function resetDiagnosis() {
  appState.diag = {
    actionType: null,
    stepIndex: 0,
    answers: {},
    result: null,
    expandedCitations: new Set(),
    citationCache: new Map(),
  };
  render();
}

function selectActionType(actionType) {
  if (!actionType.available) return;
  appState.diag.actionType = actionType.id;
  appState.diag.stepIndex = 0;
  appState.diag.answers = {};
  appState.diag.result = null;
  render();
}

async function finalizeDiagnosisResult() {
  const result = evaluateDiagnosis(appState.diag.actionType, appState.diag.answers);
  appState.diag.result = result;
  render();

  if (result.verdict !== "invalid") {
    try {
      await addHistoryEntry({
        type: "diagnosis",
        actionType: appState.diag.actionType,
        actionLabel: ACTION_TYPES.find((a) => a.id === appState.diag.actionType)?.label,
        answers: { ...appState.diag.answers },
        verdict: result.verdict,
        title: result.title,
        summary: result.summary,
      });
      await renderHistory();
    } catch (err) {
      console.error("履歴の保存に失敗しました", err);
    }
  }
}

function formatAnswerLabel(step, value) {
  if (step.type === "choice") {
    const opt = step.options.find((o) => o.value === value);
    return opt ? opt.label : String(value);
  }
  return `${value}${step.unit ? " " + step.unit : ""}`;
}

function goToDiagStep(index) {
  const steps = getStepsForAction(appState.diag.actionType, appState.diag.answers);
  for (let j = index; j < steps.length; j++) {
    delete appState.diag.answers[steps[j].id];
  }
  appState.diag.stepIndex = index;
  appState.diag.result = null;
  render();
}

async function answerStep(step, value) {
  appState.diag.answers[step.id] = value;
  const steps = getStepsForAction(appState.diag.actionType, appState.diag.answers);
  if (appState.diag.stepIndex < steps.length - 1) {
    appState.diag.stepIndex += 1;
    render();
    return;
  }
  // 最終設問に回答 → 判定
  await finalizeDiagnosisResult();
}

function renderDiagBreadcrumb() {
  breadcrumbEl.innerHTML = "";
  breadcrumbEl.appendChild(crumbButton("行為選択", () => resetDiagnosis()));

  if (!appState.diag.actionType) return;

  const actionMeta = ACTION_TYPES.find((a) => a.id === appState.diag.actionType);
  breadcrumbEl.appendChild(crumbSep());
  if (appState.diag.result || appState.diag.stepIndex > 0) {
    breadcrumbEl.appendChild(crumbButton(actionMeta.label, () => goToDiagStep(0)));
  } else {
    breadcrumbEl.appendChild(crumbCurrent(actionMeta.label));
  }

  const steps = getStepsForAction(appState.diag.actionType, appState.diag.answers);
  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    if (!(step.id in appState.diag.answers)) break;
    breadcrumbEl.appendChild(crumbSep());
    const label = formatAnswerLabel(step, appState.diag.answers[step.id]);
    const isCurrent = i === appState.diag.stepIndex && !appState.diag.result;
    if (isCurrent) {
      breadcrumbEl.appendChild(crumbCurrent(label));
    } else {
      breadcrumbEl.appendChild(crumbButton(label, () => goToDiagStep(i)));
    }
  }

  if (appState.diag.result) {
    breadcrumbEl.appendChild(crumbSep());
    breadcrumbEl.appendChild(crumbCurrent("判定結果"));
  }
}

function renderDiagStage() {
  if (appState.diag.actionType && !appState.diag.result) {
    const pendingSteps = getStepsForAction(appState.diag.actionType, appState.diag.answers);
    if (appState.diag.stepIndex >= pendingSteps.length) {
      // これ以上の設問がなく、直ちに判定できる場合。finalizeDiagnosisResult が
      // 結果を確定させたうえで render() を呼び直すので、ここでは stageEl に
      // 手を加えずに抜ける(二重描画による上書きを避ける)。
      finalizeDiagnosisResult();
      return;
    }
  }

  stageEl.innerHTML = "";
  const wrap = document.createElement("div");

  const disclaimer = document.createElement("div");
  disclaimer.className = "disclaimer";
  disclaimer.textContent = DISCLAIMER;
  wrap.appendChild(disclaimer);

  const body = document.createElement("div");
  body.className = "stage";

  if (!appState.diag.actionType) {
    body.appendChild(renderActionTypeStep());
  } else if (appState.diag.result) {
    body.appendChild(renderResultStep());
  } else {
    body.appendChild(renderQuestionStep());
  }

  wrap.appendChild(body);
  stageEl.appendChild(wrap);
}

function renderActionTypeStep() {
  const wrap = document.createElement("div");
  const h2 = document.createElement("h2");
  h2.textContent = "何についてお調べですか?";
  wrap.appendChild(h2);

  const grid = document.createElement("div");
  grid.className = "card-grid";
  for (const action of ACTION_TYPES) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "pick-card";
    if (!action.available) card.style.opacity = "0.5";
    card.innerHTML = `<span class="pick-title">${escapeHtml(action.label)}</span><span class="pick-sub">${escapeHtml(
      action.help || ""
    )}</span>`;
    card.addEventListener("click", () => selectActionType(action));
    grid.appendChild(card);
  }
  wrap.appendChild(grid);
  return wrap;
}

function renderQuestionStep() {
  const steps = getStepsForAction(appState.diag.actionType, appState.diag.answers);
  const step = steps[appState.diag.stepIndex];
  const wrap = document.createElement("div");

  const h2 = document.createElement("h2");
  h2.textContent = step.prompt;
  wrap.appendChild(h2);

  if (step.help) {
    const help = document.createElement("div");
    help.className = "diag-help";
    help.textContent = step.help;
    wrap.appendChild(help);
  }

  if (step.type === "choice") {
    const list = document.createElement("div");
    list.className = "pick-list";
    for (const opt of step.options) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "pick-card";
      card.innerHTML = `<span class="pick-title">${escapeHtml(opt.label)}</span>${
        opt.help ? `<span class="pick-sub">${escapeHtml(opt.help)}</span>` : ""
      }`;
      card.addEventListener("click", () => answerStep(step, opt.value));
      list.appendChild(card);
    }
    wrap.appendChild(list);
  } else if (step.type === "number") {
    const row = document.createElement("div");
    row.className = "diag-number-row";
    const input = document.createElement("input");
    input.type = "number";
    input.min = String(step.min ?? 0);
    input.step = "any";
    input.placeholder = "数値を入力";
    const unit = document.createElement("span");
    unit.className = "unit";
    unit.textContent = step.unit || "";
    row.appendChild(input);
    row.appendChild(unit);
    wrap.appendChild(row);

    const actions = document.createElement("div");
    actions.className = "diag-actions";
    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "btn-primary";
    nextBtn.textContent = "次へ";
    nextBtn.disabled = true;
    input.addEventListener("input", () => {
      const v = Number(input.value);
      nextBtn.disabled = input.value === "" || !Number.isFinite(v) || v < 0;
    });
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !nextBtn.disabled) answerStep(step, input.value);
    });
    nextBtn.addEventListener("click", () => answerStep(step, input.value));
    actions.appendChild(nextBtn);
    wrap.appendChild(actions);

    setTimeout(() => input.focus(), 0);
  }

  return wrap;
}

const VERDICT_LABELS = {
  registration: "登録",
  certification: "認定",
  notification: "届出",
  not_required: "手続き不要",
  out_of_scope: "対象外",
  blocked: "要注意",
  info: "技術基準",
  large_scale: "対象外(大規模設備)",

function verdictLabel(verdict) {

}

function renderResultStep() {
  const result = appState.diag.result;
  const wrap = document.createElement("div");

  const banner = document.createElement("div");
  banner.className = `verdict-banner ${result.verdict}`;
  banner.innerHTML = `
    <div class="verdict-title">${escapeHtml(verdictLabel(result.verdict))} — ${escapeHtml(result.title)}</div>
    <div class="verdict-summary">${escapeHtml(result.summary)}</div>
  `;
  wrap.appendChild(banner);

  if (result.note) {
    const note = document.createElement("div");
    note.className = "note-box";
    note.textContent = result.note;
    wrap.appendChild(note);
  }

  if (result.procedures && result.procedures.length > 0) {
    const procBlock = document.createElement("div");
    procBlock.className = "result-block";
    const procHeading = document.createElement("h3");
    procHeading.textContent = "必要となりうる手続き";
    procBlock.appendChild(procHeading);
    for (const proc of result.procedures) {
      procBlock.appendChild(renderCitationCard(proc));
    }
    wrap.appendChild(procBlock);
  }

  const metiBox = document.createElement("div");
  metiBox.className = "note-box";
  metiBox.innerHTML = `${escapeHtml(METI_REFERENCE.label)} <a href="${METI_REFERENCE.url}" target="_blank" rel="noopener">経済産業省「液化石油ガスの保安の確保及び取引の適正化に関する法律」関係法令ページを見る ↗</a>`;
  wrap.appendChild(metiBox);

  const citeBlock = document.createElement("div");
  citeBlock.className = "result-block";
  const citeHeading = document.createElement("h3");
  citeHeading.textContent = "判定の根拠条文";
  citeBlock.appendChild(citeHeading);

  for (const citation of result.citations) {
    citeBlock.appendChild(renderCitationCard(citation));
  }
  wrap.appendChild(citeBlock);

  const actions = document.createElement("div");
  actions.className = "diag-actions";
  const retryBtn = document.createElement("button");
  retryBtn.type = "button";
  retryBtn.className = "btn-primary";
  retryBtn.textContent = "もう一度回答する";
  retryBtn.addEventListener("click", () => selectActionType(ACTION_TYPES.find((a) => a.id === appState.diag.actionType)));
  actions.appendChild(retryBtn);
  wrap.appendChild(actions);

  return wrap;
}

function renderCitationCard(citation) {
  const key = `${citation.lawId}:${citation.num}`;
  const card = document.createElement("div");
  card.className = "citation-card";

  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "citation-toggle";
  const expanded = appState.diag.expandedCitations.has(key);
  toggle.textContent = `${expanded ? "▾" : "▸"} ${citation.label}`;
  toggle.addEventListener("click", () => toggleCitation(citation));
  card.appendChild(toggle);

  if (expanded) {
    const body = document.createElement("div");
    body.className = "citation-body";
    const cached = appState.diag.citationCache.get(key);
    if (!cached || cached.status === "loading") {
      body.innerHTML = `<div class="loading">条文を読み込んでいます…</div>`;
    } else if (cached.status === "error") {
      body.innerHTML = `<div class="error-box">条文の取得に失敗しました。(${escapeHtml(cached.message || "")})</div>`;
    } else if (cached.status === "notfound") {
      body.innerHTML = `<div class="error-box">該当条文が見つかりませんでした。</div>`;
    } else {
      body.innerHTML = renderArticle(cached.article.node);
    }
    card.appendChild(body);
  }

  return card;
}

async function toggleCitation(citation) {
  const key = `${citation.lawId}:${citation.num}`;
  if (appState.diag.expandedCitations.has(key)) {
    appState.diag.expandedCitations.delete(key);
    render();
    return;
  }
  appState.diag.expandedCitations.add(key);
  render();

  if (appState.diag.citationCache.has(key)) return;
  appState.diag.citationCache.set(key, { status: "loading" });
  try {
    const lawMeta = findLawMeta(citation.lawId);
    const lawData = await loadLawData(lawMeta);
    const mainProvision = getMainProvision(lawData);
    const article = findArticleByNum(mainProvision, citation.num);
    appState.diag.citationCache.set(key, article ? { status: "ready", article } : { status: "notfound" });
  } catch (err) {
    console.error(err);
    appState.diag.citationCache.set(key, { status: "error", message: err.message });
  }
  render();
}

async function restoreDiagnosisFromHistory(entry) {
  appState.mode = "diagnosis";
  const steps = getStepsForAction(entry.actionType, entry.answers);
  appState.diag = {
    actionType: entry.actionType,
    stepIndex: Math.max(0, steps.length - 1),
    answers: { ...entry.answers },
    result: evaluateDiagnosis(entry.actionType, entry.answers),
    expandedCitations: new Set(),
    citationCache: new Map(),
  };
  render();
}

/* =========================================================
   条文ブラウズモード (browse) — 法令 → 章 → 節 → 条
   ========================================================= */

function resetBrowse() {
  appState.browse = {
    law: null,
    lawData: null,
    lawTitle: "",
    chapters: [],
    chapter: null,
    section: null,
    article: null,
  };
  render();
}

async function selectLaw(lawMeta, { forceRefresh = false } = {}) {
  const b = appState.browse;
  b.law = lawMeta;
  b.chapter = null;
  b.section = null;
  b.article = null;
  renderBrowseLoading(`${lawMeta.title} を読み込んでいます…`);

  try {
    const lawData = await loadLawData(lawMeta, { forceRefresh });
    b.lawData = lawData;
    b.lawTitle = getLawTitle(lawData) || lawMeta.title;
    const mainProvision = getMainProvision(lawData);
    b.chapters = buildChapters(mainProvision);

    if (b.chapters.length === 0) {
      renderBrowseError("この法令から条文構造を読み取れませんでした。");
      return;
    }

    if (b.chapters.length === 1 && b.chapters[0].num === null) {
      selectChapter(b.chapters[0]);
      return;
    }

    render();
  } catch (err) {
    console.error(err);
    renderBrowseError(`法令データの取得に失敗しました。時間をおいて再度お試しください。\n(${err.message})`);
  }
}

function selectChapter(chapter) {
  appState.browse.chapter = chapter;
  appState.browse.section = null;
  appState.browse.article = null;
  render();
}

function selectSection(section) {
  appState.browse.section = section;
  appState.browse.article = null;
  render();
}

async function selectArticle(article) {
  const b = appState.browse;
  b.article = article;
  render();

  try {
    await addHistoryEntry({
      type: "article",
      lawId: b.law.lawId,
      lawShortName: b.law.shortName,
      lawTitle: b.lawTitle,
      chapterNum: b.chapter ? b.chapter.num : null,
      chapterTitle: b.chapter ? b.chapter.title : null,
      sectionNum: b.section ? b.section.num : null,
      sectionTitle: b.section ? b.section.title : null,
      articleNum: article.num,
      articleTitle: article.title,
      articleCaption: article.caption,
    });
    await renderHistory();
  } catch (err) {
    console.error("履歴の保存に失敗しました", err);
  }
}

async function restoreArticleFromHistory(entry) {
  const lawMeta = TARGET_LAWS.find((l) => l.lawId === entry.lawId);
  if (!lawMeta) {
    showToast("対象法令の情報が見つかりませんでした。", true);
    return;
  }
  appState.mode = "browse";
  renderBrowseLoading(`${entry.lawTitle || lawMeta.title} を読み込んでいます…`);
  try {
    const lawData = await loadLawData(lawMeta);
    const b = appState.browse;
    b.law = lawMeta;
    b.lawData = lawData;
    b.lawTitle = getLawTitle(lawData) || lawMeta.title;
    const mainProvision = getMainProvision(lawData);
    b.chapters = buildChapters(mainProvision);

    let chapter = null;
    if (entry.chapterNum !== null && entry.chapterNum !== undefined) {
      chapter = b.chapters.find((c) => c.num === entry.chapterNum) || null;
    } else if (b.chapters.length === 1 && b.chapters[0].num === null) {
      chapter = b.chapters[0];
    }
    b.chapter = chapter;

    let section = null;
    if (chapter && entry.sectionNum !== null && entry.sectionNum !== undefined) {
      section = chapter.sections.find((s) => s.num === entry.sectionNum) || null;
    }
    b.section = section;

    const pool = section ? section.articles : chapter ? chapter.articles : [];
    const article = pool.find((a) => a.num === entry.articleNum) || null;

    if (!article) {
      showToast("この条文は法令の改正等により見つかりませんでした。最新の目次から探してください。", true);
      b.article = null;
      render();
      return;
    }

    b.article = article;
    render();
  } catch (err) {
    console.error(err);
    renderBrowseError(`履歴からの復元に失敗しました。\n(${err.message})`);
  }
}

function renderBrowseLoading(message) {
  stageEl.innerHTML = `<div class="loading">${escapeHtml(message)}</div>`;
  renderBrowseBreadcrumb();
}

function renderBrowseError(message) {
  stageEl.innerHTML = `<div class="error-box">${escapeHtml(message)}</div>`;
  renderBrowseBreadcrumb();
}

function renderBrowseBreadcrumb() {
  breadcrumbEl.innerHTML = "";
  const b = appState.browse;

  breadcrumbEl.appendChild(crumbButton("法令選択", () => resetBrowse()));
  if (!b.law) return;

  breadcrumbEl.appendChild(crumbSep());
  if (b.chapter || b.chapters.length <= 1) {
    breadcrumbEl.appendChild(crumbButton(b.law.shortName, () => selectLaw(b.law)));
  } else {
    breadcrumbEl.appendChild(crumbCurrent(b.law.shortName));
  }

  if (!b.chapter || b.chapter.num === null) return;

  breadcrumbEl.appendChild(crumbSep());
  if (b.section || b.article) {
    breadcrumbEl.appendChild(crumbButton(b.chapter.title, () => selectChapter(b.chapter)));
  } else {
    breadcrumbEl.appendChild(crumbCurrent(b.chapter.title));
  }

  if (b.section) {
    breadcrumbEl.appendChild(crumbSep());
    if (b.article) {
      breadcrumbEl.appendChild(crumbButton(b.section.title, () => selectSection(b.section)));
    } else {
      breadcrumbEl.appendChild(crumbCurrent(b.section.title));
    }
  }

  if (b.article) {
    breadcrumbEl.appendChild(crumbSep());
    breadcrumbEl.appendChild(crumbCurrent(b.article.title));
  }
}

function renderBrowseStage() {
  stageEl.innerHTML = "";
  const b = appState.browse;

  if (!b.law) {
    stageEl.appendChild(renderLawStage());
    return;
  }
  if (!b.chapter) {
    stageEl.appendChild(renderChapterStage());
    return;
  }
  if (b.chapter.sections.length > 0 && !b.section) {
    stageEl.appendChild(renderSectionStage());
    return;
  }
  if (!b.article) {
    stageEl.appendChild(renderArticleListStage());
    return;
  }
  stageEl.appendChild(renderArticleStage());
}

function renderLawStage() {
  const wrap = document.createElement("div");
  wrap.className = "stage";
  const h2 = document.createElement("h2");
  h2.textContent = "対象法令を選択してください";
  wrap.appendChild(h2);

  const grid = document.createElement("div");
  grid.className = "card-grid";
  for (const law of TARGET_LAWS) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "pick-card";
    card.innerHTML = `<span class="pick-title">${escapeHtml(law.shortName)}</span><span class="pick-sub">${escapeHtml(law.title)}</span>`;
    card.addEventListener("click", () => selectLaw(law));
    grid.appendChild(card);
  }
  wrap.appendChild(grid);
  return wrap;
}

function renderChapterStage() {
  const b = appState.browse;
  const wrap = document.createElement("div");
  wrap.className = "stage";

  const toolbar = document.createElement("div");
  toolbar.className = "toolbar";
  const refreshBtn = document.createElement("button");
  refreshBtn.type = "button";
  refreshBtn.className = "btn-link";
  refreshBtn.textContent = "⟲ 最新版を再取得";
  refreshBtn.addEventListener("click", () => selectLaw(b.law, { forceRefresh: true }));
  toolbar.appendChild(refreshBtn);
  wrap.appendChild(toolbar);

  const h2 = document.createElement("h2");
  h2.textContent = `${b.lawTitle} — 章を選択してください`;
  wrap.appendChild(h2);

  const list = document.createElement("div");
  list.className = "pick-list";
  for (const chapter of b.chapters) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "pick-card";
    card.innerHTML = `<span class="pick-title">${escapeHtml(chapter.title)}</span>`;
    card.addEventListener("click", () => selectChapter(chapter));
    list.appendChild(card);
  }
  wrap.appendChild(list);
  return wrap;
}

function renderSectionStage() {
  const b = appState.browse;
  const wrap = document.createElement("div");
  wrap.className = "stage";
  const h2 = document.createElement("h2");
  h2.textContent = `${b.chapter.title} — 節を選択してください`;
  wrap.appendChild(h2);

  const list = document.createElement("div");
  list.className = "pick-list";

  if (b.chapter.articles.length > 0) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "pick-card";
    card.innerHTML = `<span class="pick-title">（節に属さない条）</span><span class="pick-sub">${b.chapter.articles.length}条</span>`;
    card.addEventListener("click", () =>
      selectSection({ key: `${b.chapter.key}-direct`, num: null, title: null, articles: b.chapter.articles })
    );
    list.appendChild(card);
  }

  for (const section of b.chapter.sections) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "pick-card";
    card.innerHTML = `<span class="pick-title">${escapeHtml(section.title)}</span><span class="pick-sub">${section.articles.length}条</span>`;
    card.addEventListener("click", () => selectSection(section));
    list.appendChild(card);
  }

  wrap.appendChild(list);
  return wrap;
}

function renderArticleListStage() {
  const b = appState.browse;
  const wrap = document.createElement("div");
  wrap.className = "stage";
  const scopeTitle = b.section && b.section.title ? b.section.title : b.chapter.title;
  const h2 = document.createElement("h2");
  h2.textContent = `${scopeTitle} — 条を選択してください`;
  wrap.appendChild(h2);

  const articles = b.section ? b.section.articles : b.chapter.articles;

  const list = document.createElement("div");
  list.className = "pick-list";
  for (const article of articles) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "pick-card";
    card.innerHTML = `<span class="pick-title">${escapeHtml(article.title)}</span>${
      article.caption ? `<span class="pick-sub">${escapeHtml(article.caption)}</span>` : ""
    }`;
    card.addEventListener("click", () => selectArticle(article));
    list.appendChild(card);
  }
  wrap.appendChild(list);
  return wrap;
}

function renderArticleStage() {
  const wrap = document.createElement("div");
  wrap.innerHTML = renderArticle(appState.browse.article.node);
  return wrap;
}

/* =========================================================
   照会履歴パネル (共通)
   ========================================================= */

function formatTimestamp(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function renderHistory() {
  const entries = await listHistory();
  historyListEl.innerHTML = "";

  if (entries.length === 0) {
    const empty = document.createElement("li");
    empty.className = "history-empty";
    empty.textContent = "まだ照会履歴はありません。";
    historyListEl.appendChild(empty);
    return;
  }

  for (const entry of entries) {
    const li = document.createElement("li");
    li.className = "history-item";
    const type = entry.type || "article";

    if (type === "diagnosis") {
      li.innerHTML = `
        <span class="h-law">診断・${escapeHtml(entry.actionLabel || "")}</span>
        <span class="h-title">${escapeHtml(verdictLabel(entry.verdict))} — ${escapeHtml(entry.title || "")}</span>
        <span class="h-time">${formatTimestamp(entry.timestamp)}</span>
      `;
      li.addEventListener("click", () => restoreDiagnosisFromHistory(entry));
    } else {
      const scope = [entry.chapterTitle, entry.sectionTitle].filter(Boolean).join(" / ");
      li.innerHTML = `
        <span class="h-law">${escapeHtml(entry.lawShortName || "")}</span>
        <span class="h-title">${escapeHtml(entry.articleTitle || "")}${entry.articleCaption ? " " + escapeHtml(entry.articleCaption) : ""}</span>
        <span class="h-time">${scope ? escapeHtml(scope) + " ・ " : ""}${formatTimestamp(entry.timestamp)}</span>
      `;
      li.addEventListener("click", () => restoreArticleFromHistory(entry));
    }

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "h-delete";
    delBtn.textContent = "×";
    delBtn.title = "この履歴を削除";
    delBtn.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      await deleteHistoryEntry(entry.id);
      renderHistory();
    });
    li.appendChild(delBtn);

    historyListEl.appendChild(li);
  }
}

clearHistoryBtn.addEventListener("click", async () => {
  if (!confirm("照会履歴をすべて削除しますか？この操作は取り消せません。")) return;
  await clearHistory();
  renderHistory();
});

// --- 初期化 ---

render();
renderHistory();

  </script>
