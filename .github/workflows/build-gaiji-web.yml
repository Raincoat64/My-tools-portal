name: Build gaiji web edition

on:
  push:
    branches: [main]
    paths:
      - 'tools/gaiji-maker-source/**'
      - '.github/workflows/build-gaiji-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gaiji-web-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
          python -m pip install --upgrade pip
          pip install "fonttools[woff]" pycairo brotli

      - name: Restore official-source cache
        uses: actions/cache@v4
        with:
          path: .cache/gaiji
          key: gaiji-official-sources-v20260818

      - name: Reconstruct web template
        run: |
          cat tools/gaiji-maker-source/template.b64.part* | base64 -d | gzip -d > /tmp/gaiji-template.html
          test -s /tmp/gaiji-template.html

      - name: Build web edition
        run: |
          rm -rf /tmp/gaiji-out
          mkdir -p /tmp/gaiji-out
          python tools/gaiji-maker-source/build.py \
            --template /tmp/gaiji-template.html \
            --output-dir /tmp/gaiji-out \
            --inputs .cache/gaiji
          python tools/gaiji-maker-source/normalize_web_html.py \
            /tmp/gaiji-out/gaiji-maker.html \
            /tmp/gaiji-out/gaiji-maker-build-report.json
          python tools/gaiji-maker-source/prune_web_html.py \
            /tmp/gaiji-out/gaiji-maker.html \
            /tmp/gaiji-out/gaiji-maker-build-report.json
          rm -rf tools/gaiji-maker-assets
          cp /tmp/gaiji-out/gaiji-maker.html tools/gaiji-maker.html
          cp /tmp/gaiji-out/gaiji-maker-build-report.json tools/gaiji-maker-build-report.json
          cp -R /tmp/gaiji-out/gaiji-maker-assets tools/gaiji-maker-assets

      - name: Verify generated files
        run: |
          test -s tools/gaiji-maker.html
          test -s tools/gaiji-maker-assets/records.pack
          test -s tools/gaiji-maker-assets/features.pack
          test -s tools/gaiji-maker-assets/relations.pack
          test -s tools/gaiji-maker-assets/ipamjm.pack
          test -s tools/gaiji-maker-assets/acgjm.pack
          python -m json.tool tools/gaiji-maker-build-report.json >/dev/null
          test "$(grep -c 'function showManualCopyFallback(text)' tools/gaiji-maker.html)" -eq 1
          ! grep -q 'kyujitai.js' tools/gaiji-maker.html
          ! grep -q '単一HTMLで配布可能' tools/gaiji-maker.html
          ! grep -q '本HTMLへ内蔵' tools/gaiji-maker.html
          ! grep -q 'CharacterRepository.mode' tools/gaiji-maker.html
          ! grep -q 'gunzipBytes' tools/gaiji-maker.html
          ! grep -q 'char-list' tools/gaiji-maker.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('tools/gaiji-maker.html').read_text('utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f'expected 1 inline script, found {len(scripts)}')
          Path('/tmp/gaiji-generated.js').write_text(scripts[0], 'utf-8')
          PY
          node --check /tmp/gaiji-generated.js

      - name: Commit generated Pages assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/gaiji-maker.html tools/gaiji-maker-build-report.json tools/gaiji-maker-assets
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
            exit 0
          fi
          git commit -m "Build gaiji web edition [skip ci]"
          git push
