<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="奈良県の高圧ガス手続き、公式様式、必要書類とe-Govの根拠条文を確認する参考ツール。" />
  <title>高圧ガス手続きナビ | 奈良県向け</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <a class="skip-link" href="#stage">本文へ移動</a>
  <header class="app-header">
    <div class="header-brand"><span class="brand-mark" aria-hidden="true">高</span><div><h1>高圧ガス手続きナビ</h1><p class="app-region">奈良県向け・参考ツール</p></div></div>
    <a class="official-header-link" href="https://www.pref.nara.lg.jp/n011/39583.html" target="_blank" rel="noopener noreferrer">奈良県の公式案内 ↗</a>
  </header>
  <div class="app-layout">
    <aside class="app-sidebar no-print" aria-label="ナビゲーション">
      <nav class="mode-tabs" id="mode-tabs" aria-label="メインメニュー">
        <button type="button" class="mode-tab" data-mode="home"><span class="nav-symbol" aria-hidden="true">⌂</span>目的から探す</button>
        <button type="button" class="mode-tab" data-mode="catalogue"><span class="nav-symbol" aria-hidden="true">≡</span>手続き・様式</button>
        <button type="button" class="mode-tab" data-mode="browse"><span class="nav-symbol" aria-hidden="true">§</span>法令・例示基準</button>
      </nav>
      <details class="history-panel"><summary>この端末の照会履歴</summary>
        <div class="history-header"><h2>照会履歴</h2><button id="clear-history-btn" class="btn-link" type="button">すべて削除</button></div>
        <ul class="history-list" id="history-list"></ul>
      </details>
      <div class="sidebar-meta"><span>案内確認日</span><time id="review-date"></time><a href="https://laws.e-gov.go.jp/" target="_blank" rel="noopener noreferrer">法令出典：e-Gov ↗</a></div>
    </aside>
    <main class="main-panel">
      <nav class="breadcrumb" id="breadcrumb" aria-label="選択パンくず"></nav>
      <p id="storage-status" class="storage-status" role="status" hidden></p>
      <p id="legacy-history-notice" class="note-box no-print" role="status" hidden></p>
      <section class="stage" id="stage" tabindex="-1" aria-label="手続き・法令の表示"></section>
    </main>
  </div>
  <footer class="app-footer"><span>県の公式サイトではありません。</span><span>一般則・液石則・冷凍則 ／ 条文閲覧：容器則・法・施行令</span></footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>JavaScriptを有効にしてください。「奈良県の公式案内」からも手続き・様式を確認できます。</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
